<!doctype html>
<html lang="fr">
<head>
<title>Bourdi'NERF</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* Tout est dessiné dans le canvas ; seul le champ du pseudo est en HTML */
:root{color-scheme:dark;--bg:#1d1530}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#pseudo{position:fixed;box-sizing:border-box;border:4px solid #1d1530;border-radius:16px;background:#fff6e0;color:#1d1530;
  font:900 24px/1 ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;text-align:center;
  padding:0 10px;outline:none;-webkit-user-select:text;user-select:text;touch-action:manipulation}
#pseudo:focus{border-color:#ff4fa3}
</style>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bourdi'NERF">
<meta name="theme-color" content="#1d1530">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
</head>
<body>

<canvas id="c" aria-label="Bourdi'NERF, épreuves d'arcade"></canvas>
<input id="pseudo" hidden maxlength="12" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Ton pseudo">
<!-- MOTEUR -->
<script>
'use strict';
// =====================================================================
//  Bourdi'NERF — MOTEUR COMMUN
//  Accueil, pseudo, menu, présentation, pause, résultats, classement,
//  rangs E→S, records, sons, musique, animations.
//  Les épreuves sont des modules à part (src/epreuves/*.js) qui
//  s'enregistrent avec Bourdi.ajouter({...}) — voir CONTRAT plus bas.
// =====================================================================

// ---------- Écran : monde logique 360×720, mis à l'échelle et centré ----------
const W = 360, H = 720;
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
let scale = 1, offX = 0, offY = 0, dpr = 1;
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = innerWidth, h = innerHeight;
  cvs.width = Math.round(w * dpr); cvs.height = Math.round(h * dpr);
  scale = Math.min(w / W, h / H); offX = (w - W * scale) / 2; offY = (h - H * scale) / 2;
}
addEventListener('resize', resize); resize();

// ---------- Couleurs (palette vive de la DA) ----------
const COL = {
  ink: '#1d1530', white: '#ffffff', cream: '#fff6e0',
  red: '#ff3b3b', orange: '#ff8a1f', yellow: '#ffd21f', sky: '#5ec8ff', blue: '#2f6bff',
  green: '#7ad81e', pink: '#ff4fa3', violet: '#8a3ffc', grey: '#9a8fb0'
};
const RANKS = ['E', 'D', 'C', 'B', 'A', 'S'];
const RANK_COL = { S: COL.yellow, A: COL.pink, B: COL.blue, C: COL.green, D: COL.orange, E: COL.grey };
const RANK_TXT = { S: 'INCROYABLE !', A: 'Excellent !', B: 'Très bien !', C: 'Pas mal !', D: 'Bof…', E: 'Aïe aïe aïe…' };
const UNLOCK = 'C';                       // rang à obtenir pour ouvrir l'épreuve suivante
const rankIdx = r => RANKS.indexOf(r);

// ---------- Sauvegarde ----------
const KEY = 'bourdinerf-v1';
const randId = () => Array.from({ length: 20 }, () => 'abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random() * 36)]).join('');
let SAVE = (() => {
  let s = null; try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  return Object.assign({ id: randId(), name: '', music: true, sound: true, rec: {}, test: false }, s || {});
})();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(SAVE)); } catch (e) {} }
save();
const recOf = id => SAVE.rec[id] || (SAVE.rec[id] = { best: null, rank: null, tries: 0 });

// ---------- Dessin : utilitaires partagés ----------
const FONT = 'ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif';
function rr(x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function blob(x, y, w, h, r, fill, lw = 4, stroke = COL.ink){
  rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
  if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function circle(x, y, r, fill, lw = 4, stroke = COL.ink){
  ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
}
// texte cartoon : contour épais + petite ombre portée
function txt(s, x, y, size, fill = COL.white, o = {}){
  ctx.save();
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (o.max){ const w = ctx.measureText(s).width; if (w > o.max){ const k = o.max / w; ctx.translate(x, y); ctx.scale(k, k); x = 0; y = 0; } }
  const lw = o.lw != null ? o.lw : Math.max(3, size * .2);
  if (lw > 0){
    if (o.shadow !== false){ ctx.strokeStyle = ctx.fillStyle = o.shadow || COL.ink; ctx.lineWidth = lw; ctx.strokeText(s, x, y + size * .09); ctx.fillText(s, x, y + size * .09); }
    ctx.strokeStyle = o.stroke || COL.ink; ctx.lineWidth = lw; ctx.strokeText(s, x, y);
  }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
  ctx.restore();
}
function wrap(s, maxW, size){
  ctx.font = `900 ${size}px ${FONT}`;
  const out = []; let line = '';
  s.split(' ').forEach(w => { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line){ out.push(line); line = w; } else line = t; });
  if (line) out.push(line); return out;
}
// gros chiffres de score (blanc, contour violet, ombre rose)
function bigNum(s, x, y, size, o = {}){
  txt(s, x, y, size, o.fill || COL.white, { stroke: o.stroke || COL.violet, shadow: o.shadow || COL.pink, lw: size * .22, align: o.align || 'center' });
}
// rayons de soleil qui tournent (fond arcade)
function sunburst(cx, cy, c1, c2, rot, n = 16){
  ctx.fillStyle = c1; ctx.fillRect(-400, -400, W + 800, H + 800);
  ctx.fillStyle = c2;
  for (let i = 0; i < n; i++){
    const a = rot + i * Math.PI * 2 / n;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, 1200, a, a + Math.PI / n); ctx.closePath(); ctx.fill();
  }
}

// ---------- Boutons (dessinés à chaque image, touchés à l'image suivante) ----------
let buttons = [], pressId = null; const popAt = {};
function button(id, x, y, w, h, label, o = {}){
  buttons.push({ id, x, y, w, h });
  const down = pressId === id, pop = popAt[id] != null ? Math.max(0, 1 - (T - popAt[id]) / .3) : 0;
  const s = down ? .94 : 1 + Math.sin(pop * Math.PI) * .07 + (o.pulse ? Math.sin(T * 6) * .025 : 0);
  const r = o.r != null ? o.r : Math.min(22, h * .35);
  ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.scale(s, s);
  const dy = down ? 4 : 0;
  rr(-w / 2, -h / 2 + 6, w, h, r); ctx.fillStyle = COL.ink; ctx.fill();
  blob(-w / 2, -h / 2 + dy, w, h, r, o.color || COL.yellow, 4);
  rr(-w / 2 + 7, -h / 2 + dy + 5, w - 14, h * .32, r * .6); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fill();
  if (typeof label === 'function') label(0, dy);
  else if (label) txt(label, 0, dy + 1, o.size || Math.min(30, h * .45), o.fg || COL.white, { max: w - 20 });
  ctx.restore();
}
const hit = p => { for (let i = buttons.length - 1; i >= 0; i--){ const b = buttons[i]; if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return b; } return null; };

// ---------- Icônes ----------
function icoNote(on){ return (x, y) => {
  ctx.save(); ctx.translate(x, y); ctx.strokeStyle = COL.ink; ctx.fillStyle = COL.white; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(-6, 8, 6, 5, -.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(9, 4, 6, 5, -.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, 7); ctx.lineTo(0, -12); ctx.lineTo(15, -16); ctx.lineTo(15, 3); ctx.stroke();
  if (!on){ ctx.strokeStyle = COL.red; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-14, -14); ctx.lineTo(16, 16); ctx.stroke(); }
  ctx.restore(); }; }
function icoSpeaker(on){ return (x, y) => {
  ctx.save(); ctx.translate(x - 4, y); ctx.fillStyle = COL.white; ctx.strokeStyle = COL.ink; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-10, -5); ctx.lineTo(-3, -5); ctx.lineTo(6, -13); ctx.lineTo(6, 13); ctx.lineTo(-3, 5); ctx.lineTo(-10, 5); ctx.closePath(); ctx.fill(); ctx.stroke();
  if (on){ ctx.lineWidth = 3; ctx.strokeStyle = COL.white; ctx.beginPath(); ctx.arc(8, 0, 8, -.9, .9); ctx.stroke(); ctx.beginPath(); ctx.arc(8, 0, 14, -.9, .9); ctx.stroke(); }
  else { ctx.strokeStyle = COL.red; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-10, -14); ctx.lineTo(20, 16); ctx.stroke(); }
  ctx.restore(); }; }
const icoPause = (x, y) => { blob(x - 10, y - 12, 7, 24, 2, COL.white, 3); blob(x + 3, y - 12, 7, 24, 2, COL.white, 3); };
const icoBack = (x, y) => {
  ctx.save(); ctx.translate(x, y); ctx.fillStyle = COL.white; ctx.strokeStyle = COL.ink; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(0, -13); ctx.lineTo(0, -6); ctx.lineTo(13, -6); ctx.lineTo(13, 6); ctx.lineTo(0, 6); ctx.lineTo(0, 13); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore(); };
function icoLock(x, y, s = 1){
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.lineWidth = 7; ctx.strokeStyle = COL.ink; ctx.beginPath(); ctx.arc(0, -10, 13, Math.PI, 0); ctx.lineTo(13, 0); ctx.moveTo(-13, 0); ctx.lineTo(-13, -10); ctx.stroke();
  ctx.lineWidth = 3; ctx.strokeStyle = '#d9d9e6'; ctx.beginPath(); ctx.arc(0, -10, 13, Math.PI, 0); ctx.stroke();
  blob(-20, -4, 40, 32, 7, COL.yellow, 4); circle(0, 9, 4, COL.ink, 0); ctx.fillStyle = COL.ink; ctx.fillRect(-2, 9, 4, 9);
  ctx.restore();
}
// pastille de rang
function rankBadge(r, x, y, size){
  const c = RANK_COL[r] || '#ddd';
  circle(x, y + size * .06, size * .5, COL.ink, 0);
  circle(x, y, size * .5, c, Math.max(3, size * .07));
  txt(r || '–', x, y + size * .03, size * .62, r ? COL.white : '#bbb', { lw: size * .1, shadow: false });
}

// ---------- Effets : secousse, particules, textes volants ----------
let shakeT = 0, shakeA = 0;
const parts = [], floats = [];
function secousse(a = 8, d = .3){ shakeA = Math.max(shakeA, a); shakeT = Math.max(shakeT, d); }
const CONFETTI = [COL.red, COL.orange, COL.yellow, COL.sky, COL.blue, COL.green, COL.pink, COL.violet];
function particules(x, y, n = 20, o = {}){
  for (let i = 0; i < n; i++){
    const a = o.angle != null ? o.angle + (Math.random() - .5) * (o.spread || 1) : Math.random() * Math.PI * 2;
    const v = (o.speed || 260) * (.4 + Math.random() * .8);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (o.up || 0), g: o.g != null ? o.g : 600, life: o.life || 1, t: 0,
      c: (o.colors || CONFETTI)[Math.floor(Math.random() * (o.colors || CONFETTI).length)], s: (o.size || 7) * (.6 + Math.random() * .8), rot: Math.random() * 6, vr: (Math.random() - .5) * 12, shape: o.shape || 'conf' });
  }
}
function texteVolant(s, x, y, o = {}){ floats.push({ s, x, y, t: 0, dur: o.dur || 1, size: o.size || 26, c: o.color || COL.white, vy: o.vy != null ? o.vy : -50 }); }
function updFx(dt){
  for (let i = parts.length - 1; i >= 0; i--){ const p = parts[i]; p.t += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; if (p.t > p.life) parts.splice(i, 1); }
  for (let i = floats.length - 1; i >= 0; i--){ const f = floats[i]; f.t += dt; f.y += f.vy * dt; if (f.t > f.dur) floats.splice(i, 1); }
  if (shakeT > 0){ shakeT -= dt; if (shakeT <= 0) shakeA = 0; }
}
function drawFx(){
  parts.forEach(p => {
    ctx.save(); ctx.globalAlpha = Math.min(1, (p.life - p.t) * 3); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
    if (p.shape === 'star'){ star(0, 0, p.s, p.c); } else if (p.shape === 'drop'){ circle(0, 0, p.s * .6, p.c, 0); } else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
    ctx.restore();
  });
  floats.forEach(f => {
    const k = f.t / f.dur, pop = f.t < .12 ? .6 + f.t / .12 * .5 : f.t < .2 ? 1.1 - (f.t - .12) / .08 * .1 : 1;
    ctx.save(); ctx.globalAlpha = k > .75 ? (1 - k) * 4 : 1; ctx.translate(f.x, f.y); ctx.scale(pop, pop);
    txt(f.s, 0, 0, f.size, f.c); ctx.restore();
  });
}
function star(x, y, r, fill, lw = 0){
  ctx.beginPath();
  for (let i = 0; i < 10; i++){ const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); if (lw){ ctx.lineWidth = lw; ctx.strokeStyle = COL.ink; ctx.lineJoin = 'round'; ctx.stroke(); }
}

// ---------- Son : tout est synthétisé (aucun fichier) ----------
let actx = null, sfxBus = null, musicBus = null, noiseBuf = null;
const MUSIC_VOL = .22;
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
function audioOn(){
  if (actx){ if (actx.state === 'suspended') actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e){ return; }
  sfxBus = actx.createGain(); sfxBus.gain.value = .9; sfxBus.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = SAVE.music ? MUSIC_VOL : 0; musicBus.connect(actx.destination);
  Music.boot();
}
function noise(){
  if (!noiseBuf){ noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = actx.createBufferSource(); s.buffer = noiseBuf; return s;
}
function tone(t, f, d, v, type = 'sine', f2, bus = sfxBus){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(bus); o.start(t); o.stop(t + d + .05);
}
function burst(t, d, v, type, freq, q = 1, bus = sfxBus, freq2){
  const n = noise(), f = actx.createBiquadFilter(), g = actx.createGain(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  if (freq2) f.frequency.exponentialRampToValueAtTime(freq2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); n.connect(f).connect(g).connect(bus); n.start(t); n.stop(t + d + .02);
}
const canSfx = () => SAVE.sound && actx;
const arp = (t, notes, gap, d, v, type = 'square') => notes.forEach((m, i) => tone(t + i * gap, midiHz(m), d, v, type));
const sfx = {
  tap(){ if (!canSfx()) return; const t = actx.currentTime; tone(t, 660, .07, .07, 'square', 990); },
  go(){ if (!canSfx()) return; const t = actx.currentTime; burst(t, .35, .12, 'bandpass', 500, 2, sfxBus, 3000); arp(t + .08, [72, 79, 84], .07, .18, .08); },
  tick(){ if (!canSfx()) return; tone(actx.currentTime, 1500, .03, .04, 'square'); },
  bien(){ if (!canSfx()) return; const t = actx.currentTime; arp(t, [76, 83], .06, .14, .07, 'triangle'); },
  erreur(){ if (!canSfx()) return; const t = actx.currentTime; tone(t, 160, .25, .1, 'sawtooth', 110); tone(t, 166, .25, .06, 'square', 113); },
  fin(){ if (!canSfx()) return; const t = actx.currentTime; tone(t, 2200, .12, .07, 'square'); tone(t + .15, 2200, .3, .07, 'square'); burst(t, .45, .05, 'bandpass', 3000, 4); },
  valide(){ if (!canSfx()) return; const t = actx.currentTime; burst(t, .12, .2, 'lowpass', 900, 1); tone(t, 140, .2, .2, 'sine', 60); },
  record(){ if (!canSfx()) return; const t = actx.currentTime; arp(t, [79, 84, 88, 91, 96], .07, .2, .07); arp(t + .02, [67, 72, 76, 79, 84], .07, .2, .04, 'triangle'); },
  rang(r){
    if (!canSfx()) return; const t = actx.currentTime;
    if (r === 'E'){ [62, 61, 60, 59].forEach((m, i) => { tone(t + i * .28, midiHz(m), i === 3 ? .7 : .26, .09, 'sawtooth', i === 3 ? midiHz(m) * .94 : 0); }); }
    else if (r === 'D'){ arp(t, [60, 55], .2, .3, .08, 'triangle'); }
    else if (r === 'C'){ arp(t, [60, 64, 67], .1, .22, .07, 'triangle'); }
    else if (r === 'B'){ arp(t, [60, 64, 67, 72], .08, .2, .07); }
    else if (r === 'A'){ arp(t, [64, 67, 71, 76, 79], .07, .22, .07); burst(t + .35, .3, .05, 'highpass', 6000, 1); }
    else if (r === 'S'){
      // fanfare : montée, accord tenu, scintillement
      arp(t, [60, 64, 67, 72, 76, 79], .06, .2, .06);
      [72, 76, 79, 84].forEach(m => { tone(t + .4, midiHz(m), 1.1, .05, 'square'); tone(t + .4, midiHz(m) * 1.003, 1.1, .04, 'sawtooth'); });
      for (let i = 0; i < 12; i++) tone(t + .45 + i * .06, midiHz(96 + (i % 4) * 3), .12, .03, 'sine');
      burst(t + .38, .8, .08, 'highpass', 7000, 1);
    }
  }
};

// ---------- Musique : boucles électroniques rétro ----------
const Music = (() => {
  const SONGS = {
    menu: { bpm: 138, lead: [
      72,0,76,0,79,0,76,0, 77,76,74,0,72,0,0,0,  69,0,72,0,76,0,72,0, 74,72,71,0,69,0,0,0,
      65,0,69,0,72,0,77,0, 76,0,74,0,72,0,69,0,  71,0,74,0,79,0,77,76, 74,0,71,0,67,0,0,0],
      roots: [48, 45, 41, 43] },
    jeu: { bpm: 164, lead: [
      69,0,69,72,0,69,76,0, 74,0,72,0,69,0,67,0,  65,0,65,69,0,65,72,0, 71,0,69,0,65,0,64,0,
      64,0,64,67,0,64,72,0, 71,0,72,0,74,0,76,0,  74,0,71,0,67,0,71,0, 74,0,79,0,78,0,79,0],
      roots: [45, 41, 48, 43] }
  };
  let song = 'menu', step = 0, next = 0, timer = null;
  function lead(t, m, d){
    const o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
    o.type = 'square'; o.frequency.value = midiHz(m); f.type = 'lowpass'; f.frequency.value = 3200;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.09, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(f).connect(g).connect(musicBus); o.start(t); o.stop(t + d + .05);
  }
  function bass(t, m, d){
    const o = actx.createOscillator(), g = actx.createGain(); o.type = 'triangle'; o.frequency.value = midiHz(m);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.25, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(musicBus); o.start(t); o.stop(t + d + .05);
  }
  function kick(t){ const o = actx.createOscillator(), g = actx.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + .12);
    g.gain.setValueAtTime(.35, t); g.gain.exponentialRampToValueAtTime(.0001, t + .15); o.connect(g).connect(musicBus); o.start(t); o.stop(t + .2); }
  function tick(){
    if (!actx) return;
    const S = SONGS[song], st = 60 / S.bpm / 4;
    if (next < actx.currentTime - .5) next = actx.currentTime + .05;
    while (next < actx.currentTime + .2){
      const t = next, s = step % 64, root = S.roots[Math.floor(s / 16)];
      const m = S.lead[s]; if (m){ let d = 1; while (s + d < 64 && !S.lead[s + d] && d < 3) d++; lead(t, m, d * st * .9); }
      if (s % 2 === 0) bass(t, s % 4 === 0 ? root - 12 : root, st * 1.6);
      if (s % 8 === 0) kick(t);
      if (s % 8 === 4) burst(t, .1, .12, 'bandpass', 1800, .8, musicBus);
      if (s % 2 === 1) burst(t, .03, .05, 'highpass', 7000, 1, musicBus);
      next += st; step++;
    }
  }
  return {
    boot(){ next = actx.currentTime + .05; if (!timer) timer = setInterval(tick, 30); },
    play(name){ if (song !== name){ song = name; step = 0; if (actx) next = actx.currentTime + .05; } },
    volume(){ if (musicBus) musicBus.gain.setTargetAtTime(SAVE.music && !document.hidden ? MUSIC_VOL : 0, actx.currentTime, .05); }
  };
})();
document.addEventListener('visibilitychange', () => {
  Music.volume();
  if (document.hidden && scene === 'play' && !paused){ paused = true; cur && cur.up && cur.up(null, 'all'); }
});

// =====================================================================
//  CONTRAT ENTRE LE MOTEUR ET LES ÉPREUVES
//  Bourdi.ajouter({
//    id: 'porte',                 identifiant unique (lettres minuscules)
//    titre: 'La Porte',           nom affiché
//    consigne: '…',               texte de l'écran de présentation
//    plusPetitGagne: true,        true = chrono (le plus petit score gagne)
//    seuils: { S, A, B, C, D },   score à atteindre pour chaque rang
//    rangMax(res),                facultatif : rang maximum selon le résultat (ex. 'A' si faute)
//    format(score),               texte du score ('14,23 s')
//    vignette(ctx, x, y, w, h, t) illustration (menu + présentation)
//    musique: 'jeu',              boucle jouée pendant l'épreuve
//    start(api), update(dt), draw(), down(p, id), move(p, id), up(p, id)
//  })
//  L'épreuve appelle api.fin({ score, ... }) quand elle est terminée :
//  le moteur calcule le rang, sauvegarde, envoie au classement et affiche les résultats.
// =====================================================================
const EPREUVES = [];
const Bourdi = window.Bourdi = {
  ajouter(ep){ if (ep.actif === false || EPREUVES.some(e => e.id === ep.id)) return; EPREUVES.push(ep); },
  demarrer(){ requestAnimationFrame(frame); }
};
function rankOf(ep, res){
  const s = ep.seuils, v = res.score; let r = 'E';
  for (const k of ['S', 'A', 'B', 'C', 'D']) if (ep.plusPetitGagne ? v <= s[k] : v >= s[k]) { r = k; break; }
  if (ep.rangMax){ const m = ep.rangMax(res); if (m && rankIdx(m) < rankIdx(r)) r = m; }
  return r;
}
const better = (ep, a, b) => b == null || (ep.plusPetitGagne ? a < b : a > b);
const unlocked = i => i === 0 || SAVE.test || (EPREUVES[i - 1] && rankIdx(recOf(EPREUVES[i - 1].id).rank) >= rankIdx(UNLOCK));

let cur = null, curIdx = 0, paused = false, runId = 0, RES = null;
const api = {
  W, H, COL, ctx: () => ctx,
  txt, rr, blob, circle, star, wrap, bigNum, sunburst,
  secousse, particules, texte: texteVolant,
  sons: sfx, tone: (d, f, dur, v, type, f2) => { if (canSfx()) tone(actx.currentTime + (d || 0), f, dur, v, type, f2); },
  bruit: (d, dur, v, type, freq, q, freq2) => { if (canSfx()) burst(actx.currentTime + (d || 0), dur, v, type, freq, q, sfxBus, freq2); },
  fin: null
};
Bourdi.api = api;
function startEp(){
  cur = EPREUVES[curIdx]; paused = false; runId++;
  const id = runId;
  api.fin = res => { if (id !== runId) return; runId++; finish(res); };
  parts.length = 0; floats.length = 0;
  cur.start(api);
  Music.play(cur.musique || 'jeu');
}
function finish(res){
  const ep = cur, rec = recOf(ep.id), rank = rankOf(ep, res), wasNext = unlocked(curIdx + 1);
  const prev = rec.best, isRec = better(ep, res.score, prev);
  rec.tries++;
  if (isRec) rec.best = res.score;
  if (rankIdx(rank) > rankIdx(rec.rank)) rec.rank = rank;
  save();
  RES = { ep, score: res.score, rank, prev, isRec, best: rec.best,
    newUnlock: !wasNext && curIdx + 1 < EPREUVES.length && unlocked(curIdx + 1) };
  sfx.fin();
  if (isRec) lbSend();
  setTimeout(() => go('result'), 450);
}

cvs.addEventListener('pointerup', pointerEnd);
cvs.addEventListener('pointercancel', pointerEnd);
function click(id){
  if (id === 'play') go('menu');
  else if (id === 'board'){ boardTab = 0; go('board'); }
  else if (id === 'music'){ SAVE.music = !SAVE.music; save(); Music.volume(); }
  else if (id === 'sound'){ SAVE.sound = !SAVE.sound; save(); }
  else if (id === 'back') go('title');
  else if (id.startsWith('ep-')){ const i = +id.slice(3); if (unlocked(i)){ curIdx = i; go('intro'); } else { sfx.erreur(); secousse(5, .2); } }
  else if (id === 'go'){ sfx.go(); go('play'); }
  else if (id === 'introBack') go('menu');
  else if (id === 'pause'){ paused = true; cur.up && cur.up(null, 'all'); }
  else if (id === 'resume') paused = false;
  else if (id === 'restart'){ paused = false; go('play'); }
  else if (id === 'quit'){ go('menu'); }
  else if (id === 'again'){ sfx.go(); go('play'); }
  else if (id === 'next'){ curIdx++; go('intro'); }
  else if (id === 'menu') go('menu');
  else if (id === 'boardBack') go('title');

// ---------- Boucle principale ----------
let last = performance.now();

  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt; sceneT += dt;
  if (trans){ trans.t += dt; if (!trans.sw && trans.t >= .2){ trans.sw = true; resBoom = { rank: false, rec: false }; enter(trans.to); } if (trans.t >= .45) trans = null; }

  else if (scene === 'title') drawTitle();
  else if (scene === 'menu') drawMenu();
  else if (scene === 'intro') drawIntro();
  else if (scene === 'play') drawPlay();
  else if (scene === 'result') drawResult();
  else if (scene === 'board') drawBoard();
  drawFx();
  if (trans) drawTrans(trans.t);
  ctx.restore();

}

  const k = t < .2 ? t / .2 : 1 - (t - .2) / .25, r = Math.max(0, k) * 46;

    ctx.fillStyle = (x + y) % 2 ? COL.violet : COL.pink;
    ctx.beginPath(); ctx.arc(x * 60, y * 60, r, 0, Math.PI * 2); ctx.fill();
  }
}
pseudoShow(scene === 'name');

<script>
'use strict';
// =====================================================================
//  PERSONNAGES COMMUNS — les chats de la maison (Brabus, Prince, Winkle…)
//  Utilisables par toutes les épreuves : Bourdi.chats.drawCat(...)
// =====================================================================
(() => {
  const A = Bourdi.api, ctx = A.ctx();
  const COL = { ink: '#1d1530', yellow: '#ffd21f', white: '#fff' };
  // ---------- Les chats ----------
  const LOOKS = {
    brabus: { body: '#f6ecd8', point: '#5b3a29', eye: '#56b8ff', mask: true, name: 'Brabus' },
    prince: { body: '#f6f3ec', point: '#8796b0', eye: '#56b8ff', mask: true, name: 'Prince' },
    winkle: { body: '#8f9aa8', point: '#7c8795', eye: '#ffb52e', name: 'Winkle' },
    roux:   { body: '#ff9a3c', point: '#d96a12', eye: '#7ad81e', stripes: true },
    noir:   { body: '#2f2a3d', point: '#2f2a3d', eye: '#ffd21f', inner: '#ff8fc4' }
  };

  function ln(pts, w, c){ ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.lineWidth = w; ctx.strokeStyle = c; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); }

  function tail(L, pts){ ln(pts, 11, COL.ink); ln(pts, 6, L.point); }

  function head(L, x, y, r, expr, t){
    ctx.save(); ctx.translate(x, y);
    // oreilles
    [[-r * .75, -r * .45, -r * .55, -r * 1.35, -r * .05, -r * .9], [r * .1, -r * .85, r * .55, -r * 1.4, r * .85, -r * .45]].forEach(e => {

      ctx.beginPath(); ctx.moveTo(e[0] * .7 + e[2] * .3, e[1] * .7 + e[3] * .3); ctx.lineTo(e[2] * .9 + e[0] * .1, e[3] * .85); ctx.lineTo(e[4] * .7 + e[2] * .3, e[5] * .7 + e[3] * .3); ctx.fillStyle = L.inner || '#ffb3cf'; ctx.fill();
    });
    ell(0, 0, r, r * .92, L.body);
    if (L.mask){ ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, r - 1.5, r * .92 - 1.5, 0, 0, Math.PI * 2); ctx.clip(); ell(r * .35, r * .35, r * .62, r * .55, L.point, 0); ctx.restore(); }
    if (L.stripes){ ln([[-r * .3, -r * .85], [-r * .2, -r * .5]], 3, L.point); ln([[r * .05, -r * .9], [r * .05, -r * .55]], 3, L.point); }
    // yeux
    const ex = [r * .05, r * .55], ey = -r * .12;
    ex.forEach((x0, i) => {
      const er = r * (i ? .26 : .3);
      if (expr === 'x'){ ln([[x0 - er * .7, ey - er * .7], [x0 + er * .7, ey + er * .7]], 3, COL.ink); ln([[x0 + er * .7, ey - er * .7], [x0 - er * .7, ey + er * .7]], 3, COL.ink); return; }

      if (L.stripes){ ln([[-14, -40], [-6, -34]], 3, L.point); ln([[-18, -28], [-8, -24]], 3, L.point); }

      ctx.save(); if (pose === 'stun') { ctx.translate(8, hy); ctx.rotate(Math.sin(t * 9) * .2); ctx.translate(-8, -hy); }
      if (pose === 'look'){ ctx.translate(8, hy); ctx.rotate(-.5); ctx.translate(-8, -hy); }
      head(L, 8, hy, 19, pose === 'stun' ? 'x' : expr, t); ctx.restore();

    } else if (pose === 'walk' || pose === 'run' || pose === 'crouch'){
      const run = pose === 'run', cr = pose === 'crouch', sp = run ? 26 : cr ? 10 : 12;
      const by = cr ? -16 : run ? -24 : -26, rx = run ? 34 : 30, ry = cr ? 12 : run ? 13 : 16;
      const sw = Math.sin(t * sp) * (run ? .9 : .45);
      tail(L, run ? [[-rx + 4, by - 2], [-rx - 22, by - 10], [-rx - 36, by - 6]] : cr ? [[-rx + 4, by], [-rx - 18, by + 2], [-rx - 32, by - 4 + wag]] : [[-rx + 4, by - 4], [-rx - 14, by - 22], [-rx - 10, by - 40 + wag]]);
      const lh = -by - 2, lc = L.mask ? L.point : L.body;
      leg(-rx * .55, by + 4, lh, lc, -sw); leg(rx * .45, by + 4, lh, lc, sw);
      ell(0, by, rx, ry, L.body, 3, cr ? Math.sin(t * 20) * .03 : 0);
      if (L.stripes){ [-14, -2, 10].forEach(sx => ln([[sx, by - ry + 2], [sx + 4, by - ry + 10]], 3, L.point)); }
      leg(-rx * .35, by + 4, lh, lc, sw); leg(rx * .65, by + 4, lh, lc, -sw);
      head(L, rx * .95, by - (cr ? 8 : 14), 18, expr, t);
    } else if (pose === 'fly'){
      tail(L, [[-26, -24], [-44, -34], [-50, -50]]);
      const lc = L.mask ? L.point : L.body;
      leg(-18, -18, 18, lc, .8); leg(14, -18, 18, lc, -.8);
      ell(0, -26, 28, 17, L.body);
      leg(-10, -12, 18, lc, .3); leg(20, -12, 18, lc, -.3);
      head(L, 28, -40, 18, 'shock', t);
    }
    ctx.restore();
    if (o.name && !o.hideName){ A.txt(o.name, x, y + 14, 14, COL.white, { lw: 4, shadow: false }); }
  }

  Bourdi.chats = { LOOKS, drawCat, tail, ln, ell };
})();

<script>
'use strict';
// =====================================================================
//  PERSONNAGES COMMUNS — les gens (vus de face) et Tonton Bidou
//  Bourdi.persos.drawPerson(g, x, y, s, t, o), Bourdi.persos.makePerson(kind)
// =====================================================================
(() => {
  const A = Bourdi.api; let ctx = A.ctx();
  const COL = { ink: '#1d1530', white: '#fff', red: '#ff3b3b', orange: '#ff8a1f', yellow: '#ffd21f', sky: '#5ec8ff', blue: '#2f6bff', green: '#7ad81e', pink: '#ff4fa3', violet: '#8a3ffc' };
  const { ln, ell } = Bourdi.chats;
  const pick = a => a[Math.floor(Math.random() * a.length)];
  // ---------- Les invités (vus de face) ----------
  const SKINS = ['#ffd9b8', '#f2c294', '#c98a5a', '#8d5a36', '#ffe0c7'];
  const HAIRS = ['#3a2a20', '#f0c040', '#b04a20', '#222', '#d9d9e6'];
  const SHIRTS = [COL.blue, COL.green, COL.violet, COL.orange, COL.sky, '#ff7ab8'];

      [[-14, -18, COL.red], [0, -26, COL.yellow], [14, -18, COL.pink], [-6, -12, COL.violet], [8, -10, COL.orange]].forEach(([a, b, c]) => { A.circle(a, b, 8, c, 3); A.circle(a, b, 2.5, COL.ink, 0); }); }

    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);

    const big = g.kind === 'bidou', st = o.sitT != null ? o.sitT : -1, stuck = big && st > 1.2;
    const skin = big ? '#ffb199' : g.skin, face = big ? (stuck ? (Math.sin(t * 6) > 0 ? '#d42a50' : '#e23a46') : '#ff5a4a') : g.skin;
    if (stuck) ctx.translate(Math.sin(t * 55) * 1.5, 0);

    ctx.translate(0, -bob);

    else { A.blob(-24, -40, 20, 30, 7, g.pants, 3); A.blob(4, -40, 20, 30, 7, g.pants, 3); }

      else { ln([[40, sh + 6], [56, sh + 30]], 13, COL.ink); ln([[40, sh + 6], [56, sh + 30]], 8, g.shirt); hand(56, sh + 32); }
    } else {

      ln([[-w, sh + 4], [-w - 14, sh - 10 + up], [-w - 16, sh - 30 + up]], 13, COL.ink); ln([[-w, sh + 4], [-w - 14, sh - 10 + up], [-w - 16, sh - 30 + up]], 8, g.shirt);
      ln([[w, sh + 4], [w + 14, sh - 10 + up], [w + 16, sh - 30 + up]], 13, COL.ink); ln([[w, sh + 4], [w + 14, sh - 10 + up], [w + 16, sh - 30 + up]], 8, g.shirt);

    A.circle(0, hy, hr, face, 3);
    if (g.style === 'court' || g.style === 'chignon' || g.style === 'frange'){
      ctx.beginPath(); ctx.arc(0, hy, hr, Math.PI * 1.05, Math.PI * 1.95); ctx.quadraticCurveTo(0, hy - hr * (g.style === 'frange' ? .2 : .55), -hr * .99, hy - hr * .3); ctx.fillStyle = g.hair; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = COL.ink; ctx.stroke(); }

      ctx.beginPath(); ctx.moveTo(4, hy - hr * .7); ctx.quadraticCurveTo(10, hy - hr * .45, 4, hy - hr * .35); ctx.quadraticCurveTo(-2, hy - hr * .45, 4, hy - hr * .7); ctx.fillStyle = '#9fe3ff'; ctx.fill(); ctx.lineWidth = 2; ctx.stroke();
      A.blob(-14, hy + 12, 28, 6, 3, '#7a3a2a', 0); }
    if (g.style === 'chauve' && !big) A.blob(-14, hy + 11, 28, 6, 3, g.hair, 2);

      if (stuck){ ell(-hr * .55, hy + 12, 11, 9, face); ell(hr * .55, hy + 12, 11, 9, face); orange(0, hy + 17, 14);
        [-1, 1].forEach(d => { const k = (t * 1.5 + (d > 0 ? .5 : 0)) % 1; ctx.save(); ctx.globalAlpha = 1 - k; ell(d * (hr + 6 + k * 10), hy - 10 + k * 20, 3, 5, '#9fe3ff', 1.5); ctx.restore(); }); }

  }

    return { kind, gift: pick(GIFTS), skin: pick(SKINS), hair: pick(HAIRS), shirt: kind === 'bidou' ? '#fff' : pick(SHIRTS),
      pants: kind === 'bidou' ? '#3a4a8a' : pick(['#3a4a8a', '#5b3a29', '#2f2a3d', '#7a7a8a']), style: pick(STYLES), knocks: Math.random() < .5 ? 1 : 2 };
  }

  // emplacements des courses dehors (en tas) et dedans
  const OUT = [[122, 0], [84, 0], [46, 0], [14, 0], [104, -52], [66, -52], [30, -52], [86, -104], [48, -104]];
  const IN = [[340, 0], [302, 0], [264, 0], [322, -52], [284, -52], [342, -52], [304, -104], [266, -52], [326, -104], [314, -150]];

  // ---------- État de la partie ----------
  let G;
  function nouvellePartie(){

      door: 0, holds: new Set(), slamOk: false,
      items: ITEMS.map((it, i) => ({ ...it, i, x: 0, y: 0, p: 0, inside: false })),
      delivered: 0, cur: 0,
      puddles: [], butterfly: null, nextFly: 2.5 + Math.random() * 2, lastShout: -9, crazyWas: false,
      cats: [

  function cat(look, kind, x, fat = 1){
    return { L: LOOKS[look], kind, x, y: LANE, st: 'idle', t: 0, vx: 0, dir: 1, fat, s: .95, taps: 0, gauge: 0, pat: 0, cool: 0,

  const crazy = () => G.items[G.cur] && G.items[G.cur].k === 'croquettes' && G.cur < 10;
  const front = c => c.x + 30 * c.s * c.fat;
  function slotOut(i){ const k = i - G.cur; const s = k <= 0 ? [150, 0] : OUT[Math.min(k - 1, OUT.length - 1)]; return [s[0], ITEM_Y + s[1]]; }
  function slotIn(n){ const s = IN[n]; return [s[0], ITEM_Y + s[1]]; }

  // ---------- Sons de l'épreuve ----------
  const snd = {
    miaou(p = 1){ A.tone(0, 520 * p, .12, .09, 'sawtooth', 820 * p); A.tone(.11, 820 * p, .3, .09, 'sawtooth', 420 * p); A.tone(0, 1040 * p, .35, .03, 'triangle', 840 * p); },
    bonk(){ A.bruit(0, .12, .3, 'lowpass', 500, 1); A.tone(0, 200, .16, .18, 'sine', 70); },

    creak(){ A.tone(0, 190, .14, .025, 'sawtooth', 290); },
    poc(n){ A.tone(0, 380 + n * 30, .1, .14, 'sine', 200); A.tone(.03, 900 + n * 60, .08, .04, 'triangle'); },
    tap(){ A.bruit(0, .06, .18, 'bandpass', 1500, 2); A.tone(0, 700, .07, .06, 'square', 450); },

    brabus(){ A.tone(0, 230, .5, .1, 'sawtooth', 130); A.tone(0, 345, .5, .05, 'square', 190); A.bruit(0, .5, .06, 'lowpass', 800, 1); },
    count(go){ A.tone(0, go ? 1046 : 523, go ? .3 : .12, .08, 'square'); }
  };

  // ---------- Logique ----------
  function bonk(c, txt = true){
    c.st = 'stun'; c.t = 1.1; c.vx = -220; c.x = Math.min(c.x, WALL_L - 30 * c.s * c.fat - 4);
    if (txt) A.texte('MIAOU !', 150, 470, { size: 32, color: COL.pink, dur: .8 });
    snd.bonk(); snd.miaou(c.L === LOOKS.prince ? 1.25 : c.L === LOOKS.roux ? .8 : 1); A.secousse(7, .25);
    A.particules(WALL_L, 520, 8, { shape: 'star', size: 10, colors: [COL.yellow, COL.white], speed: 220 });
  }
  function reachDoor(c){

  }
  function eject(c, withText){

  function updCat(c, dt){
    const cz = crazy() ? 1.4 : 1, open = G.door > .25;

        if (open && G.count >= 0) c.pat += dt; else c.pat = Math.max(0, c.pat - dt * 2);
        if (c.kind === 'colle' && G.butterfly && G.butterfly.t > .4 && !crazy()){ c.st = 'distrait'; c.pat = 0; break; }
        if (c.pat > (c.kind === 'colle' ? .5 : .8) / cz){ c.pat = 0; c.st = 'go'; }
        break;
      case 'go':

      case 'distrait':                       // Prince regarde le papillon
        if (!G.butterfly){ c.st = 'idle'; break; }

      case 'back':                           // Winkle retourne se cacher derrière les courses
        if (walkTo(c.hideX, 110)){ c.st = 'hide'; c.t = 1.5 + Math.random() * 2; }

      case 'hide':
        c.dir = 1;
        if (c.t <= 0){ c.st = 'sneak'; }

      case 'sneak':                          // elle avance en douce… et bondit dès que ça s'ouvre

        if (open){ c.pat += dt; if (c.pat > .28 / cz){ c.pat = 0; c.st = 'pounce'; } } else c.pat = 0;

      case 'pounce':

          A.texte('PIPI ! +5 s', 270, 430, { size: 32, color: COL.yellow, dur: 1.2 }); snd.pipi(); A.secousse(5, .3); }

        if (c.t <= 0) eject(c, false);

        const f = c.fly; f.t += dt / .6; const k = Math.min(1, f.t);
        c.x = f.x0 + (f.x1 - f.x0) * k; c.y = LANE - Math.sin(k * Math.PI) * 170;

  }
  const inside = c => ['cross', 'in', 'squat', 'pee', 'fly'].includes(c.st) && !(c.st === 'fly' && c.fly.t > .5) && (c.st !== 'cross' || c.x > HINGE);

  function update(dt){
    G.t += dt;
    if (G.count < 0){
      const before = Math.ceil(-G.count / .4); G.count += dt; const after = Math.ceil(-G.count / .4);
      if (after !== before) snd.count(after === 0);

      if (b.t > 2.4){ G.butterfly = null; G.nextFly = 3 + Math.random() * 3; } }

      G.done = G.t; A.texte('Courses rentrées !', 180, 330, { size: 36, color: COL.yellow, dur: 1.3, vy: 0 }); A.sons.bien(); G.holds.clear();
      A.particules(270, 520, 40, { speed: 350 });
    }
    if (G.done && G.t - G.done > 1.1){ G.done = 1e9; A.fin({ score: Math.round(G.ms + G.pen), pipis: G.pipis }); }
  }

  // ---------- Dessin ----------
  function drawDoor(o){
    const fw = 76 * Math.sin(o * Math.PI / 2);

  function drawScene(){

    ctx.beginPath(); ctx.moveTo(150, 262); ctx.lineTo(268, 170); ctx.lineTo(400, 262); ctx.closePath(); ctx.fillStyle = '#e8462b'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = COL.ink; ctx.stroke();
    ctx.fillStyle = '#fff1c9'; ctx.fillRect(HINGE, 262, 170, 300);
    for (let x = HINGE + 14; x < 360; x += 28){ ctx.fillStyle = '#ffd98a'; ctx.fillRect(x, 262, 12, 300); }
    A.blob(255, 320, 70, 56, 6, '#8fd7ff', 4); ln([[290, 320], [290, 376]], 3, COL.ink); ln([[255, 348], [325, 348]], 3, COL.ink);  // fenêtre
    ln([[HINGE, 262], [360, 262]], 5, COL.ink);
    // sol dehors (trottoir) / dedans (carrelage)
    ctx.fillStyle = '#c9c3d9'; ctx.fillRect(0, 556, WALL_L, 60); ctx.fillStyle = '#ffffff'; ctx.fillRect(HINGE, 556, 160, 60);
    for (let x = HINGE; x < 360; x += 26) for (let y = 0; y < 3; y++) if ((x / 26 + y) % 2 < 1){ ctx.fillStyle = '#ffb3cf'; ctx.fillRect(x, 556 + y * 20, 26, 20); }
    for (let x = 0; x < WALL_L; x += 36){ ln([[x, 556], [x - 8, 616]], 2, '#a8a1bf'); }
    ln([[0, 556], [360, 556]], 4, COL.ink);
    // flaques de pipi

    A.blob(WALL_L - 2, DOOR_BOT, HINGE - WALL_L + 4, 16, 0, '#8a6a4a', 3);
    drawDoor(G.door);
  }
  function drawCatState(c){
    const L = c.L, o = { dir: c.dir, fat: c.fat, wag: 3 };
    let pose = 'sit';
    switch (c.st){
      case 'idle': pose = c.kind === 'fonceur' ? 'sit' : 'walk'; if (c.kind === 'fonceur') o.expr = 'happy'; break;
      case 'arm': pose = 'crouch'; o.expr = 'angry'; break;
      case 'dash': case 'pounce': pose = 'run'; o.expr = 'angry'; break;
      case 'go': case 'cross': pose = c.kind === 'lent' ? 'walk' : 'run'; o.expr = 'angry'; break;
      case 'post': pose = 'sit'; o.expr = G.door > .25 ? 'angry' : 'normal'; break;
      case 'distrait': pose = Math.abs(c.x - Math.max(40, (G.butterfly || { x: 0 }).x - 30)) > 2 ? 'walk' : 'look'; break;
      case 'back': case 'home': case 'in': pose = 'walk'; break;
      case 'hide': pose = 'sit'; break;
      case 'sneak': pose = 'crouch'; o.wag = 12; break;
      case 'stun': pose = 'stun'; break;
      case 'squat': pose = 'squat'; o.expr = 'squint'; break;
      case 'pee': pose = 'squat'; o.expr = 'happy'; break;
      case 'fly': pose = 'fly'; o.rot = c.fly.t * 9; break;
    }
    if (G.count < 0 && c.name) o.name = c.name;
    drawCat(L, c.x, c.y, c.s, pose, G.t + c.home, o);
    if (crazy() && !['stun', 'fly', 'squat', 'pee'].includes(c.st)) A.txt('!', c.x + 10, c.y - 92 + Math.sin(G.t * 14) * 3, 26, COL.red, { lw: 6 });
    if (c.st === 'squat'){
      const bx = c.x - 26, by = c.y - 108, pulse = c.gauge > .7 ? Math.sin(G.t * 20) * 2 : 0;
      A.blob(bx - pulse, by - pulse, 52 + pulse * 2, 14 + pulse * 2, 7, '#fff', 3);
      if (c.gauge > 0){ A.rr(bx + 3, by + 3, 46 * Math.min(1, c.gauge), 8, 4); ctx.fillStyle = c.gauge > .7 ? COL.red : COL.yellow; ctx.fill(); }
      ctx.beginPath(); ctx.moveTo(bx - 14, by - 6); ctx.quadraticCurveTo(bx - 4, by + 8, bx - 14, by + 14); ctx.quadraticCurveTo(bx - 24, by + 8, bx - 14, by - 6);
      ctx.fillStyle = COL.yellow; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = COL.ink; ctx.stroke();
      for (let i = 0; i < c.taps; i++) A.circle(c.x - 10 + i * 10, by + 26, 3.5, COL.white, 2);
    }
  }
  function draw(){
    ctx = A.ctx();
    drawScene();
    // courses dedans (derrière les chats)
    G.items.forEach(it => { if (it.inside) drawItem(it.k, it.x, it.y); });
    // Winkle cachée : dessinée AVANT le tas de courses
    const hidden = c => (c.st === 'hide' || c.st === 'sneak') && G.items.length - G.cur > 3;
    G.cats.filter(hidden).forEach(drawCatState);
    G.items.forEach((it, i) => { if (!it.inside && i !== G.cur) drawItem(it.k, it.x, it.y); });
    // la queue de Winkle dépasse du tas
    G.cats.filter(hidden).forEach(c => { const k = c.st === 'sneak' ? 12 : 3; tail(c.L, [[c.x - 20, c.y - 14], [c.x - 44, c.y - 20 + Math.sin(G.t * k) * 5], [c.x - 50, c.y - 44 + Math.sin(G.t * k) * 9]]); });
    // la course en cours, puis les chats visibles
    const it = G.items[G.cur];
    if (it){ drawItem(it.k, it.x, it.y, 1 + Math.sin(G.t * 8) * .03);
      if (it.p > 0){ A.blob(it.x - 24, it.y - 82, 48, 10, 5, '#fff', 2.5); A.rr(it.x - 22, it.y - 80, 44 * it.p, 6, 3); ctx.fillStyle = COL.green; ctx.fill(); } }
    G.cats.filter(c => !hidden(c) && c.st !== 'fly').sort((a, b) => a.x - b.x).forEach(drawCatState);
    // papillon
    if (G.butterfly){ const b = G.butterfly, f = Math.abs(Math.sin(G.t * 18));
      ctx.save(); ctx.translate(b.x, b.y); [-1, 1].forEach(s => { ell(s * 7 * f, -2, 8 * f + 1, 6, COL.pink, 2); }); ell(0, 0, 2, 7, COL.ink, 0); ctx.restore(); }
    G.cats.filter(c => c.st === 'fly').forEach(drawCatState);
    // HUD
    const shown = G.ms + G.pen;
    A.bigNum(((shown / 1000).toFixed(2)).replace('.', ','), 196, 46, 52, { align: 'right' });
    A.txt('s', 214, 58, 24, COL.white, { lw: 6, align: 'left' });
    A.txt('Courses : ' + G.delivered + '/10', 140, 96, 20, COL.white, { lw: 6 });
    // gros bouton OUVRIR
    ctx.fillStyle = COL.ink; ctx.fillRect(-200, 612, 760, 400);
    const held = G.holds.size > 0 && G.count >= 0, dy = held ? 5 : 0;
    A.rr(26, 628, 308, 76, 26); ctx.fillStyle = '#000'; ctx.fill();
    A.blob(26, 622 + dy, 308, 76, 26, held ? COL.green : COL.red, 4, '#000');
    A.rr(36, 628 + dy, 288, 22, 14); ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fill();
    A.txt('OUVRIR', 180, 661 + dy, 38, COL.white, { lw: 9 });
    // compte à rebours
    if (G.count < 0){ const n = Math.ceil(-G.count / .4), f = (-G.count % .4) / .4;
      ctx.save(); ctx.translate(180, 330); const s = .7 + f * .6; ctx.scale(s, s); A.bigNum(String(n), 0, 0, 120); ctx.restore(); }
  }

  // ---------- Toucher ----------
  function down(p, id){
    if (G.done) return;
    if (p.y > 612){ G.holds.add(id); return; }
    // taper un chat qui est entré
    const c = G.cats.filter(c => c.st === 'squat' || c.st === 'in').find(c => Math.abs(p.x - c.x) < 48 && p.y > c.y - 110 && p.y < c.y + 20);
    if (c){ c.taps++; snd.tap(); A.particules(p.x, p.y, 5, { speed: 160, size: 6, colors: [COL.white, COL.yellow] });
      if (c.taps >= 3) eject(c, true); }
  }
  function up(p, id){ if (id === 'all') G.holds.clear(); else G.holds.delete(id); }

  // ---------- Vignette (menu et présentation) ----------
  function vignette(c, x, y, w, h, t){
    ctx = c; const k = h / 230;
    A.sunburst(x + w * .7, y + h * .4, '#7fd4ff', '#a6e2ff', t * .3, 14);
    c.save(); c.translate(x + w / 2, y + h); c.scale(k, k); c.translate(-150, -230);
    c.fillStyle = '#c9c3d9'; c.fillRect(-200, 196, 600, 40); ln([[-200, 196], [500, 196]], 4, COL.ink);
    A.blob(206, 30, 74, 172, 6, '#e8462b', 5); A.circle(220, 120, 6, COL.yellow, 3);
    [[214, 46, 56, 56], [214, 116 + 8, 56, 56]].forEach(([a, b, ww, hh]) => { A.rr(a + 4, b, ww - 8, hh - 8, 4); c.lineWidth = 3; c.strokeStyle = '#b8301c'; c.stroke(); });
    drawItem('sac', 160, 210, 1.1); drawItem('eau', 112, 214, 1);
    const dx = Math.sin(t * 4) * 8;
    drawCat(LOOKS.brabus, 50 + dx, 222, 1.25, 'run', t * 1.5, { expr: 'angry' });
    drawCat(LOOKS.prince, 188, 214, .8, 'sit', t, { expr: 'angry' });
    c.restore();
  }

  Bourdi.ajouter({
    id: 'porte', titre: 'La Porte', court: 'La Porte',
    consigne: 'Garde le doigt appuyé pour ouvrir la porte. Lâche pour la refermer. Rentre les 10 courses sans laisser entrer les chats !',
    plusPetitGagne: true,
    seuils: { S: 10000, A: 13000, B: 17000, C: 22000, D: 30000 },
    rangMax: res => res.pipis > 0 ? 'A' : null,
    format: ms => (Math.max(0, ms) / 1000).toFixed(2).replace('.', ',') + ' s',
    musique: 'jeu',
    vignette,
    start(){ ctx = A.ctx(); nouvellePartie(); },
    update, draw, down, up,
    etat: () => G                           // pour les tests automatiques
  });
})();

</script>
<script>
'use strict';
// =====================================================================
//  ÉPREUVE 2 — LES INVITÉS
//  Toucher le bazar pour ranger avant que la porte s'ouvre.
//  Invité avec un cadeau : on le laisse entrer. Mains vides : on le touche
//  pour le jeter dehors. Tonton Bidou ne toque pas : BAM !
//  Score en points.
// =====================================================================
(() => {
  const COL = { ink: '#1d1530', white: '#fff', red: '#ff3b3b', orange: '#ff8a1f', yellow: '#ffd21f', sky: '#5ec8ff', blue: '#2f6bff', green: '#7ad81e', pink: '#ff4fa3', violet: '#8a3ffc' };
  const A = Bourdi.api; let ctx = A.ctx();
  const { LOOKS, drawCat, ln, ell } = Bourdi.chats;
  const DX = 222, DY = 250, DW = 116, DH = 222, FLOOR = DY + DH;     // la porte d'entrée
  const NB = 10;
  const P = { range: 10, merci: 100, dehors: 100, bonus: 100, honte: -50, oups: -200, installe: -300 };

  // ---------- Le bazar ----------
  const MESS = ['chaussette', 'assiette', 'pizza', 'tshirt', 'canard', 'canette', 'banane', 'livre'];
  const SPOTS = [];
  [530, 590, 650].forEach((y, j) => [42, 112, 182, 252, 322].forEach(x => SPOTS.push([x + (j % 2 ? 18 : 0) - 8, y])));
  [[52, 418], [112, 418], [168, 418]].forEach(s => SPOTS.push(s));
  function drawMess(k, x, y, s = 1, rot = 0){
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(rot);
    const box = (bx, by, w, h, c, r = 5) => A.blob(bx, by, w, h, r, c, 3);
    if (k === 'chaussette'){ ctx.beginPath(); ctx.moveTo(-6, -30); ctx.lineTo(8, -30); ctx.lineTo(8, -8); ctx.quadraticCurveTo(22, -8, 22, 0); ctx.lineTo(-6, 0); ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = COL.ink; ctx.lineJoin = 'round'; ctx.stroke(); ln([[-6, -24], [8, -24]], 4, COL.red); ln([[-6, -18], [8, -18]], 4, COL.red); }
    else if (k === 'assiette'){ ell(0, -6, 22, 8, '#fff'); ell(0, -7, 13, 4, '#f0e6d6', 2); ell(-5, -8, 4, 2, '#c0582a', 0); ell(5, -6, 3, 2, '#7a9a2a', 0); }
    else if (k === 'pizza'){ box(-22, -10, 44, 10, '#e8b36a', 3); ell(6, -10, 6, 2, COL.red, 0); }
    else if (k === 'tshirt'){ ctx.beginPath(); ctx.moveTo(-10, -26); ctx.lineTo(-22, -18); ctx.lineTo(-16, -10); ctx.lineTo(-12, -12); ctx.lineTo(-12, 0); ctx.lineTo(12, 0); ctx.lineTo(12, -12); ctx.lineTo(16, -10); ctx.lineTo(22, -18); ctx.lineTo(10, -26); ctx.quadraticCurveTo(0, -20, -10, -26); ctx.closePath(); ctx.fillStyle = COL.sky; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = COL.ink; ctx.lineJoin = 'round'; ctx.stroke(); A.star(0, -12, 5, COL.yellow); }
    else if (k === 'canard'){ ell(-2, -10, 14, 10, COL.yellow); A.circle(9, -22, 8, COL.yellow, 3); ell(18, -21, 5, 2.5, COL.orange, 2); ell(10, -24, 1.6, 1.6, COL.ink, 0); }
    else if (k === 'canette'){ ctx.rotate(1.3); box(-8, -12, 16, 26, COL.green, 4); ln([[-8, -6], [8, -6]], 2, COL.ink); }
    else if (k === 'banane'){ ctx.beginPath(); ctx.moveTo(-18, -14); ctx.quadraticCurveTo(0, 6, 18, -14); ctx.quadraticCurveTo(0, -2, -18, -14); ctx.fillStyle = COL.yellow; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = COL.ink; ctx.stroke(); ln([[-18, -14], [-22, -18]], 3, '#5b3a29'); }
    else if (k === 'livre'){ box(-16, -12, 32, 12, COL.violet, 2); ln([[-12, -6], [12, -6]], 2, '#fff'); }
    ctx.restore();
  }

  const { drawPerson, drawGift, orange, makePerson } = Bourdi.persos;

  // ---------- État de la partie ----------
  let G;
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const makeGuest = makePerson;
  function nouvellePartie(){
    // 10 invités : 4 avec cadeau, 4 les mains vides, Tonton Bidou 2 fois (jamais en premier)
    let list;
    do { list = ['gift', 'gift', 'gift', 'gift', 'empty', 'empty', 'empty', 'empty', 'bidou', 'bidou'].sort(() => Math.random() - .5); }
    while (list[0] === 'bidou' || list.some((k, i) => k === 'bidou' && list[i + 1] === 'bidou'));
    G = { t: 0, count: -1.2, score: 0, arrived: 0, idx: 0, phase: 'gap', pt: 3.2, door: 0, doorTarget: 0,
      guests: list.map(makeGuest), g: null, leaving: [], sofa: [], mess: [], cat: null, end: 0, knockAt: [] };
    const free = SPOTS.slice().sort(() => Math.random() - .5).slice(0, 11);
    free.forEach(s => addMess(s, 0));
  }
  function addMess(s, drop){ G.mess.push({ k: pick(MESS), x: s[0], y: s[1], rot: (Math.random() - .5) * .8, drop, gone: -1 }); }
  const freeSpots = () => SPOTS.filter(s => !G.mess.some(m => m.gone < 0 && m.x === s[0] && m.y === s[1]) && !(s[1] < 450 && G.sofa.length));
  const add = (n, x, y) => { G.score += n; A.texte((n > 0 ? '+' : '−') + Math.abs(n), x, y, { size: n > 0 ? 22 : 26, color: n > 0 ? COL.green : COL.red, dur: .7 }); };

  // ---------- Sons ----------
  const snd = {
    toc(){ A.tone(0, 130, .09, .35, 'sine', 90); A.bruit(0, .06, .25, 'lowpass', 700, 1); },
    bam(){ A.bruit(0, .3, .45, 'lowpass', 420, 1); A.tone(0, 85, .3, .25, 'square', 45); A.tone(0, 60, .4, .3, 'sine', 35); },
    pop(){ A.tone(0, 480, .08, .08, 'triangle', 1300); A.bruit(0, .05, .06, 'highpass', 4000, 1); },
    crash(){ A.bruit(0, .12, .15, 'bandpass', 2400, 2); A.tone(0, 900, .12, .04, 'triangle', 600); },
    jet(){ A.bruit(0, .35, .15, 'bandpass', 500, 2, 2600); A.tone(.05, 260, .35, .1, 'sine', 980); },
    ouvre(){ A.tone(0, 220, .18, .03, 'sawtooth', 320); },
    claque(){ A.bruit(0, .14, .2, 'lowpass', 300, 1); A.tone(0, 100, .14, .1, 'square', 60); },
    installe(){ A.tone(0, 150, .5, .1, 'sawtooth', 90); A.tone(.3, 400, .25, .05, 'square', 250); A.bruit(.3, .3, .12, 'lowpass', 500, 1); },
    ohh(){ A.tone(0, 330, .5, .07, 'sawtooth', 220); A.tone(0, 392, .5, .04, 'triangle', 262); },
    miaou(){ A.tone(0, 600, .1, .06, 'sawtooth', 900); A.tone(.1, 900, .22, .06, 'sawtooth', 500); },
    count(go){ A.tone(0, go ? 1046 : 523, go ? .3 : .12, .08, 'square'); }
  };

  // ---------- Logique ----------
  function openDoor(){
    const g = G.g; G.doorTarget = 1; G.arrived++;
    g.st = 'door'; g.t = 0; g.t0 = 0; g.x = DX + DW / 2; g.y = FLOOR;
    if (g.kind === 'bidou'){ A.texte('BAM !', DX + DW / 2, DY - 20, { size: 44, color: COL.red, dur: .9 }); snd.bam(); A.secousse(13, .35); }
    else snd.ouvre();
    // du bazar qui traîne quand la porte s'ouvre ?
    const left = G.mess.filter(m => m.gone < 0);
    if (left.length){ G.score += P.honte * left.length; A.texte('Quelle honte !', 180, 360, { size: 32, color: COL.pink, dur: 1.1 }); snd.ohh();
      A.texte('−' + (-P.honte * left.length), 180, 400, { size: 26, color: COL.red, dur: 1 }); g.shocked = true; }
  }
  function ejectGuest(){
    const g = G.g; if (!g || g.st !== 'door') return;
    g.st = 'fly'; g.t = 0; snd.jet(); A.secousse(5, .2);
    A.texte('DEHORS !', 180, DY - 26, { size: 34, color: COL.green, dur: .8 });
    if (g.kind === 'gift'){ add(P.oups, 180, DY + 30); A.texte('Oups !', 180, 330, { size: 34, color: COL.red, dur: .9 }); A.sons.erreur(); }
    else { const win = g.kind === 'bidou' ? 1.1 : 2.0; add(P.dehors + Math.round(P.bonus * Math.max(0, 1 - g.t0 / win)), DX + DW / 2, DY + 60); }
    G.leaving.push(g); G.g = null; afterGuest(.45);
  }
  function afterGuest(delay){
    G.phase = 'after'; G.pt = delay;
  }
  function update(dt){
    G.t += dt;
    if (G.count < 0){ const b = Math.ceil(-G.count / .4); G.count += dt; const a = Math.ceil(-G.count / .4); if (a !== b) snd.count(a === 0); if (G.count >= 0) G.count = 0; return; }
    // porte
    const wd = G.door; G.door += (G.doorTarget - G.door) * Math.min(1, dt * 18);
    if (wd > .3 && G.door <= .3 && G.doorTarget === 0) snd.claque();
    // déroulement
    G.pt -= dt;
    if (G.phase === 'gap' && G.pt <= 0){
      if (G.idx >= NB){ G.phase = 'end'; G.pt = .6; }
      else { G.g = G.guests[G.idx++];
        if (G.g.kind === 'bidou'){ openDoor(); G.phase = 'guest'; }
        else { G.phase = 'knock'; G.pt = G.g.knocks === 2 ? 1.7 : .95; G.knockAt = G.g.knocks === 2 ? [0, .32] : [0];
          A.texte(G.g.knocks === 2 ? 'TOC TOC !' : 'TOC !', 266, DY - 24, { size: 32, color: COL.yellow, dur: .9 }); } }
    }
    if (G.phase === 'knock'){
      G.knockAt = G.knockAt.filter(k => { if (k <= (G.g.knocks === 2 ? 1.7 : .95) - G.pt){ snd.toc(); A.secousse(3, .08); G.knockShake = .15; return false; } return true; });
      if (G.pt <= 0){ openDoor(); G.phase = 'guest'; }
    }
    if (G.knockShake > 0) G.knockShake -= dt;
    const g = G.g;
    if (G.phase === 'guest' && g && g.st === 'door'){
      g.t += dt; g.t0 = g.t;
      if (g.kind === 'gift' && g.t > 1.4){ g.st = 'enter'; add(P.merci, DX + DW / 2, DY + 40); A.texte('Merci !', DX + DW / 2 - 40, DY - 20, { size: 30, color: COL.pink, dur: .9 }); A.sons.bien(); G.leaving.push(g); G.g = null; afterGuest(.5); }
      else if (g.kind === 'empty' && g.t > 2.0){ g.st = 'enter'; G.leaving.push(g); G.g = null; afterGuest(.5); }
      else if (g.kind === 'bidou' && g.t > 1.1){ g.st = 'tosofa'; g.t = 0; add(P.installe, 110, 380); A.texte('Il s\'installe !', 180, 330, { size: 32, color: COL.orange, dur: 1.1 }); snd.installe();
        G.mess.filter(m => m.gone < 0 && m.y < 450).forEach(m => { m.gone = 0; });
        G.leaving.push(g); G.g = null; afterGuest(.5); }
    }
    if (G.phase === 'after' && G.pt <= 0){
      G.doorTarget = 0;
      // les chats repassent et refont du bazar
      if (G.idx < NB){
        const dir = Math.random() < .5 ? 1 : -1, n = 3 + Math.floor(Math.random() * 2);
        const spots = freeSpots().sort(() => Math.random() - .5).slice(0, n);
        G.cat = { L: pick([LOOKS.brabus, LOOKS.prince, LOOKS.winkle]), dir, x: dir > 0 ? -60 : 420, y: 628, spots, t: 0 };
        snd.miaou();
      }
      G.phase = 'gap'; G.pt = .9 + Math.random() * .8;
    }
    if (G.phase === 'end' && G.pt <= 0 && !G.end){ G.end = G.t; A.texte('Soirée terminée !', 180, 330, { size: 36, color: COL.yellow, dur: 1.3, vy: 0 }); A.sons.bien(); A.particules(180, 330, 40, { speed: 340 }); }
    if (G.end && G.t - G.end > 1.2){ G.end = 1e9; A.fin({ score: Math.max(0, G.score) }); }
    // chat qui traverse
    if (G.cat){ const c = G.cat; c.t += dt; c.x += c.dir * 380 * dt;
      c.spots = c.spots.filter(s => { if ((c.dir > 0 && c.x >= s[0]) || (c.dir < 0 && c.x <= s[0])){ addMess(s, .25); snd.crash(); return false; } return true; });
      if (c.x < -80 || c.x > 440) G.cat = null; }
    // bazar qui tombe / qui disparaît
    G.mess.forEach(m => { if (m.drop > 0) m.drop = Math.max(0, m.drop - dt); if (m.gone >= 0) m.gone += dt; });
    G.mess = G.mess.filter(m => m.gone < .3);
    // l'orange de Tonton Bidou reste coincée : gloups !
    G.sofa.forEach(b => { if (!b.gloups && G.t - b.sitT > 1.2){ b.gloups = true; A.tone(0, 420, .25, .12, 'sine', 140); A.tone(.3, 200, .12, .08, 'square', 160); A.tone(.5, 210, .12, .08, 'square', 170); } });
    // invités qui partent
    G.leaving.forEach(l => {
      l.t += dt;
      if (l.st === 'enter'){ l.x -= 170 * dt; }
      else if (l.st === 'tosofa'){ const k = Math.min(1, l.t / .6); l.x = DX + DW / 2 + (100 - DX - DW / 2) * k; l.y = FLOOR + 8 * k; if (k >= 1){ l.st = 'sofa'; l.sitT = G.t; G.sofa.push(l); } }
    });
    G.leaving = G.leaving.filter(l => !(l.st === 'enter' && l.x < -80) && !(l.st === 'fly' && l.t > .7) && l.st !== 'sofa');
  }

  // ---------- Dessin ----------
  function drawRoom(){
    ctx.fillStyle = '#9fe8c9'; ctx.fillRect(-200, -300, 760, FLOOR + 300);
    for (let x = -200; x < 560; x += 30){ ctx.fillStyle = '#86dbb6'; ctx.fillRect(x, -300, 12, FLOOR + 300); }
    // fenêtre et rideaux
    A.blob(36, 190, 120, 110, 6, '#8fd7ff', 5); ln([[96, 190], [96, 300]], 4, COL.ink); ln([[36, 245], [156, 245]], 4, COL.ink);
    A.blob(22, 180, 26, 136, 10, COL.pink, 4); A.blob(144, 180, 26, 136, 10, COL.pink, 4);
    // sol
    ctx.fillStyle = '#e8a96a'; ctx.fillRect(-200, FLOOR, 760, 400);
    for (let y = FLOOR + 30; y < 760; y += 34) ln([[-200, y], [560, y]], 2, '#c98a4b');
    ln([[-200, FLOOR], [560, FLOOR]], 5, COL.ink);
    ell(180, 600, 160, 62, COL.violet, 4); ell(180, 600, 130, 46, null, 0); ctx.setLineDash([8, 8]); ctx.lineWidth = 3; ctx.strokeStyle = '#c9a0ff'; ctx.stroke(); ctx.setLineDash([]);
  }
  function drawDoor(){
    const o = G.door, shake = G.knockShake > 0 ? Math.sin(G.t * 90) * 3 : 0;
    A.blob(DX - 12, DY - 12, DW + 24, DH + 12, 4, '#fff6e0', 5);
    // dehors (visible porte ouverte)
    ctx.save(); ctx.beginPath(); ctx.rect(DX, DY, DW, DH); ctx.clip();
    ctx.fillStyle = '#5ec8ff'; ctx.fillRect(DX, DY, DW, DH); A.circle(DX + 20, FLOOR - 10, 26, '#5fc23a', 4); A.circle(DX + 76, FLOOR - 14, 30, '#5fc23a', 4);
    ctx.fillStyle = '#c9c3d9'; ctx.fillRect(DX, FLOOR - 12, DW, 12);
    if (G.g && G.g.st === 'door') drawPerson(G.g, G.g.x, FLOOR, .95, G.t, { expr: G.g.kind === 'bidou' ? 'grin' : G.g.shocked ? 'shock' : G.g.kind === 'empty' ? 'sad' : 'smile' });
    G.leaving.filter(l => l.st === 'fly').forEach(l => { const k = Math.min(1, l.t / .7); drawPerson(l, l.x + k * 30, FLOOR - 40 - k * 200, .95 * (1 - k * .8), G.t, { rot: k * 9, expr: 'shock' }); });
    ctx.restore();
    // le battant (s'ouvre vers l'intérieur, gonds à gauche)
    const w = DW * (1 - o * .82);
    ctx.save(); ctx.translate(shake, 0);
    ctx.beginPath(); ctx.moveTo(DX, DY); ctx.lineTo(DX + w, DY - o * 10); ctx.lineTo(DX + w, FLOOR + o * 10); ctx.lineTo(DX, FLOOR); ctx.closePath();
    ctx.fillStyle = COL.blue; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = COL.ink; ctx.lineJoin = 'round'; ctx.stroke();
    if (w > 40){ A.rr(DX + w * .16, DY + 18, w * .68, 70, 4); ctx.lineWidth = 3; ctx.strokeStyle = '#1d4fd0'; ctx.stroke(); A.rr(DX + w * .16, DY + 106, w * .68, 96, 4); ctx.stroke();
      A.circle(DX + w * .84, DY + 122, 6, COL.yellow, 3); }
    ctx.restore();
  }
  function drawSofa(back){
    if (back){ A.blob(14, 352, 182, 82, 22, '#ff5a8f', 5); A.blob(30, 366, 70, 54, 14, '#ff7fab', 3); A.blob(110, 366, 70, 54, 14, '#ff7fab', 3); }
    else { A.blob(8, 424, 194, 46, 16, '#ff4f86', 5); A.blob(0, 392, 30, 80, 14, '#ff5a8f', 4); A.blob(180, 392, 30, 80, 14, '#ff5a8f', 4);
      ln([[30, 490], [30, 476]], 6, COL.ink); ln([[180, 490], [180, 476]], 6, COL.ink); }
  }
  function draw(){
    ctx = A.ctx();
    drawRoom();
    drawDoor();
    // invités qui entrent (passent derrière le canapé)
    G.leaving.filter(l => l.st === 'enter').forEach(l => drawPerson(l, l.x, FLOOR, .95, G.t, { walk: true, noGift: false }));
    drawSofa(true);
    G.sofa.forEach((b, i) => { const st = G.t - b.sitT; drawPerson(b, 100 + (i ? 40 : 0) - (G.sofa.length > 1 ? 20 : 0), 466, .85, G.t, { sit: true, sitT: st, expr: st > 1.2 ? 'shock' : 'grin' }); });
    G.leaving.filter(l => l.st === 'tosofa').forEach(l => drawPerson(l, l.x, l.y, .9, G.t, { walk: true, expr: 'grin' }));
    drawSofa(false);
    // bazar
    G.mess.forEach(m => {
      const s = m.gone >= 0 ? 1 + m.gone * 3 : 1, a = m.gone >= 0 ? 1 - m.gone / .3 : 1, dy = m.drop > 0 ? -m.drop * 240 : 0;
      ctx.save(); ctx.globalAlpha = a; drawMess(m.k, m.x, m.y + dy, s * 1.15, m.rot + (m.gone >= 0 ? m.gone * 8 : 0)); ctx.restore();
    });
    if (G.cat){ const c = G.cat; drawCat(c.L, c.x, c.y, 1, 'run', G.t * 1.5, { dir: c.dir, expr: 'happy' }); }
    // HUD
    const sc = String(Math.abs(Math.round(G.score))).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    A.bigNum((G.score < 0 ? '−' : '') + sc, 196, 46, 50, { align: 'right' });
    A.txt('pts', 206, 58, 22, COL.white, { lw: 6, align: 'left' });
    A.txt('Invités : ' + G.arrived + '/' + NB, 150, 96, 20, COL.white, { lw: 6 });
    // fenêtre d'action : barre de temps au-dessus de l'invité
    const g = G.g;
    if (g && g.st === 'door' && g.kind !== 'gift'){ const win = g.kind === 'bidou' ? 1.1 : 2.0, k = Math.max(0, 1 - g.t / win);
      A.blob(DX, DY - 8, DW, 12, 6, '#fff', 3); if (k > 0){ A.rr(DX + 2, DY - 6, (DW - 4) * k, 8, 4); ctx.fillStyle = k < .35 ? COL.red : COL.orange; ctx.fill(); } }
    if (G.count < 0){ const n = Math.ceil(-G.count / .4), f = (-G.count % .4) / .4;
      ctx.save(); ctx.translate(180, 330); const s = .7 + f * .6; ctx.scale(s, s); A.bigNum(String(n), 0, 0, 120); ctx.restore(); }
  }

  // ---------- Toucher ----------
  function down(p){
    if (G.count < 0 || G.end) return;
    const g = G.g;
    if (g && g.st === 'door' && p.x > DX - 30 && p.x < DX + DW + 30 && p.y > DY - 40 && p.y < FLOOR + 20){ ejectGuest(); return; }
    let best = null, bd = 40;
    G.mess.forEach(m => { if (m.gone >= 0 || m.drop > 0) return; const d = Math.hypot(p.x - m.x, p.y - (m.y - 12)); if (d < bd){ bd = d; best = m; } });
    if (best){ best.gone = 0; add(P.range, best.x, best.y - 40); snd.pop(); A.particules(best.x, best.y - 12, 8, { speed: 180, size: 6, shape: 'star', colors: [COL.yellow, COL.white, COL.sky] }); }
  }

  // ---------- Vignette ----------
  function vignette(c, x, y, w, h, t){
    ctx = c; const k = h / 230;
    c.save(); c.translate(x + w / 2, y + h); c.scale(k, k); c.translate(-150, -230);
    c.fillStyle = '#9fe8c9'; c.fillRect(-200, -100, 700, 400); for (let xx = -200; xx < 500; xx += 30){ c.fillStyle = '#86dbb6'; c.fillRect(xx, -100, 12, 400); }
    c.fillStyle = '#e8a96a'; c.fillRect(-200, 200, 700, 100); ln([[-200, 200], [500, 200]], 4, COL.ink);
    A.blob(180, 10, 104, 196, 4, '#fff6e0', 5); c.fillStyle = '#5ec8ff'; c.fillRect(192, 22, 80, 178);
    const demo = { kind: 'bidou', skin: '#ffd9b8', hair: '#222', shirt: '#fff', pants: '#3a4a8a', style: 'court' };
    c.save(); c.beginPath(); c.rect(192, 22, 80, 178); c.clip(); drawPerson(demo, 232, 200, .8, t, { expr: 'grin' }); c.restore();
    A.txt('BAM !', 120 + Math.sin(t * 6) * 3, 50, 40, COL.red, { lw: 9 });
    drawMess('chaussette', 40, 228, 1.3, .2); drawMess('pizza', 100, 226, 1.3, -.1); drawMess('canard', 150, 228, 1.3, 0);
    c.restore();
  }

  Bourdi.ajouter({
    id: 'invites', titre: 'Les Invités', court: 'Les Invités',
    consigne: 'Des invités arrivent ! Range la maison avant qu\'ils entrent. Laisse entrer ceux qui apportent un cadeau, et touche ceux qui viennent les mains vides pour les mettre dehors !',
    plusPetitGagne: false,
    seuils: { S: 1850, A: 1650, B: 1400, C: 1100, D: 700 },
    format: n => String(Math.max(0, Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' pts',
    musique: 'jeu',
    vignette,
    start(){ ctx = A.ctx(); nouvellePartie(); },
    update, draw, down,
    etat: () => G
  });
})();

<script>
'use strict';
// =====================================================================
//  ÉPREUVE 3 — LES TOILETTES
//  3 portes occupées. Sous les portes : 2 pantalons sur les chevilles,
//  1 pantalon remonté → c'est là qu'il faut toquer, le plus vite possible.
//  3 manches de 4 secondes. Score = nombre de bonnes tapes (−3 par erreur).
// =====================================================================
(() => {
  const COL = { ink: '#1d1530', white: '#fff', red: '#ff3b3b', orange: '#ff8a1f', yellow: '#ffd21f', sky: '#5ec8ff', blue: '#2f6bff', green: '#7ad81e', pink: '#ff4fa3', violet: '#8a3ffc' };
  const A = Bourdi.api; let ctx = A.ctx();
  const { ln, ell } = Bourdi.chats;
  const MANCHES = 3, DUREE = 4, MALUS = 3;
  const DOORS = [10, 128, 246], DW = 104, DT = 212, DB = 500, FLOOR = 650;

  // ---------- Les pieds sous les portes ----------
  const SHOES = ['baskets', 'talons', 'lapins', 'bottes', 'chaussettes', 'mocassins'];
  const SKINS = ['#ffd9b8', '#f2c294', '#c98a5a', '#8d5a36'];
  const PANTS = ['#3a6ad8', '#2f2a3d', '#7a5a3a', '#4aa86a', '#c94a8a', '#8a8aa0'];
  const pick = a => a[Math.floor(Math.random() * a.length)];
  function shoe(k, x, y, flip){
    ctx.save(); ctx.translate(x, y); ctx.scale(flip ? -1 : 1, 1);
    if (k === 'baskets'){ A.blob(-12, -12, 26, 12, 6, '#fff', 3); ln([[-6, -10], [-6, -4]], 2.5, COL.red); ln([[0, -10], [0, -4]], 2.5, COL.red); ln([[-12, -2], [14, -2]], 3, COL.red); }
    else if (k === 'talons'){ ctx.beginPath(); ctx.moveTo(-10, -14); ctx.lineTo(14, -4); ctx.lineTo(14, 0); ctx.lineTo(-4, 0); ctx.closePath(); ctx.fillStyle = COL.pink; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = COL.ink; ctx.lineJoin = 'round'; ctx.stroke(); ln([[-8, -12], [-8, 0]], 4, COL.ink); }
    else if (k === 'lapins'){ ell(2, -6, 15, 8, '#fff'); ell(-4, -18, 3.5, 9, '#fff', 2.5, -.3); ell(4, -18, 3.5, 9, '#fff', 2.5, .3); ell(10, -8, 1.8, 1.8, COL.ink, 0); ell(14, -5, 2, 1.5, COL.pink, 0); }
    else if (k === 'bottes'){ A.blob(-10, -26, 18, 26, 4, '#8a5a2a', 3); A.blob(-10, -10, 26, 10, 5, '#8a5a2a', 3); }
    else if (k === 'chaussettes'){ A.blob(-10, -14, 26, 14, 7, flip ? COL.green : COL.orange, 3); ln([[-6, -12], [-6, -2]], 3, '#fff'); ln([[2, -12], [2, -2]], 3, '#fff'); }
    else { A.blob(-12, -10, 26, 10, 5, '#5b3a29', 3); ln([[-4, -8], [6, -8]], 2, '#c98a4b'); }
    ctx.restore();
  }
  function feet(p, i, t, kick){
    // dessiné en x1,5 pour que l'indice se voie d'un coup d'oeil
    const K = 1.5, cx = DOORS[i] + DW / 2, by = FLOOR - 6, top = (DB - 4 - by) / K;
    const tap = p.up ? Math.max(0, Math.sin(t * 9)) * 3 : 0;          // celui qui a fini tapote du pied
    const stomp = kick > 0 ? Math.sin(kick * 40) * 4 : 0;
    ctx.save(); ctx.translate(cx, by); ctx.scale(K, K);
    [-15, 15].forEach((dx, j) => {
      const x = dx + (j ? stomp : -stomp), lift = j ? tap : 0;
      if (p.up) A.blob(x - 10, top, 20, -top - 8 - lift, 4, p.pants, 3);          // pantalon remonté
      else A.blob(x - 6, top, 13, -top - 12, 6, p.skin, 3);                        // jambes nues
      shoe(p.shoe, x + (j ? 2 : -2), -lift, j === 0);
    });
    if (!p.up){
      // pantalon sur les chevilles, et le slip à coeurs
      A.blob(-34, -20, 68, 15, 7, p.pants, 3);
      A.blob(-19, -29, 38, 11, 5, '#fff', 2.5); ctx.fillStyle = COL.red; [-10, 0, 10].forEach(d => { ctx.beginPath(); ctx.arc(d - 1.5, -24.5, 2, 0, Math.PI * 2); ctx.arc(d + 1.5, -24.5, 2, 0, Math.PI * 2); ctx.fill(); });
    }
    ctx.restore();
  }
  function toilet(cx){
    A.blob(cx - 18, DT + 150, 36, 46, 6, '#fff', 3);
    A.blob(cx - 22, DT + 200, 44, 90, 14, '#fff', 3); ell(cx, DT + 200, 30, 12, '#fff'); ell(cx, DT + 200, 22, 7, '#bfeaff', 2);
    A.blob(cx + 22, DT + 120, 22, 26, 6, '#fff', 3); A.circle(cx + 33, DT + 133, 5, '#ddd', 2);
  }

  // ---------- État ----------
  let G;
  function nouvelleManche(){
    let good; do good = Math.floor(Math.random() * 3); while (G && good === G.good);
    const shoes = SHOES.slice().sort(() => Math.random() - .5);
    G.good = good; G.people = [0, 1, 2].map(i => ({ up: i === good, shoe: shoes[i], skin: pick(SKINS), pants: pick(PANTS) }));
    G.hits = [0, 0, 0]; G.shake = [0, 0, 0]; G.kick = [0, 0, 0]; G.open = 0; G.mTaps = 0;
  }
  function nouvellePartie(){
    G = { t: 0, count: -1.2, score: 0, manche: 1, phase: 'count', pt: 0, curtain: 0, end: 0, good: -1 };
    nouvelleManche();
  }

  // ---------- Sons ----------
  const snd = {
    toc(n){ const f = 150 + (n % 4) * 12; A.tone(0, f, .07, .3, 'sine', f * .6); A.bruit(0, .04, .2, 'lowpass', 900, 1); },
    quelquun(){ A.tone(0, 260, .14, .12, 'sawtooth', 200); A.tone(.13, 200, .25, .12, 'sawtooth', 120); A.bruit(0, .3, .08, 'bandpass', 500, 2); },
    rideau(){ A.bruit(0, .4, .1, 'bandpass', 900, 1.5, 300); },
    chasse(){ A.bruit(0, 1.2, .16, 'bandpass', 2200, 1.2, 280); A.tone(.1, 300, 1, .03, 'sine', 120); },
    grince(){ A.tone(0, 240, .25, .03, 'sawtooth', 380); },
    count(go){ A.tone(0, go ? 1046 : 523, go ? .3 : .12, .08, 'square'); }
  };

  // ---------- Logique ----------
  function update(dt){
    G.t += dt;
    for (let i = 0; i < 3; i++){ G.shake[i] = Math.max(0, G.shake[i] - dt * 6); G.kick[i] = Math.max(0, G.kick[i] - dt); }
    if (G.phase === 'count'){
      const b = Math.ceil(-G.count / .4); G.count += dt; const a = Math.ceil(-G.count / .4);
      if (a !== b) snd.count(a === 0);
      if (G.count >= 0){ G.count = 0; G.phase = 'opening'; snd.rideau(); }
      return;
    }
    if (G.phase === 'opening'){ G.curtain = Math.min(1, G.curtain + dt / .3); if (G.curtain >= 1){ G.phase = 'play'; G.pt = DUREE; } }
    else if (G.phase === 'play'){
      G.pt -= dt;
      if (G.pt <= 0){ G.pt = 0; G.phase = 'libre'; G.lt = 0; A.texte('C\'est libre !', 180, 172, { size: 30, color: COL.green, dur: 1 }); snd.grince(); snd.chasse(); }
    }
    else if (G.phase === 'libre'){
      G.lt += dt; G.open = Math.min(1, G.lt / .25);
      if (G.lt > 1.0){
        if (G.manche >= MANCHES){ G.phase = 'fin'; G.end = G.t; A.texte('Ouf !', 180, 360, { size: 54, color: COL.yellow, dur: 1.3, vy: 0 }); A.sons.bien(); A.particules(180, 360, 40, { speed: 340 }); }
        else { G.phase = 'closing'; snd.rideau(); }
      }
    }
    else if (G.phase === 'closing'){ G.curtain = Math.max(0, G.curtain - dt / .25); if (G.curtain <= 0){ G.manche++; nouvelleManche(); G.phase = 'opening'; snd.rideau(); } }
    else if (G.phase === 'fin' && G.t - G.end > 1.1){ G.phase = 'done'; A.fin({ score: Math.max(0, G.score) }); }
  }
  function down(p){
    if (G.phase !== 'play' || p.y < DT - 30 || p.y > FLOOR + 30) return;
    const i = DOORS.findIndex(x => p.x >= x - 4 && p.x <= x + DW + 4); if (i < 0) return;
    if (i === G.good){
      G.score++; G.mTaps++; G.hits[i]++; G.shake[i] = Math.min(1, .4 + G.mTaps / 30); snd.toc(G.mTaps);
      A.particules(p.x, p.y, 3, { speed: 140, size: 5, shape: 'star', colors: [COL.yellow, COL.white] });
    } else {
      G.score -= MALUS; G.kick[i] = .5; G.shake[i] = .6; snd.quelquun(); A.secousse(5, .2);
      A.texte('Y\'A QUELQU\'UN !', 180, 172, { size: 28, color: COL.red, dur: .8 });
      A.texte('−' + MALUS, DOORS[i] + DW / 2, DT + 40, { size: 30, color: COL.red, dur: .7 });
    }
  }

  // ---------- Dessin ----------
  function drawCurtain(k){
    // k = 0 fermé, 1 ouvert ; deux pans de velours rouge qui glissent sur les côtés
    const w = 190 * (1 - k) + 26;
    [[-10, 1], [370, -1]].forEach(([x0, s]) => {
      const x = s > 0 ? x0 : x0 - w;
      ctx.fillStyle = '#d42a3a'; ctx.fillRect(x, -300, w, 1100);
      for (let i = 0; i < w; i += 22){ ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(x + i, -300, 8, 1100); }
      ctx.lineWidth = 5; ctx.strokeStyle = COL.ink; ctx.strokeRect(x, -300, w, 1100);
    });
    ctx.fillStyle = '#d42a3a'; ctx.fillRect(-20, 120, 400, 34); for (let x = -20; x < 380; x += 40){ A.circle(x + 20, 154, 20, '#d42a3a', 4); }
    ln([[-20, 152], [380, 152]], 4, COL.yellow);
  }
  function draw(){
    ctx = A.ctx();
    // carrelage
    ctx.fillStyle = '#e9f6ff'; ctx.fillRect(-200, -300, 760, 1100);
    for (let y = 150; y < FLOOR; y += 30) for (let x = -200; x < 560; x += 30){ ctx.strokeStyle = '#c4e2f5'; ctx.lineWidth = 2; ctx.strokeRect(x, y, 30, 30); }
    ctx.fillStyle = '#7fd4c9'; ctx.fillRect(-200, FLOOR, 760, 400);
    for (let x = -200; x < 560; x += 40) for (let y = FLOOR; y < 760; y += 40) if (((x + y) / 40) % 2 === 0){ ctx.fillStyle = '#5cbfb3'; ctx.fillRect(x, y, 40, 40); }
    ln([[-200, FLOOR], [560, FLOOR]], 5, COL.ink);
    // cloisons et portes
    A.blob(2, DT - 24, 356, 20, 4, '#9aa6c4', 4);
    DOORS.forEach((x, i) => {
      const good = i === G.good, sh = G.shake[i] * Math.sin(G.t * 70) * 4;
      // intérieur (visible quand la porte s'ouvre)
      ctx.fillStyle = '#bcd7ff'; ctx.fillRect(x, DT, DW, DB - DT);
      if (good && G.open > 0) toilet(x + DW / 2);
      // pieds dessous (sauf porte libérée)
      if (!(good && G.open > 0)) feet(G.people[i], i, G.t, G.kick[i]);
      // battant
      const w = good ? DW * (1 - G.open * .85) : DW;
      ctx.save(); ctx.translate(sh, 0);
      A.blob(x, DT, w, DB - DT, 6, ['#ffb84a', '#ff8fb8', '#8fd0ff'][i], 4);
      if (w > 60){
        A.blob(x + w / 2 - 22, DT + 24, 44, 26, 6, '#fff', 3); A.txt('WC', x + w / 2, DT + 38, 18, COL.ink, { lw: 0 });
        A.blob(x + w - 30, DT + 130, 18, 10, 4, G.phase === 'libre' && good ? COL.green : COL.red, 3);
        A.circle(x + w - 16, DT + 160, 6, COL.yellow, 3);
      }
      ctx.restore();
      // montants
      A.blob(x - 6, DT - 8, 8, FLOOR - DT + 8, 3, '#9aa6c4', 3); if (i === 2) A.blob(x + DW - 2, DT - 8, 8, FLOOR - DT + 8, 3, '#9aa6c4', 3);
    });
    // rideau
    if (G.curtain < 1) drawCurtain(G.curtain);
    // HUD
    A.bigNum(String(Math.max(-999, G.score)), 168, 46, 50, { align: 'right' });
    A.txt('tocs', 178, 58, 22, COL.white, { lw: 6, align: 'left' });
    A.txt('Manche ' + G.manche + '/' + MANCHES, 150, 96, 20, COL.white, { lw: 6 });
    if (G.phase === 'play' || G.phase === 'libre'){
      const k = G.pt / DUREE;
      A.blob(30, 120, 300, 20, 10, '#fff', 4);
      if (k > 0){ A.rr(34, 124, 292 * k, 12, 6); ctx.fillStyle = k < .3 ? COL.red : COL.green; ctx.fill(); }
    }
    if (G.phase === 'count'){ const n = Math.ceil(-G.count / .4), f = (-G.count % .4) / .4;
      ctx.save(); ctx.translate(180, 400); const s = .7 + f * .6; ctx.scale(s, s); A.bigNum(String(n), 0, 0, 120); ctx.restore(); }
  }

  // ---------- Vignette ----------
  function vignette(c, x, y, w, h, t){
    ctx = c; const k = h / 230;
    c.save(); c.translate(x + w / 2, y + h); c.scale(k, k); c.translate(-150, -230);
    c.fillStyle = '#e9f6ff'; c.fillRect(-200, -50, 700, 400);
    c.fillStyle = '#7fd4c9'; c.fillRect(-200, 214, 700, 100); ln([[-200, 214], [500, 214]], 4, COL.ink);
    [[20, '#ffb84a', false, 'talons'], [110, '#ff8fb8', true, 'lapins'], [200, '#8fd0ff', false, 'baskets']].forEach(([dx, col, up, s], i) => {
      const sh = up ? Math.sin(t * 40) * 3 : 0;
      A.blob(dx + sh, 20, 82, 160, 6, col, 4); A.blob(dx + 19 + sh, 36, 44, 22, 5, '#fff', 3); A.txt('WC', dx + 41 + sh, 48, 15, COL.ink, { lw: 0 });
      [-14, 14].forEach((ox, j) => { const cx = dx + 41 + ox;
        if (up) A.blob(cx - 8, 178, 18, 26, 4, '#3a6ad8', 3); else A.blob(cx - 6, 178, 13, 22, 5, '#ffd9b8', 3);
        shoe(s, cx, 210, j === 0); });
      if (!up){ A.blob(dx + 6, 192, 70, 14, 7, '#2f2a3d', 3); }
    });
    A.txt('TOC TOC', 150 + Math.sin(t * 8) * 3, 0, 30, COL.yellow, { lw: 8 });
    c.restore();
  }

  Bourdi.ajouter({
    id: 'toilettes', titre: 'Les Toilettes', court: 'Les Toilettes',
    consigne: 'Envie pressante ! Regarde les pieds sous les portes : toque chez celui qui a remonté son pantalon. Tape le plus vite possible sur la bonne porte !',
    plusPetitGagne: false,
    seuils: { S: 120, A: 100, B: 80, C: 60, D: 40 },
    format: n => Math.max(0, Math.round(n)) + ' tocs',
    musique: 'jeu',
    vignette,
    start(){ ctx = A.ctx(); G = null; nouvellePartie(); },
    update, draw, down,
    etat: () => G
  });
})();
