<script>
'use strict';
// =====================================================================
//  ÉPREUVE 15 — GONFLE LA ROUE
//  Le camion benne (cabine blanche, benne orange, citerne de 1000 litres)
//  a la roue arrière à plat. Taper sur le compresseur pour la gonfler :
//  l'aiguille du cadran (0 à 4 bar, zone rouge après 3) monte à chaque tape.
//  L'air met un petit moment à arriver : l'aiguille continue de monter
//  après la dernière tape. Plus de 3 bar = BOUM, la roue éclate (score 0).
//  Fin : 1,2 s sans taper, ou la barre de temps (10 s) est vide.
//  Score = pression finale en centièmes de bar (300 = 3,00 bar, le maximum).
// =====================================================================
(() => {
  const COL = { ink: '#1d1530', white: '#fff', red: '#ff3b3b', orange: '#ff8a1f', yellow: '#ffd21f', sky: '#5ec8ff', blue: '#2f6bff', green: '#7ad81e', pink: '#ff4fa3', violet: '#8a3ffc' };
  const A = Bourdi.api; let ctx = A.ctx();
  const DUREE = 10;                 // temps pour gonfler (s)
  const TAPE = .075;               // air envoyé par une tape (bar), ±6 %
  const DEBIT = 5;                 // vitesse à laquelle l'air arrive dans la roue
  const LIMITE = 3.004;            // au-dessus : la roue éclate
  const ATTENTE = 1.2;             // sans taper pendant ce temps = on regarde l'aiguille
  const GY = 610, R = 30, RX = 92, FX = 270;      // sol, rayon des roues, roue arrière (crevée), roue avant
  const DX = 180, DY = 236, DR = 104;              // le cadran
  const A0 = Math.PI * .75, SWEEP = Math.PI * 1.5; // 0 bar en bas à gauche, 4 bar en bas à droite

  function ln(pts, w, c){ ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.lineWidth = w; ctx.strokeStyle = c; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); }
  function ell(x, y, rx, ry, fill, lw = 3){ ctx.beginPath(); ctx.ellipse(x, y, Math.max(1, rx), Math.max(1, ry), 0, 0, Math.PI * 2); if (fill){ ctx.fillStyle = fill; ctx.fill(); } if (lw){ ctx.lineWidth = lw; ctx.strokeStyle = COL.ink; ctx.stroke(); } }

  let G;
  function nouvellePartie(){
    G = { t: 0, count: -1.2, p: 0, air: 0, play: 0, last: 0, taps: 0, ferme: false, end: 0, endDur: 0, boum: false, fin: '', score: 0, pompe: 0, eau: 0, eauV: 0, bouts: [], fini: false, aig: 0 };
  }

  const snd = {
    count(go){ A.tone(0, go ? 1046 : 523, go ? .3 : .12, .08, 'square'); },
    pschit(){ A.bruit(0, .09, .22, 'highpass', 2600, 1); A.tone(0, 95 + Math.random() * 15, .07, .06, 'square'); },
    boum(){ A.bruit(0, .8, .55, 'lowpass', 260, 1); A.bruit(0, .25, .4, 'highpass', 1400, 1); A.bruit(.15, 1.4, .12, 'bandpass', 3200, 1, 900); },
    fin(){ A.tone(0, 660, .1, .07, 'triangle'); A.tone(.1, 880, .16, .07, 'triangle'); }
  };

  function tape(){
    if (G.count < 0 || G.end || G.ferme) return;
    G.air += TAPE * (.94 + Math.random() * .12); G.taps++; G.last = G.play; G.pompe = 1;
    G.eauV += (Math.random() < .5 ? -1 : 1) * 1.2;
    snd.pschit();
    A.particules(RX + 26, GY - R - 4, 3, { colors: ['#ffffff', '#dff4ff'], speed: 80, size: 5 });
  }
  function boum(){
    G.boum = true; G.score = 0; G.end = G.t; G.endDur = 4.3; G.air = 0;
    snd.boum(); A.secousse(18, .6);
    A.texte('BOUM !', RX + 40, GY - 120, { size: 54, color: COL.red, dur: 1.2, vy: -30 });
    A.particules(RX, GY - R, 40, { colors: ['#2f2a3d', '#4a4458', '#ffffff'], speed: 520, size: 9 });
    for (let i = 0; i < 9; i++) G.bouts.push({ x: RX, y: GY - R, vx: (Math.random() - .5) * 520, vy: -200 - Math.random() * 420, r: 0, vr: (Math.random() - .5) * 14, w: 10 + Math.random() * 14 });
    setTimeout(() => { if (G.boum) G.fin = 'Oh mince\u00a0! Comment on va faire les voyages d\'eau\u00a0?'; }, 700);
  }
  function finir(){
    G.fini = true; G.end = G.t; G.endDur = 2.2;
    G.score = Math.round(G.p * 100);                 // en centièmes de bar (le classement n'aime que les entiers)
    if (G.score >= 300){ A.sons.bien(); A.dire('Pile poil !'); A.texte('Pile poil !', 180, 400, { size: 34, color: COL.green, dur: 1.4, vy: -20 }); A.particules(DX, DY, 40, { speed: 320 }); }
    else snd.fin();
  }

  function update(dt){
    G.t += dt;
    G.pompe = Math.max(0, G.pompe - dt * 7);
    // l'eau ballotte dans la citerne
    G.eauV += -G.eau * 40 * dt; G.eauV *= Math.pow(.25, dt); G.eau += G.eauV * dt * 8; G.eau = Math.max(-1, Math.min(1, G.eau));
    G.bouts.forEach(b => { b.vy += 1000 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt; if (b.y > GY + 6){ b.y = GY + 6; b.vy *= -.25; b.vx *= .6; b.vr *= .5; } });
    // l'aiguille suit la pression avec un peu de souplesse
    G.aig += ((G.boum ? 0 : G.p) - G.aig) * Math.min(1, dt * (G.boum ? 3 : 14));
    if (G.count < 0){ const b = Math.ceil(-G.count / .4); G.count += dt; const a = Math.ceil(-G.count / .4); if (a !== b) snd.count(a === 0); if (G.count >= 0) G.count = 0; return; }
    if (G.end){
      if (G.end > 0 && G.t - G.end > G.endDur){ G.end = -1; A.fin({ score: G.score }); }
      return;
    }
    G.play += dt;
    // l'air arrive petit à petit dans la roue
    const f = G.air * Math.min(1, DEBIT * dt); G.p += f; G.air -= f;
    if (G.p > LIMITE){ boum(); return; }
    if (G.play >= DUREE) G.ferme = true;
    const arret = G.ferme || (G.taps > 0 && G.play - G.last > ATTENTE);
    if (arret && G.air < .002){ G.p += G.air; G.air = 0; if (G.p > LIMITE){ boum(); return; } finir(); }
  }

  // ---------- Dessin ----------
  function decor(){
    const g = ctx.createLinearGradient(0, 0, 0, GY); g.addColorStop(0, '#3fb4ff'); g.addColorStop(1, '#cdf0ff');
    ctx.fillStyle = g; ctx.fillRect(-200, -100, 760, GY + 100);
    [[40, 400, 1], [300, 360, .8]].forEach(([x, y, k]) => { [[0, 0, 18], [18, -7, 22], [38, 0, 16]].forEach(([a, b, r]) => A.circle(x + a * k + Math.sin(G.t * .2 + x) * 6, y + b * k, r * k, '#fff', 0)); });
    ctx.fillStyle = '#8fd36a'; ctx.beginPath(); ctx.moveTo(-200, 520); ctx.quadraticCurveTo(80, 450, 220, 500); ctx.quadraticCurveTo(340, 460, 560, 505); ctx.lineTo(560, GY); ctx.lineTo(-200, GY); ctx.fill();
    // la cour en gravier
    ctx.fillStyle = '#d8c7a4'; ctx.fillRect(-200, GY, 760, 300); ln([[-200, GY], [560, GY]], 4, COL.ink);
    [[20, 640], [70, 680], [130, 655], [300, 690], [330, 645], [250, 705], [40, 710]].forEach(([x, y]) => ell(x, y, 5, 3, '#b8a684', 2));
  }
  // une roue normale
  function roue(x, cy){
    A.circle(x, cy, R, '#2f2a3d', 4); A.circle(x, cy, 13, '#c9c3d9', 3);
    for (let i = 0; i < 5; i++){ const a = i * Math.PI * .4; A.circle(x + Math.cos(a) * 7, cy + Math.sin(a) * 7, 1.8, COL.ink, 0); }
  }
  // la roue arrière : écrasée quand elle est à plat, ronde quand elle est gonflée
  function roueArriere(k){
    const plat = G && G.boum ? 1.25 : 1 - k;
    const ry = R - plat * 11, rx = R + plat * 7, cy = GY - ry;
    ell(RX, cy, rx, ry, '#2f2a3d', 4);
    if (plat > .3) ln([[RX - rx + 6, GY - 3], [RX + rx - 6, GY - 3]], 3, '#1a1626');
    A.circle(RX, GY - (R - plat * 5) + plat * 3, 13, '#c9c3d9', 3);
    const vy = GY - (R - plat * 5) + plat * 3;
    for (let i = 0; i < 5; i++){ const a = i * Math.PI * .4; A.circle(RX + Math.cos(a) * 7, vy + Math.sin(a) * 7, 1.8, COL.ink, 0); }
    return { vx: RX + 10, vy: vy - 9 };   // la valve
  }
  function camion(k){
    const a = -(G && G.boum ? 1.2 : 1 - k) * .06;      // le camion penche du côté de la roue à plat
    ctx.save(); ctx.translate(FX, GY); ctx.rotate(a); ctx.translate(-FX, -GY);
    // châssis
    A.blob(40, 538, 292, 16, 5, '#4a4458', 3.5);
    // pare-boue et passages de roue
    A.blob(52, 548, 80, 12, 5, '#2f2a3d', 2.5);
    // benne orange

<script>

    [-12, -4, 4].forEach(v => ln([[X(v), Y(-18 + (v + 12) * .3)], [X(v + 6), Y(-12 + (v + 12) * .3)]], 2.5, '#fff'));
  }
  function draw(){
    ctx = A.ctx();
    decor();
    coureur();
    minuteur();
    // les deux zones de pieds
    ctx.fillStyle = COL.ink; ctx.fillRect(-200, FY - 6, 760, 300);
    [['g', 6, -1], ['d', 184, 1]].forEach(([k, x, d]) => {
      const on = G.pied[k] > .3;
      A.blob(x, FY + (on ? 4 : 0), 170, 100, 22, on ? '#fff3c4' : '#fff6e0', 4);
      chaussure(x + 85, FY + 50, d, on);

    // HUD : litres perdus
    const L = G.phase === 'fini' ? G.litres : G.phase === 'attente' ? G.penal * DEBIT : litres();
    A.bigNum((Math.round(L * 10) / 10).toFixed(1).replace('.', ','), 196, 46, 50, { align: 'right' });
    A.txt('litres', 206, 58, 22, COL.white, { lw: 6, align: 'left' });
  }
  function down(p){
    if (p.y >= FY - 6){ pied(p.x < 180 ? 'g' : 'd'); return; }
    const vx = XV + 40 - 70 - G.cam, vy = GY - 76;

    c.save(); c.translate(150, 130); c.scale(.62, .62); c.translate(-180, -440);

    c.restore(); G = save;
  }
  Bourdi.ajouter({
    id: 'vaches', titre: 'Fermer l\'eau des vaches', court: 'L\'eau des vaches',
    consigne: 'Attends que le minuteur sonne, puis tape gauche, droite, gauche, droite pour courir. Arrivé à la vanne, tape dessus pour fermer l\'eau !',
    plusPetitGagne: true,
    seuils: { S: 105, A: 135, B: 165, C: 210, D: 270 },        // décilitres
    format: n => (Math.max(0, n) / 10).toFixed(1).replace('.', ',') + ' litres',
    musique: 'jeu', vignette,

})();

<script>
'use strict';
// =====================================================================
//  ÉPREUVE 18 — LES ŒUFS DES POULES   (gyroscope seulement)
//  On marche tout seul du poulailler à la maison avec un panier de 12 œufs.
//  Bosses, poules qui traversent et Winkle (croche-patte) font pencher le
//  panier : on penche le téléphone dans l'autre sens pour le redresser.
//  Trop penché = un œuf tombe (« Crac ! ») et un chat vient le manger.
//  La position du téléphone au départ = « bien droit ».
//  Score = œufs arrivés entiers.
// =====================================================================
(() => {
  const COL = { ink: '#1d1530', white: '#fff', red: '#ff3b3b', orange: '#ff8a1f', yellow: '#ffd21f', sky: '#5ec8ff', blue: '#2f6bff', green: '#7ad81e', pink: '#ff4fa3', violet: '#8a3ffc' };
  const A = Bourdi.api; let ctx = A.ctx();
  const { LOOKS, drawCat, ln, ell } = Bourdi.chats;
  const OEUFS = 12, VIT = 62, LONG = 1550;      // œufs, vitesse de marche (px/s), longueur du chemin
  const GY = 560, PX = 150;                       // sol, position du marcheur à l'écran
  const SENS = 22;                                // degrés de penchée du téléphone pour « 1 » (un œuf tombe à 1)

  // ---------- le gyroscope ----------
  let gamma = null, demande = false;
  addEventListener('deviceorientation', e => { if (e.gamma != null) gamma = e.gamma; });
  // l'iPhone demande l'autorisation pendant un toucher : on la demande quand on touche l'écran de présentation de l'épreuve
  addEventListener('touchend', () => {
    try {
      if (demande || typeof DeviceOrientationEvent === 'undefined' || !DeviceOrientationEvent.requestPermission) return;
      if (scene !== 'intro' || !EPREUVES[curIdx] || EPREUVES[curIdx].id !== 'oeufs') return;
      demande = true; DeviceOrientationEvent.requestPermission().catch(() => { demande = false; });
    } catch (e) {}
  }, true);

  let G;
  function nouvellePartie(){
    const ev = [];
    for (let x = 160; x < LONG - 80; x += 70 + Math.random() * 70) ev.push({ x, k: 'bosse', s: Math.random() < .5 ? -1 : 1, fait: false });
    [420, 980].forEach(x => ev.push({ x: x + Math.random() * 120, k: 'poule', s: Math.random() < .5 ? -1 : 1, fait: false }));
    [700, 1250].forEach(x => ev.push({ x: x + Math.random() * 100, k: 'winkle', s: Math.random() < .5 ? -1 : 1, fait: false }));
    G = { t: 0, count: -1.2, g0: null, oeufs: OEUFS, d: 0, v: 0, b: 0, tilt: 0, x: 0, cd: 0, ev, chutes: [], chats: [], poules: [], wink: null, trebuche: 0, end: 0, pas: 0 };
  }

  const snd = {
    count(go){ A.tone(0, go ? 1046 : 523, go ? .3 : .12, .08, 'square'); },
    bosse(){ A.bruit(0, .08, .15, 'lowpass', 300, 1); },
    crac(){ A.bruit(0, .12, .3, 'highpass', 1800, 1); A.tone(0, 220, .12, .06, 'square', 120); },
    cot(){ [0, .1, .2].forEach((d, i) => A.tone(d, 700 + i * 90, .07, .05, 'square')); },
    miaou(){ A.tone(0, 700, .25, .06, 'triangle', 450); },
    fin(){ A.sons.bien(); }
  };

  function pousse(f){ G.v += f; }
  function update(dt){
    G.t += dt;
    G.chutes.forEach(c => { if (c.y < GY + 6){ c.vy += 900 * dt; c.x += c.vx * dt; c.y += c.vy * dt; if (c.y >= GY + 6){ c.y = GY + 6; c.casse = true; } } });
    G.chats.forEach(c => { c.t += dt; if (c.st === 'va'){ c.x += c.dir * 160 * dt; if ((c.x - c.but) * c.dir >= 0){ c.st = 'mange'; c.t = 0; } } else if (c.st === 'mange' && c.t > 1.4){ c.st = 'part'; c.cible.mange = true; } else if (c.st === 'part') c.x -= c.dir * 170 * dt; });
    G.poules.forEach(p => { p.t += dt; p.y += p.vy * dt; });
    if (G.wink) G.wink.t += dt;
    if (G.count < 0){ const b = Math.ceil(-G.count / .4); G.count += dt; const a = Math.ceil(-G.count / .4); if (a !== b) snd.count(a === 0); if (G.count >= 0){ G.count = 0; G.g0 = gamma; } return; }
    if (G.end){ if (G.end > 0 && G.t - G.end > 1.8){ G.end = -1; A.fin({ score: G.oeufs }); } return; }
    // on marche
    G.x += VIT * dt; G.pas += dt;
    G.trebuche = Math.max(0, G.trebuche - dt);
    const k = Math.min(1, G.x / LONG);
    // le panier bouge tout seul (de plus en plus), plus les obstacles
    G.v += (Math.random() - .5) * (1.9 + k * 2) * dt * 6;
    G.v *= Math.pow(.3, dt);
    G.d += G.v * dt;
    G.ev.forEach(e => {
      if (e.fait || G.x < e.x) return;
      e.fait = true;
      if (e.k === 'bosse'){ pousse(e.s * (.45 + k * .45)); snd.bosse(); A.secousse(2, .1); }
      else if (e.k === 'poule'){ pousse(e.s * .9); snd.cot(); G.poules.push({ x: e.x + 30, y: GY - 60, vy: 90, t: 0 }); }
      else { pousse(e.s * 1.6); G.trebuche = .5; snd.miaou(); A.secousse(8, .3); G.wink = { x: e.x, t: 0 }; }
    });
    // le téléphone redresse le panier
    G.tilt = G.g0 != null && gamma != null ? Math.max(-1.6, Math.min(1.6, (gamma - G.g0) / SENS)) : 0;
    G.b = G.d + G.tilt;
    G.cd -= dt;
    if (Math.abs(G.b) > 1 && G.cd <= 0 && G.oeufs > 0){
      const s = Math.sign(G.b);
      G.oeufs--; G.cd = .35; G.d -= s * .2; G.v *= .4;
      const c = { x: G.x + PX + s * 40, y: GY - 120, vx: s * 140, vy: -120, casse: false, mange: false };
      G.chutes.push(c);
      setTimeout(() => { snd.crac(); A.texte('Crac !', c.x - G.x, GY - 40, { size: 28, color: COL.yellow, dur: .8 }); }, 380);
      // un chat arrive pour manger l'œuf
      const L = [LOOKS.brabus, LOOKS.prince, LOOKS.winkle][Math.floor(Math.random() * 3)], dir = s;
      G.chats.push({ L, x: c.x + s * 260, but: c.x + s * 150 + s * 26, dir: -dir, st: 'va', t: 0, cible: c });
      G.chats[G.chats.length - 1].x = c.x + s * 220; G.chats[G.chats.length - 1].but = c.x + s * 30;
    }
    if (G.x >= LONG){ G.end = G.t; snd.fin(); A.particules(PX, GY - 140, 30, { speed: 300 }); }
  }

  // ---------- Dessin ----------
  function oeuf(x, y, r = 0){ ctx.save(); ctx.translate(x, y); ctx.rotate(r); ell(0, 0, 8, 10.5, '#fff6e6', 2.5); ell(-2.5, -3.5, 2.5, 3.5, 'rgba(255,255,255,.9)', 0); ctx.restore(); }
  function decor(){
    const g = ctx.createLinearGradient(0, 0, 0, GY); g.addColorStop(0, '#3fb4ff'); g.addColorStop(1, '#cdf0ff');
    ctx.fillStyle = g; ctx.fillRect(-200, -100, 760, GY + 100);
    A.circle(300, 150, 30, '#ffe066', 4);
    ctx.save(); ctx.translate(-G.x * .3, 0);
    ctx.fillStyle = '#8fd36a'; ctx.beginPath(); ctx.moveTo(-200, 470); ctx.quadraticCurveTo(300, 400, 700, 460); ctx.quadraticCurveTo(1000, 410, 1400, 470); ctx.lineTo(1400, GY); ctx.lineTo(-200, GY); ctx.fill();
    ctx.restore();
    ctx.save(); ctx.translate(-G.x, 0);
    // le poulailler (départ) et la maison (arrivée)
    A.blob(-40, 420, 150, 140, 6, '#c98a5a', 4); ctx.beginPath(); ctx.moveTo(-56, 426); ctx.lineTo(35, 360); ctx.lineTo(126, 426); ctx.closePath(); ctx.fillStyle = '#8a4a1e'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = COL.ink; ctx.stroke();
    A.blob(20, 490, 34, 70, 14, '#3a2a20', 3);
    const mx = LONG + PX + 60;
    A.blob(mx, 380, 200, 180, 6, '#fff3d6', 4); ctx.beginPath(); ctx.moveTo(mx - 16, 386); ctx.lineTo(mx + 100, 300); ctx.lineTo(mx + 216, 386); ctx.closePath(); ctx.fillStyle = COL.red; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = COL.ink; ctx.stroke();
    A.blob(mx + 20, 460, 50, 100, 4, '#9a5a2a', 4);
    // le chemin et ses bosses
    ctx.fillStyle = '#7cc84f'; ctx.fillRect(-200, GY, LONG + 900, 200); ctx.fillStyle = '#d8b88a'; ctx.fillRect(-200, GY + 6, LONG + 900, 34);
    ln([[-200, GY], [LONG + 700, GY]], 4, COL.ink);
    G.ev.forEach(e => { if (e.k === 'bosse') ell(e.x + PX, GY + 4, 14, 6, '#a9a39a', 2.5); });
    // les œufs cassés par terre
    G.chutes.forEach(c => { if (!c.casse) oeuf(c.x, c.y, c.vx * .01 * c.y); else if (!c.mange){ ell(c.x, c.y, 16, 5, '#fff6e6', 2); ell(c.x, c.y - 1, 6, 3, COL.yellow, 0); } });
    // les chats qui viennent les manger
    G.chats.forEach(c => drawCat(c.L, c.x, GY + 8, .75, c.st === 'mange' ? 'crouch' : 'walk', G.t * 2, { dir: c.st === 'part' ? -c.dir : c.dir }));
    // les poules qui traversent
    G.poules.forEach(p => poule(p.x, Math.min(GY + 60, p.y), p.t));
    if (G.wink && G.wink.t < 1.6) drawCat(LOOKS.winkle, G.wink.x + PX - 60 + G.wink.t * 130, GY + 6, .8, 'walk', G.t * 2, { dir: 1 });
    ctx.restore();
  }
  function poule(x, y, t){
    ctx.save(); ctx.translate(x, y);
    ell(0, -20, 20, 16, '#c8823c', 3); ell(16, -36, 9, 9, '#c8823c', 3); A.circle(18, -46, 4, COL.red, 2);
    ctx.beginPath(); ctx.moveTo(24, -37); ctx.lineTo(32, -34); ctx.lineTo(24, -31); ctx.fillStyle = COL.yellow; ctx.fill();
    ln([[-4, -6], [-4 + Math.sin(t * 20) * 4, 4]], 3, COL.orange); ln([[6, -6], [6 - Math.sin(t * 20) * 4, 4]], 3, COL.orange);
    ctx.restore();
  }
  function marcheur(){
    const x = PX, y = GY + 12, ph = Math.sin(G.pas * 9), tr = G.trebuche > 0 ? Math.sin(G.t * 30) * .12 : 0;
    ctx.save(); ctx.translate(x, y); ctx.rotate(tr);
    const sw = G.end || G.count < 0 ? 0 : ph * 12;
    ln([[0, -46], [sw, -2]], 10, COL.ink); ln([[0, -46], [sw, -2]], 6, '#3a4a8a'); ell(sw + 6, -2, 9, 5, '#5b3a29', 2.5);
    ln([[0, -46], [-sw, -2]], 10, COL.ink); ln([[0, -46], [-sw, -2]], 6, '#2f3a70'); ell(-sw + 6, -2, 9, 5, '#5b3a29', 2.5);
    A.blob(-14, -94, 28, 52, 10, COL.blue, 3);
    A.circle(4, -110, 17, '#f2c294', 3);
    ctx.beginPath(); ctx.arc(4, -110, 17, Math.PI * 1.05, Math.PI * 1.95); ctx.fillStyle = '#3a2a20'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = COL.ink; ctx.stroke();
    A.circle(12, -110, 2.5, COL.ink, 0); ln([[10, -101], [16, -102]], 2.5, COL.ink);
    // le panier tenu devant, qui penche
    const ang = Math.max(-.9, Math.min(.9, G.b * .5));
    ctx.save(); ctx.translate(22, -76); ctx.rotate(ang);
    ln([[-16, 0], [-4, -10]], 7, COL.ink); ln([[-16, 0], [-4, -10]], 3, COL.blue);
    const n = G.oeufs, slide = Math.max(-1, Math.min(1, G.b)) * 10;
    for (let i = 0; i < n; i++){ const row = i < 6 ? 0 : 1, col = row ? i - 6 : i; oeuf(-24 + col * 10 + slide + row * 5, -10 - row * 9, (col - 3) * .08); }
    ctx.beginPath(); ctx.moveTo(-36, -8); ctx.lineTo(36, -8); ctx.lineTo(28, 18); ctx.lineTo(-28, 18); ctx.closePath(); ctx.fillStyle = '#c98a3a'; ctx.fill(); ctx.lineWidth = 3.5; ctx.strokeStyle = COL.ink; ctx.lineJoin = 'round'; ctx.stroke();
    for (let i = -2; i <= 2; i++) ln([[i * 12, -6], [i * 10, 16]], 2, '#8a5a22');
    ctx.beginPath(); ctx.arc(0, -8, 30, Math.PI * 1.08, Math.PI * 1.92); ctx.lineWidth = 6; ctx.strokeStyle = COL.ink; ctx.stroke(); ctx.lineWidth = 3; ctx.strokeStyle = '#c98a3a'; ctx.stroke();
    ctx.restore();
    ctx.restore();
  }
  function niveau(){
    // le niveau à bulle : où penche le panier (rouge = un œuf va tomber)
    const b = Math.max(-1.2, Math.min(1.2, G.b));
    A.blob(40, 96, 280, 26, 13, '#fff', 4);
    A.rr(44, 100, 272, 18, 9); ctx.fillStyle = Math.abs(b) > .8 ? '#ffb3b3' : '#d9f7c4'; ctx.fill();
    ln([[180 - 112, 100], [180 - 112, 118]], 3, COL.red); ln([[180 + 112, 100], [180 + 112, 118]], 3, COL.red);
    A.circle(180 + b * 112, 109, 9, Math.abs(b) > .8 ? COL.red : COL.green, 3);
  }
  function draw(){
    ctx = A.ctx();
    decor();
    marcheur();
    niveau();
    A.bigNum(String(G.oeufs), 196, 46, 50, { align: 'right' });
    A.txt('œufs', 206, 58, 22, COL.white, { lw: 6, align: 'left' });
    if (G.count < 0){ const n = Math.ceil(-G.count / .4), fr = (-G.count % .4) / .4;
      ctx.save(); ctx.translate(180, 330); const s = .7 + fr * .6; ctx.scale(s, s); A.bigNum(String(n), 0, 0, 120); ctx.restore(); }
  }
  function vignette(c, x, y, w, h, t){
    ctx = c; const k = h / 230, save = G;
    G = { t, x: 0, b: Math.sin(t * 1.5) * .7, oeufs: OEUFS, pas: t, trebuche: 0, end: 0, count: 0, ev: [], chutes: [], chats: [], poules: [], wink: null };
    c.save(); c.translate(x + w / 2, y + h); c.scale(k, k); c.translate(-150, -230);
    c.save(); c.translate(150, 150); c.scale(1.15, 1.15); c.translate(-PX - 10, -GY + 30);
    c.fillStyle = '#9fdcff'; c.fillRect(-100, 300, 500, 300); c.fillStyle = '#d8b88a'; c.fillRect(-100, GY, 500, 60);
    marcheur(); poule(PX + 70, GY + 4, t);
    c.restore();
    c.restore(); G = save;
  }
  Bourdi.ajouter({
    id: 'oeufs', titre: 'Les Œufs des poules', court: 'Les Œufs',
    consigne: 'Penche ton téléphone pour garder le panier bien droit jusqu\'à la maison. Attention aux poules et à Winkle !',
    bientot: true,                 // en pause (9 nov.) : seulement en mode TEST, « À venir » pour les autres
    plusPetitGagne: false,
    seuils: { S: 12, A: 10, B: 8, C: 6, D: 4 },
    format: n => Math.max(0, Math.round(n)) + ' œufs',
    musique: 'jeu', vignette,
    start(){ ctx = A.ctx(); nouvellePartie(); },
    update, draw, etat: () => G
  });
})();

<script>
'use strict';
// =====================================================================
//  ÉPREUVE 19 — LES MOUCHES   (textes validés le 9 nov.)
//  20 s : glisser le doigt sur les mouches pour les attraper dans la main.
//  Attraper une punaise : ça pue (« Beurk ! »), la main s'ouvre, une mouche s'échappe.
//  Puis : un grand coup de doigt vers le bas pour les écraser par terre.
//  Plus le geste est rapide, plus il y en a d'écrasées ; les autres s'envolent.
//  Score = mouches écrasées.
// =====================================================================
(() => {
  const COL = { ink: '#1d1530', white: '#fff', red: '#ff3b3b', orange: '#ff8a1f', yellow: '#ffd21f', sky: '#5ec8ff', blue: '#2f6bff', green: '#7ad81e', pink: '#ff4fa3', violet: '#8a3ffc' };
  const A = Bourdi.api; let ctx = A.ctx();
  const DUREE = 20, RAYON = 26;
  const ZONE = { x0: 20, x1: 340, y0: 150, y1: 560 };

  function ln(pts, w, c){ ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.lineWidth = w; ctx.strokeStyle = c; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); }
  function ell(x, y, rx, ry, fill, lw = 3, rot = 0){ ctx.beginPath(); ctx.ellipse(x, y, Math.max(1, rx), Math.max(1, ry), rot, 0, Math.PI * 2); if (fill){ ctx.fillStyle = fill; ctx.fill(); } if (lw){ ctx.lineWidth = lw; ctx.strokeStyle = COL.ink; ctx.stroke(); } }

  let G;
  const bete = k => ({ k, x: ZONE.x0 + Math.random() * (ZONE.x1 - ZONE.x0), y: ZONE.y0 + Math.random() * (ZONE.y1 - ZONE.y0), a: Math.random() * 6.3, v: k === 'punaise' ? 50 : 120 + Math.random() * 80, t: Math.random() * 9 });
  function nouvellePartie(){
    G = { t: 0, count: -1.2, play: 0, phase: 'chasse', main: 0, score: 0, betes: [], trait: null, traits: [], pue: 0, nuages: [], fuites: [], end: 0, coup: null, ecr: 0 };
    for (let i = 0; i < 7; i++) G.betes.push(bete('mouche'));
    G.betes.push(bete('punaise'));
  }

  const snd = {
    count(go){ A.tone(0, go ? 1046 : 523, go ? .3 : .12, .08, 'square'); },
    attrape(){ A.tone(0, 600 + Math.random() * 200, .05, .05, 'square'); },
    beurk(){ A.sons.erreur(); },
    splat(n){ A.bruit(0, .3, .5, 'lowpass', 400, 1); for (let i = 0; i < Math.min(8, n); i++) A.bruit(.03 * i, .06, .2, 'bandpass', 900 + i * 120, 2); },
    bzz(){ A.bruit(0, .25, .04, 'bandpass', 260, 4); }
  };

  function attrape(x0, y0, x1, y1){
    // tout ce qui est près du trait du doigt est attrapé
    const dx = x1 - x0, dy = y1 - y0, L2 = dx * dx + dy * dy || 1;
    for (let i = G.betes.length - 1; i >= 0; i--){
      const b = G.betes[i], t = Math.max(0, Math.min(1, ((b.x - x0) * dx + (b.y - y0) * dy) / L2));
      if (Math.hypot(b.x - (x0 + dx * t), b.y - (y0 + dy * t)) > RAYON) continue;
      G.betes.splice(i, 1);
      if (b.k === 'punaise'){
        snd.beurk(); A.dire('Beurk !'); A.texte('Beurk !', b.x, b.y - 30, { size: 30, color: COL.green, dur: .9 });
        G.pue = 1.2; G.nuages.push({ x: b.x, y: b.y, t: 0 });
        if (G.main > 0){ G.main--; G.fuites.push({ x: 180, y: 640, vx: (Math.random() - .5) * 300, vy: -380, t: 0 }); }
        G.trait = null;                                     // la main s'ouvre : le geste s'arrête
        setTimeout(() => G.betes.push(bete('punaise')), 1500);
        return;
      }
      G.main++; snd.attrape();
      G.betes.push(bete('mouche'));
    }
  }

  function update(dt){
    G.t += dt;
    G.pue = Math.max(0, G.pue - dt);
    G.nuages.forEach(n => n.t += dt); G.nuages = G.nuages.filter(n => n.t < 2.5);
    G.fuites.forEach(f => { f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; }); G.fuites = G.fuites.filter(f => f.t < 2);
    G.traits.forEach(tr => tr.t += dt); G.traits = G.traits.filter(tr => tr.t < .25);
    if (G.count < 0){ const b = Math.ceil(-G.count / .4); G.count += dt; const a = Math.ceil(-G.count / .4); if (a !== b) snd.count(a === 0); if (G.count >= 0) G.count = 0; return; }
    if (G.end){ if (G.end > 0 && G.t - G.end > 2){ G.end = -1; A.fin({ score: G.score }); } return; }
    if (G.phase === 'chasse'){
      G.play += dt;
      const k = Math.min(1, G.play / DUREE);
      G.betes.forEach(b => {
        b.t += dt; b.a += Math.sin(b.t * 3 + b.x) * 3 * dt + (Math.random() - .5) * 4 * dt;
        const v = b.v * (1 + k * .6);
        b.x += Math.cos(b.a) * v * dt; b.y += Math.sin(b.a) * v * dt;
        if (b.x < ZONE.x0 || b.x > ZONE.x1) { b.a = Math.PI - b.a; b.x = Math.max(ZONE.x0, Math.min(ZONE.x1, b.x)); }
        if (b.y < ZONE.y0 || b.y > ZONE.y1) { b.a = -b.a; b.y = Math.max(ZONE.y0, Math.min(ZONE.y1, b.y)); }
      });
      if (Math.random() < dt * 1.5) snd.bzz();
      if (G.play >= DUREE){ G.phase = 'ecrase'; G.ecr = 0; G.trait = null; A.texte('Écrase-les !', 180, 300, { size: 38, color: COL.yellow, dur: 1.4 }); }
    } else if (G.phase === 'ecrase'){
      G.ecr += dt;
      if (G.ecr > 4) ecrase(0);                               // pas de coup : elles s'envolent toutes
    }
  }
  function ecrase(vit){
    // la force du coup vers le bas décide combien sont écrasées
    const f = Math.max(0, Math.min(1, (vit - 500) / 1700));
    const n = G.main, ok = Math.round(n * (vit > 0 ? .3 + .7 * f : 0));
    G.score = ok; G.phase = 'fini'; G.end = G.t;
    for (let i = 0; i < n - ok; i++) G.fuites.push({ x: 180 + (Math.random() - .5) * 60, y: 620, vx: (Math.random() - .5) * 400, vy: -300 - Math.random() * 300, t: 0 });
    if (ok > 0){ snd.splat(ok); A.secousse(6 + f * 14, .4); A.texte('SPLAT !', 180, 560, { size: 44, color: COL.red, dur: 1.2 }); }

  // ---------- Dessin ----------
  function decor(){
    ctx.fillStyle = '#fff1d6'; ctx.fillRect(-200, -100, 760, 900);
    ctx.fillStyle = '#ffe2b0'; for (let y = -100; y < 620; y += 40) ctx.fillRect(-200, y, 760, 18);
    A.blob(220, 170, 110, 90, 6, '#bfeaff', 4); ln([[275, 170], [275, 260]], 4, COL.ink);
    // le plan de travail et le sol
    A.blob(-20, 590, 400, 30, 6, '#c98a5a', 4);
    ctx.fillStyle = '#9a8fb0'; ctx.fillRect(-200, 620, 760, 300);
    for (let x = -200; x < 560; x += 60) ln([[x, 620], [x + 40, 720]], 2, '#8a7fa0');
  }
  function mouche(b){
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a);
    const w = Math.sin(G.t * 60 + b.t) * .4;
    ctx.globalAlpha = .7; ell(-2, -8, 9, 5, '#dff4ff', 1.5, -.6 + w); ell(-2, 8, 9, 5, '#dff4ff', 1.5, .6 - w); ctx.globalAlpha = 1;
    ell(0, 0, 10, 6.5, '#2f2a3d', 2); A.circle(9, 0, 5, '#2f2a3d', 2); A.circle(11, -3, 2.5, COL.red, 0); A.circle(11, 3, 2.5, COL.red, 0);
    ctx.restore();
  }
  function punaise(b){
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a);
    [-1, 1].forEach(d => [-6, 0, 6].forEach(x => ln([[x, d * 6], [x + 3, d * 14]], 2, COL.ink)));
    ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(4, -11); ctx.lineTo(-12, -9); ctx.lineTo(-14, 0); ctx.lineTo(-12, 9); ctx.lineTo(4, 11); ctx.closePath();
    ctx.fillStyle = '#6b8a3a'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = COL.ink; ctx.stroke();
    ln([[4, -10], [-6, 0], [4, 10]], 2, '#4a6a2a'); A.circle(14, 0, 3.5, '#4a6a2a', 2);
    ctx.restore();
  }
  function main(){
    const ouverte = G.pue > .8, y = G.phase === 'ecrase' ? 300 + Math.sin(G.t * 6) * 6 : 650;
    ctx.save(); ctx.translate(180, y);
    if (ouverte){ ell(0, 0, 34, 26, '#f2c294', 3.5); [-24, -10, 4, 18].forEach((x, i) => A.blob(x - 6, -54 + Math.abs(i - 1.5) * 4, 13, 34, 6, '#f2c294', 3)); A.blob(26, -14, 30, 13, 6, '#f2c294', 3); }
    else { A.blob(-34, -26, 68, 52, 22, '#f2c294', 3.5); [-22, -8, 6, 20].forEach(x => ln([[x, -24], [x, -6]], 2.5, '#c98a5a')); A.blob(-40, -6, 22, 26, 10, '#f2c294', 3); }
    ctx.restore();
    if (G.main > 0 && !ouverte){ A.circle(222, y - 30, 18, '#2f2a3d', 3); A.txt(String(G.main), 222, y - 30, 18, COL.white, { lw: 0 }); }
  }
  function draw(){
    ctx = A.ctx();
    decor();
    G.betes.forEach(b => b.k === 'punaise' ? punaise(b) : mouche(b));
    G.fuites.forEach(f => mouche({ x: f.x, y: f.y, a: Math.atan2(f.vy, f.vx), t: f.t }));
    // les nuages qui puent
    G.nuages.forEach(n => { ctx.save(); ctx.globalAlpha = Math.max(0, .7 - n.t * .28); [[0, 0, 40], [30, -14, 30], [-28, -10, 32], [6, -34, 26]].forEach(([a, b, r]) => A.circle(n.x + a, n.y + b - n.t * 30, r + n.t * 20, '#9be06a', 0)); ctx.restore(); });
    // la trace du doigt
    G.traits.forEach(tr => { ctx.save(); ctx.globalAlpha = 1 - tr.t / .25; ln([[tr.x0, tr.y0], [tr.x1, tr.y1]], 10, 'rgba(255,255,255,.9)'); ctx.restore(); });
    main();
    if (G.coup && G.coup.n > 0){ for (let i = 0; i < Math.min(G.coup.n, 30); i++) ell(140 + (i * 37) % 80, 640 + (i * 13) % 50, 7, 3, '#2f2a3d', 0); }
    A.bigNum(String(G.phase === 'chasse' ? G.main : G.score), 196, 46, 50, { align: 'right' });
    A.txt('mouches', 206, 58, 22, COL.white, { lw: 6, align: 'left' });
    if (G.phase === 'chasse'){ const left = Math.max(0, 1 - G.play / DUREE); A.blob(30, 86, 300, 18, 9, '#fff', 4); if (left > 0){ A.rr(34, 90, 292 * left, 10, 5); ctx.fillStyle = left < .2 ? COL.red : COL.violet; ctx.fill(); } }
    if (G.count < 0){ const n = Math.ceil(-G.count / .4), fr = (-G.count % .4) / .4;
      ctx.save(); ctx.translate(180, 330); const s = .7 + fr * .6; ctx.scale(s, s); A.bigNum(String(n), 0, 0, 120); ctx.restore(); }
  }
  function down(p){
    if (G.count < 0 || G.end) return;
    G.trait = { x: p.x, y: p.y, t: performance.now(), x0: p.x, y0: p.y, t0: performance.now(), vmax: 0 };
  }
  function move(p){
    const tr = G.trait; if (!tr || G.end) return;
    const now = performance.now(), dt = Math.max(1, now - tr.t) / 1000;
    if (G.phase === 'chasse'){ attrape(tr.x, tr.y, p.x, p.y); G.traits.push({ x0: tr.x, y0: tr.y, x1: p.x, y1: p.y, t: 0 }); }
    else if (G.phase === 'ecrase'){ tr.vmax = Math.max(tr.vmax, (p.y - tr.y) / dt); }
    if (G.trait){ G.trait.x = p.x; G.trait.y = p.y; G.trait.t = now; }
  }
  function up(p){
    const tr = G.trait; G.trait = null;
    if (!tr || G.phase !== 'ecrase' || G.end) return;
    const tot = (performance.now() - tr.t0) / 1000, vmoy = (p.y - tr.y0) / Math.max(.03, tot);
    if (p.y - tr.y0 > 60) ecrase(Math.max(tr.vmax * .8, vmoy));
  }
  function vignette(c, x, y, w, h, t){
    ctx = c; const k = h / 230, save = G;
    G = { t, betes: [], fuites: [], nuages: [], traits: [], pue: 0, phase: 'chasse', main: 3 };
    c.save(); c.translate(x + w / 2, y + h); c.scale(k, k); c.translate(-150, -230);
    c.fillStyle = '#fff1d6'; c.fillRect(-200, -50, 700, 400);
    for (let i = 0; i < 5; i++){ const a = t * (1 + i * .2) + i * 1.3; mouche({ x: 150 + Math.cos(a) * (60 + i * 18), y: 100 + Math.sin(a * 1.3) * 50, a: a + 1.6, t: t + i }); }
    punaise({ x: 230, y: 160, a: t * .5, t });
    ln([[40, 200], [120, 120], [200, 90]], 9, 'rgba(255,255,255,.95)');
    c.restore(); G = save;
  }
  Bourdi.ajouter({
    id: 'mouches', titre: 'Les Mouches', court: 'Les Mouches',
    consigne: 'Glisse ton doigt sur les mouches pour les attraper, mais pas les punaises ! À la fin, un grand coup vers le bas pour les écraser.',
    bientot: true,                 // en pause (9 nov.) : seulement en mode TEST, « À venir » pour les autres
    plusPetitGagne: false,
    seuils: { S: 30, A: 24, B: 18, C: 12, D: 6 },
    format: n => Math.max(0, Math.round(n)) + ' mouches',
    musique: 'jeu', vignette,
    start(){ ctx = A.ctx(); nouvellePartie(); },
    update, draw, down, move, up, etat: () => G
  });
})();

<script>
'use strict';
// =====================================================================
//  ÉPREUVE 20 — PLANTER LES OLIVIERS   (EN TEST : textes provisoires)
//  Rythme : la musique est fabriquée ici, calée sur l'horloge du son.
//  Un rond se resserre sur le trou : taper quand il touche le bord.
//  Un olivier = 4 temps (pioche, pioche, poser, tasser). 12 oliviers,
//  la musique accélère ; les 4 derniers ont des pièges (silence où il ne
//  faut pas taper, contretemps).
//  Score = précision en %.
// =====================================================================
(() => {
  const COL = { ink: '#1d1530', white: '#fff', red: '#ff3b3b', orange: '#ff8a1f', yellow: '#ffd21f', sky: '#5ec8ff', blue: '#2f6bff', green: '#7ad81e', pink: '#ff4fa3', violet: '#8a3ffc' };
  const A = Bourdi.api; let ctx = A.ctx();
  const N = 12, PARFAIT = .07, BIEN = .14, FENETRE = .2;
  const PIEGES = [[0, 1, 3, 4, 5], [0, 1, 1.5, 3, 4], [0, .5, 2, 3, 4], [0, 1, 1.5, 3, 4]];   // offsets des 4 gestes + longueur (en temps)
  const PY = 470;                                                   // le trou à l'écran
  const now = () => (typeof actx !== 'undefined' && actx) ? actx.currentTime : performance.now() / 1000;

  function ln(pts, w, c){ ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.lineWidth = w; ctx.strokeStyle = c; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); }
  function ell(x, y, rx, ry, fill, lw = 3, rot = 0){ ctx.beginPath(); ctx.ellipse(x, y, Math.max(1, rx), Math.max(1, ry), rot, 0, Math.PI * 2); if (fill){ ctx.fillStyle = fill; ctx.fill(); } if (lw){ ctx.lineWidth = lw; ctx.strokeStyle = COL.ink; ctx.stroke(); } }

  // ---------- la partition : temps de musique et gestes à faire ----------
  function partition(){
    const beats = [], ev = []; let t = 0;
    const b92 = 60 / 92;
    for (let i = 0; i < 4; i++){ beats.push({ t, k: 'decompte', i }); t += b92; }          // 4 temps pour se caler
    for (let o = 0; o < N; o++){
      const bpm = 92 + o * 4, b = 60 / bpm, piege = o >= N - 4 ? PIEGES[o - (N - 4)] : null;
      const offs = piege ? piege.slice(0, 4) : [0, 1, 2, 3], len = piege ? piege[4] : 4;
      for (let i = 0; i < len; i++) beats.push({ t: t + i * b, k: offs.includes(i) ? 'geste' : 'silence', o, b });
      offs.forEach((d, g) => ev.push({ t: t + d * b, o, g, b, note: null, contre: d % 1 !== 0 }));
      // les contretemps : un petit bruit de castagnette sur le demi-temps quand un geste y tombe
      offs.forEach(d => { if (d % 1) beats.push({ t: t + d * b, k: 'contre', o, b }); });
      t += len * b;
    }
    beats.sort((a, c) => a.t - c.t);
    return { beats, ev, fin: t + .6 };
  }

  let G;
  function nouvellePartie(){
    const P = partition();
    G = { t: 0, count: -1.2, a0: null, play: 0, beats: P.beats, ev: P.ev, fin: P.fin, bi: 0, extra: 0, oliviers: Array.from({ length: N }, () => ({ notes: [], g: 0 })), cam: 0, end: 0, score: 0, flash: 0 };
  }

  // ---------- la musique (air joyeux : basse, mandoline, castagnettes) ----------
  const GAMME = [57, 60, 64, 62, 65, 64, 62, 60, 59, 62, 64, 69];
  const ROOTS = [45, 50, 52, 45];
  function joue(be, d){
    const o = be.o == null ? 0 : be.o, root = ROOTS[Math.floor(o / 3) % 4];
    if (be.k === 'decompte'){ A.tone(d, be.i === 3 ? 1320 : 880, .06, .07, 'square'); return; }
    if (be.k === 'contre'){ A.bruit(d, .04, .14, 'highpass', 5000, 1); return; }
    A.tone(d, 440 * Math.pow(2, (root - 12 - 69) / 12), be.b * .9, .16, 'triangle');                 // basse
    if (be.k === 'geste'){
      const m = GAMME[(o * 3 + Math.round(be.t * 7)) % GAMME.length];
      for (let i = 0; i < 3; i++) A.tone(d + i * .045, 440 * Math.pow(2, (m - 69) / 12), .05, .05, 'square');   // mandoline (trémolo)
    }
    A.bruit(d + be.b / 2, .03, .09, 'highpass', 6000, 1);                                           // castagnette sur le demi-temps
  }

  const snd = {
    count(go){ A.tone(0, go ? 1046 : 523, go ? .3 : .12, .08, 'square'); },
    geste(g, q){ if (g < 2){ A.bruit(0, .07, .3 * q + .1, 'lowpass', 700, 1); A.tone(0, 160, .06, .08, 'square', 90); } else if (g === 2) A.bruit(0, .12, .2, 'bandpass', 600, 1); else { A.tone(0, 90, .12, .2, 'sine', 50); } },
    rate(){ A.tone(0, 200, .15, .06, 'sawtooth', 140); }
  };

  function update(dt){
    G.t += dt; G.flash = Math.max(0, G.flash - dt * 4);
    if (G.count < 0){ G.count += dt; if (G.count >= 0){ G.count = 0; G.a0 = now() + .25; } return; }
    G.play = now() - G.a0;
    // programmer la musique un peu en avance, sur l'horloge du son
    while (G.bi < G.beats.length && G.beats[G.bi].t < G.play + .15){ const be = G.beats[G.bi++]; joue(be, Math.max(0, be.t - G.play)); }
    // gestes ratés (pas tapés à temps)
    G.ev.forEach(e => { if (e.note == null && G.play > e.t + FENETRE){ e.note = 0; noter(e); } });
    // la caméra suit l'olivier en cours
    const cur = G.ev.find(e => e.note == null), oc = cur ? cur.o : N - 1;
    G.cam += (oc * 130 - G.cam) * Math.min(1, dt * 6);
    if (G.end){ if (G.end > 0 && G.t - G.end > 2){ G.end = -1; A.fin({ score: G.score }); } return; }
    if (G.play > G.fin){
      const tot = G.ev.reduce((s, e) => s + e.note, 0);
      G.score = Math.max(0, Math.round((tot - G.extra * .5) / G.ev.length * 100));
      G.end = G.t; A.sons.bien();
    }
  }
  function noter(e){ const ol = G.oliviers[e.o]; ol.notes.push(e.note); ol.g = Math.max(ol.g, e.g + 1); }
  function down(){
    if (G.count < 0 || G.end || G.a0 == null) return;
    const t = now() - G.a0;
    let best = null, bd = 1e9;
    G.ev.forEach(e => { if (e.note == null){ const d = Math.abs(t - e.t); if (d < bd){ bd = d; best = e; } } });
    if (!best || bd > FENETRE){ G.extra++; snd.rate(); A.secousse(3, .1); return; }        // tapé dans le vide (ou dans un silence)
    best.note = bd <= PARFAIT ? 1 : bd <= BIEN ? .6 : .2;
    noter(best); snd.geste(best.g, best.note);
    if (best.note === 1){ G.flash = 1; if (best.g === 3) A.dire('Parfait !'); }
    A.particules(180, PY, best.note === 1 ? 10 : 4, { colors: ['#b8763a', '#8a5a22', '#d8b88a'], speed: 140 });
  }

  // ---------- Dessin ----------
  function olivier(x, y, k, q, t){
    // k : 0..1 taille ; q : qualité (1 = bien droit et vert, 0 = rabougri)
    const pen = (1 - q) * .35 * (Math.sin(x) > 0 ? 1 : -1);
    ctx.save(); ctx.translate(x, y); ctx.rotate(pen); ctx.scale(k, k);
    ln([[0, 0], [-4, -40], [4, -70]], 12, COL.ink); ln([[0, 0], [-4, -40], [4, -70]], 7, '#8a6a4a');
    const f = q > .7 ? '#7a9a4a' : q > .4 ? '#9aa45a' : '#b0a070';
    [[-22, -80, 22], [18, -84, 22], [0, -100, 24], [-30, -98, 16], [30, -102, 16]].forEach(([a, b, r]) => A.circle(a, b + Math.sin(t * 2 + a) * 1.5, r * (.6 + q * .4), f, 3));
    if (q > .7) [[-14, -86], [10, -96], [24, -80]].forEach(([a, b]) => ell(a, b, 3, 4.5, '#3a3a5a', 0));
    ctx.restore();
  }
  function draw(){
    ctx = A.ctx();
    const g = ctx.createLinearGradient(0, 0, 0, 420); g.addColorStop(0, '#ffcf7a'); g.addColorStop(1, '#ffe9c2');
    ctx.fillStyle = g; ctx.fillRect(-200, -100, 760, 520);
    A.circle(260, 200, 44, '#fff3a0', 4);
    ctx.fillStyle = '#c8a46a'; ctx.beginPath(); ctx.moveTo(-200, 400); ctx.quadraticCurveTo(180, 340, 560, 400); ctx.lineTo(560, 900); ctx.lineTo(-200, 900); ctx.fill();
    ctx.fillStyle = '#a8763a'; ctx.fillRect(-200, PY + 10, 760, 400); ln([[-200, PY + 10], [560, PY + 10]], 4, COL.ink);
    // la rangée d'oliviers
    const play = G.a0 == null ? -9 : now() - G.a0;
    for (let o = 0; o < N; o++){
      const x = 180 + o * 130 - G.cam; if (x < -80 || x > 440) continue;
      const ol = G.oliviers[o], q = ol.notes.length ? ol.notes.reduce((a, b) => a + b, 0) / ol.notes.length : 1;
      ell(x, PY + 12, 34, 9, ol.g >= 1 ? '#5a3a1a' : '#8a5a2a', 2.5);
      if (ol.g >= 3) olivier(x, PY + 12, ol.g >= 4 ? 1 : .8, q, G.t + o);
      if (ol.g >= 4) ell(x, PY + 14, 30, 6, '#7a4a1e', 2);
    }
    // le rond qui se resserre sur le prochain geste
    const e = G.ev.find(v => v.note == null);
    A.circle(180, PY, 30, null, 5, 'rgba(29,21,48,.5)');
    if (e && play > -1){
      const pre = e.b * 1.2, k = (e.t - play) / pre;
      if (k <= 1 && k > -.3){ const r = 30 + Math.max(0, k) * 90; ctx.save(); ctx.globalAlpha = Math.min(1, (1 - k) * 2); A.circle(180, PY, r, null, 6, e.contre ? COL.orange : COL.yellow); ctx.restore(); }
    }
    if (G.flash > 0){ ctx.save(); ctx.globalAlpha = G.flash; A.circle(180, PY, 34, null, 8, COL.green); ctx.restore(); }
    // le paysan et sa pioche
    const gx = 92, gy = PY + 10, coup = G.flash > .5 ? 1 : 0;
    ln([[gx, gy - 46], [gx - 6, gy]], 9, COL.ink); ln([[gx, gy - 46], [gx + 8, gy]], 9, COL.ink);
    A.blob(gx - 14, gy - 96, 28, 52, 10, '#2f6bff', 3); A.circle(gx + 2, gy - 112, 16, '#f2c294', 3);
    A.blob(gx - 16, gy - 132, 36, 10, 4, '#ffd21f', 3); A.blob(gx - 8, gy - 142, 20, 12, 5, '#ffd21f', 3);
    ctx.save(); ctx.translate(gx + 10, gy - 80); ctx.rotate(coup ? .9 : -.6);
    ln([[0, 0], [48, 0]], 6, '#8a5a22'); ln([[44, -14], [52, 14]], 7, '#6b707a'); ctx.restore();
    // HUD : précision en cours
    const notes = G.ev.filter(v => v.note != null), tot = notes.reduce((s, v) => s + v.note, 0);
    const pc = notes.length ? Math.max(0, Math.round((tot - G.extra * .5) / notes.length * 100)) : 100;
    A.bigNum(String(G.end ? G.score : pc), 196, 46, 50, { align: 'right' });
    A.txt('%', 206, 58, 22, COL.white, { lw: 6, align: 'left' });
    if (G.count < 0){ const n = Math.ceil(-G.count / .4), fr = (-G.count % .4) / .4;
      ctx.save(); ctx.translate(180, 300); const s = .7 + fr * .6; ctx.scale(s, s); A.bigNum(String(n), 0, 0, 120); ctx.restore(); }
  }
  function vignette(c, x, y, w, h, t){
    ctx = c; const k = h / 230;
    c.save(); c.translate(x + w / 2, y + h); c.scale(k, k); c.translate(-150, -230);
    c.fillStyle = '#ffe9c2'; c.fillRect(-200, -50, 700, 400); c.fillStyle = '#a8763a'; c.fillRect(-200, 190, 700, 100);
    olivier(70, 192, 1, 1, t); olivier(170, 192, 1, 1, t + 1);
    const r = 24 + ((1 - (t * 1.5) % 1)) * 50; A.circle(250, 186, 24, null, 4, 'rgba(29,21,48,.5)'); A.circle(250, 186, r, null, 5, COL.yellow);
