<script>
'use strict';
// =====================================================================
//  ÉPREUVE 4 — À TABLE !
//  Un groupe apparaît un court instant (attention aux chats : on ne les
//  compte pas). Puis on touche la table pour poser un objet par personne,
//  en tenant compte de ceux déjà posés. 5 manches, 5 objets.
// =====================================================================
(() => {
  const COL = { ink: '#1d1530', white: '#fff', red: '#ff3b3b', orange: '#ff8a1f', yellow: '#ffd21f', sky: '#5ec8ff', blue: '#2f6bff', green: '#7ad81e', pink: '#ff4fa3', violet: '#8a3ffc' };
  const A = Bourdi.api; let ctx = A.ctx();
  const { LOOKS, drawCat, ln, ell } = Bourdi.chats;
  const { drawPerson, makePerson } = Bourdi.persos;
  const pick = a => a[Math.floor(Math.random() * a.length)];

  // manche : objet, titre, nombre de personnes, temps d'affichage, objets déjà posés, chats
  const MANCHES = [
    { k: 'assiette', titre: 'Les assiettes !', un: 'une assiette', Un: 'Une assiette', n: [4, 5], vu: 1.6, deja: [0, 0], chats: [0, 0] },
    { k: 'chaise', titre: 'Les chaises !', un: 'une chaise', Un: 'Une chaise', n: [6, 8], vu: 1.45, deja: [2, 4], chats: [0, 1] },
    { k: 'verre', titre: 'Les verres !', un: 'un verre', Un: 'Un verre', n: [7, 9], vu: 1.3, deja: [0, 0], chats: [1, 1] },
    { k: 'fourchette', titre: 'Les fourchettes !', un: 'une fourchette', Un: 'Une fourchette', n: [9, 11], vu: 1.15, deja: [2, 3], chats: [1, 2] },
    { k: 'gateau', titre: 'Les parts de gâteau !', un: 'une part de gâteau', Un: 'Une part de gâteau', n: [11, 13], vu: 1.0, deja: [2, 4], chats: [1, 2] }
  ];
  const rnd = ([a, b]) => a + Math.floor(Math.random() * (b - a + 1));
  const P = { juste: 100, bonus: 50, presque: 30 };

  // ---------- Places autour de la table ----------
  const TX0 = 40, TX1 = 320, TY0 = 300, TY1 = 470;          // plateau (vu en légère perspective)
  const XS = [60, 100, 140, 180, 220, 260, 300];
  // ordre de remplissage : du centre vers les bords, en alternant les deux côtés
  const ORDER = [3, 2, 4, 1, 5, 0, 6];
  const ON_TABLE = [], CHAIRS = [];
  ORDER.forEach(i => { ON_TABLE.push([XS[i], 352]); ON_TABLE.push([XS[i], 440]); CHAIRS.push([XS[i], 330, 'back']); CHAIRS.push([XS[i], 612, 'front']); });
  ON_TABLE.push([20, 396], [340, 396]); CHAIRS.push([14, 470, 'front'], [346, 470, 'front']);

  // ---------- Les objets ----------
  const CHAIR_STYLES = ['tabouret', 'bureau', 'gaming', 'cassee', 'caisse', 'pouf', 'seau'];
  function drawChair(st, x, y, s = 1){
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    const wood = '#b8743a', dark = '#8a5222';
    if (st === 'normale' || st === 'cassee'){
      ln([[-14, -34], [-14, 0]], 6, COL.ink); ln([[14, -34], [14, st === 'cassee' ? -8 : 0]], 6, COL.ink);
      ln([[-14, -34], [-14, 0]], 3, dark); ln([[14, -34], [14, st === 'cassee' ? -8 : 0]], 3, dark);
      A.blob(-18, -88, 36, 46, 6, wood, 3); A.blob(-12, -82, 24, 8, 3, dark, 0);
      A.blob(-20, -42, 40, 10, 4, wood, 3);
      if (st === 'cassee'){ ln([[-12, -78], [10, -58]], 5, '#d9d9e6'); ln([[10, -78], [-12, -58]], 5, '#d9d9e6'); A.blob(8, -8, 12, 8, 2, '#c9c3d9', 2); }
    } else if (st === 'tabouret'){
      ln([[-12, -36], [-16, 0]], 6, COL.ink); ln([[12, -36], [16, 0]], 6, COL.ink); ln([[0, -36], [0, 0]], 6, COL.ink);
      ln([[-12, -36], [-16, 0]], 3, dark); ln([[12, -36], [16, 0]], 3, dark); ln([[0, -36], [0, 0]], 3, dark);
      ell(0, -38, 20, 7, COL.red);
    } else if (st === 'bureau'){
      ln([[0, -30], [0, -8]], 7, COL.ink); ln([[-18, -4], [18, -4]], 6, COL.ink);
      A.circle(-18, -2, 4, '#555', 2); A.circle(18, -2, 4, '#555', 2); A.circle(0, -2, 4, '#555', 2);
      A.blob(-16, -84, 32, 40, 12, '#2f2a3d', 3); A.blob(-20, -40, 40, 11, 5, '#2f2a3d', 3);
    } else if (st === 'gaming'){
      ln([[0, -30], [0, -8]], 7, COL.ink); ln([[-18, -4], [18, -4]], 6, COL.ink); A.circle(-18, -2, 4, '#555', 2); A.circle(18, -2, 4, '#555', 2);
      A.blob(-17, -104, 34, 64, 12, '#1d1530', 3); A.blob(-6, -100, 12, 56, 5, COL.red, 0);
      A.blob(-24, -70, 8, 30, 4, COL.red, 2); A.blob(16, -70, 8, 30, 4, COL.red, 2);
      A.blob(-22, -42, 44, 12, 5, '#1d1530', 3);
    } else if (st === 'caisse'){
      A.blob(-20, -40, 40, 40, 3, '#d8a066', 3); ln([[-20, -27], [20, -27]], 2.5, dark); ln([[-20, -14], [20, -14]], 2.5, dark); ln([[-20, -40], [20, 0]], 3, dark);
    } else if (st === 'pouf'){
      ell(0, -18, 22, 18, COL.pink); ell(0, -30, 18, 6, '#ff7fb8', 2); A.circle(0, -18, 3, COL.ink, 0);
    } else if (st === 'seau'){
      ctx.beginPath(); ctx.moveTo(-14, -38); ctx.lineTo(14, -38); ctx.lineTo(19, 0); ctx.lineTo(-19, 0); ctx.closePath(); ctx.fillStyle = COL.sky; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = COL.ink; ctx.stroke();
      ln([[-16, -16], [16, -16]], 2.5, '#2b8acb');
    }
    ctx.restore();
  }
  function drawThing(k, x, y, s = 1, style){
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    if (k === 'assiette' || k === 'gateau'){ ell(0, 0, 18, 7, '#fff'); ell(0, 0, 11, 4, '#f0ecf8', 2);
      if (k === 'gateau'){ ctx.beginPath(); ctx.moveTo(-10, -2); ctx.lineTo(10, -2); ctx.lineTo(8, -16); ctx.closePath(); ctx.fillStyle = '#7a4a2a'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = COL.ink; ctx.stroke();
        ln([[-8, -8], [9, -8]], 3, '#ff9ec7'); A.circle(8, -19, 3.5, COL.red, 2); } }
    else if (k === 'verre'){ ctx.beginPath(); ctx.moveTo(-8, -26); ctx.lineTo(8, -26); ctx.lineTo(6, 0); ctx.lineTo(-6, 0); ctx.closePath(); ctx.fillStyle = 'rgba(190,235,255,.9)'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = COL.ink; ctx.stroke();
      ctx.fillStyle = 'rgba(94,200,255,.8)'; ctx.fillRect(-6.5, -12, 13, 11); ln([[-4, -22], [-4, -6]], 2, '#fff'); }
    else if (k === 'fourchette'){ ctx.rotate(-.5); A.blob(-3, -8, 6, 24, 3, '#c9c3d9', 2.5); A.blob(-6, -24, 12, 16, 3, '#c9c3d9', 2.5); [-3, 0, 3].forEach(d => ln([[d, -30], [d, -22]], 2, COL.ink)); }
    else if (k === 'chaise') drawChair(style, 0, 0, 1);
    ctx.restore();
  }

  // ---------- Rideau ----------
  function drawCurtain(k){
    const w = 190 * (1 - k) + 22;
    [[-10, 1], [370, -1]].forEach(([x0, s]) => {
      const x = s > 0 ? x0 : x0 - w;
      ctx.fillStyle = '#d42a3a'; ctx.fillRect(x, -300, w, 1100);
      for (let i = 0; i < w; i += 22){ ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(x + i, -300, 8, 1100); }
      ctx.lineWidth = 5; ctx.strokeStyle = COL.ink; ctx.strokeRect(x, -300, w, 1100);
    });
    ctx.fillStyle = '#d42a3a'; ctx.fillRect(-20, 120, 400, 34); for (let x = -20; x < 380; x += 40) A.circle(x + 20, 154, 20, '#d42a3a', 4);
    ln([[-20, 152], [380, 152]], 4, COL.yellow);
  }

  // ---------- État ----------
  let G;
  function nouvelleManche(){
    const M = MANCHES[G.m - 1], n = rnd(M.n), deja = Math.min(n - 1, rnd(M.deja)), nc = rnd(M.chats);
    // le groupe : n personnes + nc chats, en 3 rangées (les plus loin sont plus petits)
    const crowd = [];
    for (let i = 0; i < n; i++) crowd.push({ p: makePerson(Math.random() < .12 ? 'bidou' : 'empty') });
    for (let i = 0; i < nc; i++) crowd.push({ cat: pick([LOOKS.brabus, LOOKS.prince, LOOKS.winkle, LOOKS.roux, LOOKS.noir]) });
    crowd.sort(() => Math.random() - .5);
    const rows = [[], [], []]; crowd.forEach((c, i) => rows[c.cat ? 2 : i % 3].push(c));
    rows.forEach((r, j) => { const y = [390, 480, 590][j], s = [.5, .58, .68][j], w = 320 / Math.max(1, r.length);
      r.forEach((c, i) => { c.x = 20 + w * (i + .5) + (Math.random() - .5) * w * .3; c.y = y + (Math.random() - .5) * 10; c.s = s; c.ph = Math.random() * 6; }); });
    G.M = M; G.n = n; G.deja = deja; G.placed = 0; G.crowd = rows.flat().sort((a, b) => a.y - b.y);
    G.styles = [];
    G.phase = 'annonce'; G.pt = 1.1; G.curtain = 0; G.placeT = 0; G.verdict = null;
    A.texte(M.titre, 180, 380, { size: 36, color: COL.yellow, dur: 1.1, vy: 0 });
  }
  function nouvellePartie(){ G = { t: 0, count: -1.2, score: 0, m: 1, end: 0 }; }
  const total = () => G.deja + G.placed;
  function styleOf(i){ return i < 5 ? 'normale' : CHAIR_STYLES[(i - 5) % CHAIR_STYLES.length]; }

  // ---------- Sons ----------
  const snd = {
    ding(n){ const f = G.M.k === 'chaise' ? 220 : G.M.k === 'verre' ? 1500 : 1100; A.tone(0, f + n * 20, .14, .07, G.M.k === 'chaise' ? 'square' : 'triangle'); if (G.M.k === 'chaise') A.bruit(0, .08, .15, 'lowpass', 600, 1); },
    retire(){ A.tone(0, 700, .1, .05, 'triangle', 350); },
    rideau(){ A.bruit(0, .4, .1, 'bandpass', 900, 1.5, 300); },
    count(go){ A.tone(0, go ? 1046 : 523, go ? .3 : .12, .08, 'square'); }
  };

  // ---------- Logique ----------
  function valider(){
    if (G.phase !== 'place') return;
    const d = total() - G.n, M = G.M; let pts = 0, txt, col;
    if (d === 0){ pts = P.juste + Math.round(P.bonus * Math.max(0, 1 - G.placeT / 6)); txt = 'Parfait !'; col = COL.green; A.sons.bien(); A.particules(180, 400, 30, { speed: 300 }); }
    else { if (Math.abs(d) === 1) pts = P.presque; txt = d < 0 ? 'Il manque ' + M.un + ' !' : M.Un + ' en trop !'; col = COL.red; A.sons.erreur(); A.secousse(6, .25); }
    G.score += pts;
    G.verdict = { txt, col, d, pts }; G.phase = 'verdict'; G.pt = 1.8;
  }
  function update(dt){
    G.t += dt;
    if (G.count < 0){ const b = Math.ceil(-G.count / .4); G.count += dt; const a = Math.ceil(-G.count / .4); if (a !== b) snd.count(a === 0); if (G.count >= 0){ G.count = 0; nouvelleManche(); } return; }
    G.pt -= dt;
    if (G.phase === 'annonce' && G.pt <= 0){ G.phase = 'open'; snd.rideau(); }
    else if (G.phase === 'open'){ G.curtain = Math.min(1, G.curtain + dt / .25); if (G.curtain >= 1){ G.phase = 'show'; G.pt = G.M.vu; } }
    else if (G.phase === 'show' && G.pt <= 0){ G.phase = 'close'; snd.rideau(); }
    else if (G.phase === 'close'){ G.curtain = Math.max(0, G.curtain - dt / .2); if (G.curtain <= 0){ G.phase = 'place'; G.placeT = 0; } }
    else if (G.phase === 'place') G.placeT += dt;
    else if (G.phase === 'verdict' && G.pt <= 0){
      if (G.m >= MANCHES.length){ G.phase = 'fin'; G.end = G.t; A.texte('Bon appétit !', 180, 380, { size: 40, color: COL.yellow, dur: 1.3, vy: 0 }); A.particules(180, 380, 40, { speed: 340 }); A.sons.bien(); }
      else { G.m++; nouvelleManche(); }
    }
    else if (G.phase === 'fin' && G.t - G.end > 1.2){ G.phase = 'done'; A.fin({ score: G.score }); }
  }

  // ---------- Dessin ----------
  function drawRoom(){
    ctx.fillStyle = '#ffe3a8'; ctx.fillRect(-200, -300, 760, 820);
    for (let x = -200; x < 560; x += 36){ ctx.fillStyle = '#ffd78a'; ctx.fillRect(x, -300, 14, 820); }
    // lustre
    ln([[180, 150], [180, 200]], 3, COL.ink); ctx.beginPath(); ctx.moveTo(150, 226); ctx.lineTo(210, 226); ctx.lineTo(194, 200); ctx.lineTo(166, 200); ctx.closePath(); ctx.fillStyle = COL.yellow; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = COL.ink; ctx.stroke();
    ctx.fillStyle = '#c98a5a'; ctx.fillRect(-200, 520, 760, 400); for (let y = 548; y < 760; y += 30) ln([[-200, y], [560, y]], 2, '#a86a3a');
    ln([[-200, 520], [560, 520]], 5, COL.ink);
  }
  function drawTable(){
    // pieds
    [[56, 470], [304, 470]].forEach(([x, y]) => { A.blob(x - 7, y, 14, 70, 3, '#7a4418', 3); });
    ctx.beginPath(); ctx.moveTo(TX0 + 20, TY0); ctx.lineTo(TX1 - 20, TY0); ctx.lineTo(TX1 + 10, TY1); ctx.lineTo(TX0 - 10, TY1); ctx.closePath();
    ctx.fillStyle = '#c8803e'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = COL.ink; ctx.lineJoin = 'round'; ctx.stroke();
    for (let i = 1; i < 5; i++){ const y = TY0 + (TY1 - TY0) * i / 5; ln([[TX0 + 20 - 30 * i / 5, y], [TX1 - 20 + 30 * i / 5, y]], 2, '#a8662c'); }
    A.blob(TX0 - 10, TY1, TX1 - TX0 + 20, 22, 4, '#9a5a24', 4);
  }
  function drawPlacing(){
    drawRoom();
    const M = G.M, chairs = M.k === 'chaise', n = total();
    const slots = chairs ? CHAIRS : ON_TABLE;
    const at = i => slots[Math.min(i, slots.length - 1)];
    // ordre de dessin : chaises du fond, table, objets, chaises de devant
    const items = []; for (let i = 0; i < n; i++){ const s = at(i); items.push({ i, x: s[0] + (i >= slots.length ? (i - slots.length + 1) * 6 : 0), y: s[1] - (i >= slots.length ? (i - slots.length + 1) * 6 : 0), side: s[2], pre: i < G.deja }); }
    const miss = G.verdict && G.verdict.d < 0;
    if (chairs) items.filter(o => o.side === 'back').forEach(o => drawChair(o.pre ? 'normale' : styleOf(o.i), o.x, o.y));
    drawTable();
    if (!chairs) items.forEach(o => drawThing(M.k, o.x, o.y, 1.15));
    if (chairs) items.filter(o => o.side !== 'back').forEach(o => drawChair(o.pre ? 'normale' : styleOf(o.i), o.x, o.y));
    // verdict : place vide qui clignote, ou objet en trop qui clignote
    if (G.verdict && G.verdict.d !== 0 && Math.sin(G.t * 14) > 0){
      if (miss) for (let i = n; i < n - G.verdict.d && i < slots.length; i++){ const s = at(i); A.circle(s[0], s[1] - (chairs ? 40 : 6), 16, null, 4, COL.red); A.txt('?', s[0], s[1] - (chairs ? 40 : 6), 20, COL.red, { lw: 4 }); }
      else for (let i = G.n; i < n; i++){ const s = at(i); A.circle(s[0], s[1] - (chairs ? 40 : 6), 20, null, 4, COL.red); }
    }
    // boutons
    if (G.phase === 'place'){
      const minus = (x, y) => { A.blob(x - 16, y - 5, 32, 10, 4, COL.white, 3); };
      btn('minus', 16, 630, 76, 66, COL.blue, minus);
      btn('ok', 104, 630, 240, 66, COL.green, (x, y) => A.txt('C\'est prêt !', x, y, 28, COL.white, { lw: 7 }));
    }
    if (G.verdict){
      A.blob(20, 640, 320, 66, 18, '#fff', 4);
      A.txt(G.verdict.txt, 180, 660, 22, G.verdict.col, { lw: 5, max: 300 });
      A.txt('Ils étaient ' + G.n, 180, 690, 18, COL.violet, { lw: 0 });
      if (G.verdict.pts) A.txt('+' + G.verdict.pts, 300, 250, 30, COL.green, { lw: 7 });
    }
  }
  let press = null;
  function btn(id, x, y, w, h, c, label){
    const down = press === id ? 4 : 0;
    A.rr(x, y + 6, w, h, 20); ctx.fillStyle = COL.ink; ctx.fill();
    A.blob(x, y + down, w, h, 20, c, 4);
    A.rr(x + 7, y + down + 5, w - 14, h * .3, 12); ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fill();
    label(x + w / 2, y + h / 2 + down);
  }
  function drawCrowd(){
    drawRoom();
    G.crowd.forEach(c => {
      const bob = Math.sin(G.t * 6 + c.ph) * 3;
      if (c.cat) drawCat(c.cat, c.x, c.y, c.s * 1.25, 'sit', G.t + c.ph, { dir: c.x > 180 ? -1 : 1 });
      else drawPerson(c.p, c.x, c.y + bob, c.s, G.t + c.ph, { expr: 'smile' });
    });
  }
  function draw(){
    ctx = A.ctx();
    if (G.count < 0 || !G.M){ drawRoom(); drawCurtain(0); }
    else if (G.phase === 'annonce'){ drawRoom(); drawCurtain(0); drawThing(G.M.k, 180, 470, 2.4, 'normale'); }
    else if (G.phase === 'open' || G.phase === 'show' || G.phase === 'close'){ drawCrowd(); drawCurtain(G.curtain); }
    else drawPlacing();
    // HUD
    A.bigNum(String(G.score), 168, 46, 50, { align: 'right' });
    A.txt('pts', 178, 58, 22, COL.white, { lw: 6, align: 'left' });
    A.txt('Manche ' + Math.min(G.m, MANCHES.length) + '/' + MANCHES.length, 150, 96, 20, COL.white, { lw: 6 });
    if (G.count < 0){ const n = Math.ceil(-G.count / .4), f = (-G.count % .4) / .4;
      ctx.save(); ctx.translate(180, 400); const s = .7 + f * .6; ctx.scale(s, s); A.bigNum(String(n), 0, 0, 120); ctx.restore(); }
  }

  // ---------- Toucher ----------
  function down(p){
    if (G.phase !== 'place') return;
    if (p.y > 625){
      if (p.x < 98) press = 'minus'; else press = 'ok';
      return;
    }
    if (p.y > 180){ G.placed++; snd.ding(total()); A.particules(p.x, p.y, 4, { speed: 120, size: 5, shape: 'star', colors: [COL.yellow, COL.white] }); }
  }
  function up(p){
    const id = press; press = null;
    if (!id || !p || G.phase !== 'place' || p.y < 625) return;
    if (id === 'minus' && p.x < 98){ if (G.placed > 0){ G.placed--; snd.retire(); } }
    else if (id === 'ok' && p.x >= 98) valider();
  }

  // ---------- Vignette ----------
  function vignette(c, x, y, w, h, t){
    ctx = c; const k = h / 230;
    c.save(); c.translate(x + w / 2, y + h); c.scale(k, k); c.translate(-150, -230);
    c.fillStyle = '#ffe3a8'; c.fillRect(-200, -50, 700, 400); for (let xx = -200; xx < 500; xx += 36){ c.fillStyle = '#ffd78a'; c.fillRect(xx, -50, 14, 400); }
    c.fillStyle = '#c98a5a'; c.fillRect(-200, 170, 700, 100);
    drawChair('gaming', 70, 120); drawChair('normale', 150, 120); drawChair('tabouret', 230, 120);
    ctx.beginPath(); ctx.moveTo(20, 110); ctx.lineTo(280, 110); ctx.lineTo(300, 190); ctx.lineTo(0, 190); ctx.closePath(); ctx.fillStyle = '#c8803e'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = COL.ink; ctx.stroke();
    [[60, 150], [150, 150], [240, 150]].forEach(([a, b], i) => drawThing(['assiette', 'gateau', 'assiette'][i], a, b, 1.4));
    drawThing('verre', 100 + Math.sin(t * 5) * 3, 140, 1.3); drawThing('fourchette', 200, 160, 1.3);
    c.restore();
  }

  Bourdi.ajouter({
    id: 'table', titre: 'À table !', court: 'À table !',
    consigne: 'Compte bien les invités, ils ne restent pas longtemps ! Ensuite, touche la table pour mettre un objet par personne. Attention : certains sont déjà là ! Puis appuie sur « C\'est prêt ! ».',
    plusPetitGagne: false,
    seuils: { S: 640, A: 560, B: 430, C: 300, D: 150 },
    format: n => Math.max(0, Math.round(n)) + ' pts',
    musique: 'jeu',
    vignette,
    start(){ ctx = A.ctx(); press = null; nouvellePartie(); },
    update, draw, down, up,
    etat: () => G
  });
})();

</script>
<script>
'use strict';
// =====================================================================
//  ÉPREUVE 5 — LA DOUCHE
//  L'eau change de température toute seule (et d'un coup quand quelqu'un
//  tire la chasse ou lance la machine). On fait glisser le robinet pour
//  rester dans la zone tiède. Score = temps passé dans le tiède (30 s).
// =====================================================================
(() => {
  const COL = { ink: '#1d1530', white: '#fff', red: '#ff3b3b', orange: '#ff8a1f', yellow: '#ffd21f', sky: '#5ec8ff', blue: '#2f6bff', green: '#7ad81e', pink: '#ff4fa3', violet: '#8a3ffc' };
  const A = Bourdi.api; let ctx = A.ctx();
  const { ln, ell } = Bourdi.chats;
  const DUREE = 30;
  const GX0 = 30, GX1 = 330, GY = 560;          // jauge de température
  const RY = 652;                               // rail du robinet

  let G;
  function nouvellePartie(){
    G = { t: 0, count: -1.2, play: 0, score: 0, T: .5, d: 0, k: 0, kx: 180, drag: null, next: 3 + Math.random() * 2, end: 0, steam: [], drops: [], face: 'ok', lastFace: 'ok', sayT: 0 };
  }
  const hw = () => .15 - .06 * Math.min(1, G.play / DUREE);          // la zone tiède rétrécit
  const zone = () => Math.abs(G.T - .5) < hw();

  // ---------- Sons ----------
  const snd = {
    count(go){ A.tone(0, go ? 1046 : 523, go ? .3 : .12, .08, 'square'); },
    chasse(){ A.bruit(0, 1.0, .14, 'bandpass', 2200, 1.2, 300); },
    machine(){ A.tone(0, 60, .9, .12, 'sawtooth', 80); A.bruit(0, .9, .06, 'lowpass', 300, 1); },
    brrr(){ for (let i = 0; i < 6; i++) A.tone(i * .05, 180, .04, .06, 'square'); },
    aie(){ A.tone(0, 700, .3, .08, 'sawtooth', 1100); },
    la(){ const n = [72, 76, 79, 76][Math.floor(Math.random() * 4)]; A.tone(0, 440 * Math.pow(2, (n - 69) / 12), .25, .04, 'triangle'); }
  };

  // ---------- Logique ----------
  function update(dt){
    G.t += dt;
    if (G.count < 0){ const b = Math.ceil(-G.count / .4); G.count += dt; const a = Math.ceil(-G.count / .4); if (a !== b) snd.count(a === 0); if (G.count >= 0) G.count = 0; return; }
    if (G.end){ if (G.t - G.end > 1.2 && G.end > 0){ G.end = -1; A.fin({ score: Math.round(G.score * 10) * 100 }); } return; }
    G.play += dt;
    // la chaudière n'en fait qu'à sa tête : dérive lente + coups de chaud / de froid
    const amp = .5 + .6 * Math.min(1, G.play / DUREE);
    G.d += (Math.random() - .5) * 1.6 * amp * dt * 2 - G.d * dt * .25;
    G.next -= dt;
    if (G.next <= 0){
      G.next = 2.6 + Math.random() * 2.4 - Math.min(1, G.play / DUREE) * 1;
      if (Math.random() < .5){ G.d += .28; A.texte('Quelqu\'un tire la chasse !', 180, 150, { size: 22, color: COL.orange, dur: 1.4 }); snd.chasse(); }
      else { G.d -= .28; A.texte('La machine à laver démarre !', 180, 150, { size: 22, color: COL.sky, dur: 1.4 }); snd.machine(); }
      A.secousse(4, .25);
    }
    G.d = Math.max(-.55, Math.min(.55, G.d));
    const target = Math.max(0, Math.min(1, .5 + G.d + G.k));
    G.T += (target - G.T) * Math.min(1, dt * 4);                     // l'eau met un peu de temps à changer
    if (zone()) G.score += dt;
    // visage et petites phrases
    G.face = G.T < .5 - hw() - .12 ? 'froid' : G.T > .5 + hw() + .12 ? 'chaud' : zone() ? 'ok' : (G.T < .5 ? 'frais' : 'tiede');
    G.sayT -= dt;
    if (G.face !== G.lastFace && G.sayT <= 0){
      if (G.face === 'froid'){ A.texte('Brrr !', 250, 330, { size: 30, color: COL.sky, dur: .8 }); snd.brrr(); G.sayT = 1; }
      if (G.face === 'chaud'){ A.texte('AÏE !', 250, 330, { size: 34, color: COL.red, dur: .8 }); snd.aie(); A.secousse(5, .2); G.sayT = 1; }
    }
    if (G.face === 'ok' && Math.random() < dt * 1.5) snd.la();
    G.lastFace = G.face;
    // gouttes et vapeur
    for (let i = 0; i < 3; i++) G.drops.push({ x: 140 + Math.random() * 80, y: 230, vy: 300 + Math.random() * 200 });
    G.drops.forEach(d => { d.y += d.vy * dt; }); G.drops = G.drops.filter(d => d.y < 520);
    if (G.T > .65 && Math.random() < dt * 12) G.steam.push({ x: 120 + Math.random() * 120, y: 470, t: 0 });
    G.steam.forEach(s => { s.t += dt; s.y -= 40 * dt; }); G.steam = G.steam.filter(s => s.t < 1.5);
    if (G.play >= DUREE){ G.end = G.t; A.texte('Tout propre !', 180, 300, { size: 40, color: COL.yellow, dur: 1.3, vy: 0 }); A.sons.bien(); A.particules(180, 300, 40, { speed: 340 }); }
  }

  // ---------- Dessin ----------
  const lerpC = (a, b, k) => { const pa = a.match(/\w\w/g).map(h => parseInt(h, 16)), pb = b.match(/\w\w/g).map(h => parseInt(h, 16)); return 'rgb(' + pa.map((v, i) => Math.round(v + (pb[i] - v) * k)).join(',') + ')'; };
  function drawGuy(){
    const f = G.face, cold = f === 'froid' || f === 'frais', hot = f === 'chaud' || f === 'tiede';
    const k = Math.max(0, Math.min(1, (G.T - .5) * 2.2));                  // -1 froid … +1 chaud
    const skin = G.T < .5 ? lerpC('ffd9b8', 'a8d4ff', Math.min(1, (.5 - G.T) * 2.4)) : lerpC('ffd9b8', 'ff6a5a', Math.min(1, (G.T - .5) * 2.4));
    const shiver = f === 'froid' ? Math.sin(G.t * 60) * 3 : 0;
    ctx.save(); ctx.translate(180 + shiver, 0);
    // épaules + tête
    A.blob(-70, 400, 140, 120, 50, skin, 4);
    A.circle(0, 350, 50, skin, 4);
    // bonnet de douche
    ctx.beginPath(); ctx.arc(0, 340, 52, Math.PI * 1.05, Math.PI * 1.95); ctx.closePath(); ctx.fillStyle = COL.yellow; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = COL.ink; ctx.stroke();
    for (let i = -40; i <= 40; i += 16) A.circle(i, 316 + Math.abs(i) * .25, 4, '#fff', 0);
    // visage
    if (f === 'ok'){ [-18, 18].forEach(e => { ctx.beginPath(); ctx.arc(e, 352, 8, Math.PI * 1.1, Math.PI * 1.9); ctx.lineWidth = 3.5; ctx.strokeStyle = COL.ink; ctx.stroke(); });
      ell(0, 378, 10, 7, '#7a1f3d', 3); ell(-30, 368, 8, 5, '#ff9ab0', 0); ell(30, 368, 8, 5, '#ff9ab0', 0);
      A.txt('♪', 70 + Math.sin(G.t * 3) * 6, 290 - (G.t * 30 % 40), 26, COL.violet, { lw: 4 }); }
    else if (cold){ [-18, 18].forEach(e => { ell(e, 350, 9, 11, '#fff', 3); ell(e, 352, 3, 3, COL.ink, 0); });
      A.blob(-18, 372, 36, 14, 4, '#fff', 3); for (let i = -12; i <= 12; i += 8) ln([[i, 372], [i, 386]], 2, COL.ink);
      if (f === 'froid'){ [[-36, 392], [32, 394]].forEach(([x, y]) => { ctx.beginPath(); ctx.moveTo(x - 5, y); ctx.lineTo(x + 5, y); ctx.lineTo(x, y + 18); ctx.closePath(); ctx.fillStyle = '#d6f2ff'; ctx.fill(); ctx.lineWidth = 2; ctx.stroke(); }); } }
    else { [-18, 18].forEach(e => { ell(e, 350, 10, 12, '#fff', 3); ell(e, 352, 2.5, 2.5, COL.ink, 0); }); ell(0, 384, 14, 16, '#7a1f3d', 3);
      if (f === 'chaud') [[-50, 320], [52, 330]].forEach(([x, y]) => { ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 8, y + 10, x, y + 18); ctx.quadraticCurveTo(x - 8, y + 10, x, y); ctx.fillStyle = '#9fe3ff'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = COL.ink; ctx.stroke(); }); }
    ctx.restore();
  }
  function draw(){
    ctx = A.ctx();
    // salle de bain : carrelage
    ctx.fillStyle = '#dff4ff'; ctx.fillRect(-200, -300, 760, 1100);
    for (let y = -300; y < 800; y += 34) for (let x = -200; x < 560; x += 34){ ctx.strokeStyle = '#b8e2f8'; ctx.lineWidth = 2; ctx.strokeRect(x, y, 34, 34); }
    // pommeau + tuyau
    ln([[300, 120], [300, 190], [220, 190]], 10, COL.ink); ln([[300, 120], [300, 190], [220, 190]], 5, '#c9c3d9');
    ctx.beginPath(); ctx.moveTo(150, 200); ctx.lineTo(210, 200); ctx.lineTo(222, 182); ctx.lineTo(138, 182); ctx.closePath(); ctx.fillStyle = '#c9c3d9'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = COL.ink; ctx.stroke();
    // eau
    const wc = G.T < .5 ? lerpC('9fe3ff', '2f6bff', Math.min(1, (.5 - G.T) * 2)) : lerpC('9fe3ff', 'ff8a6a', Math.min(1, (G.T - .5) * 2));
    G.drops.forEach(d => { ln([[d.x, d.y], [d.x, d.y + 12]], 3, wc); });
    drawGuy();
    G.steam.forEach(s => { ctx.save(); ctx.globalAlpha = .5 * (1 - s.t / 1.5); A.circle(s.x + Math.sin(s.t * 4) * 8, s.y, 14 + s.t * 10, '#fff', 0); ctx.restore(); });
    // rideau de douche (le bas du corps est caché, on reste correct !)
    ctx.fillStyle = '#ff7fb8'; ctx.beginPath(); ctx.moveTo(-200, 470);
    for (let x = -200; x <= 560; x += 30) ctx.quadraticCurveTo(x + 15, 462, x + 30, 470);
    ctx.lineTo(560, 540); ctx.lineTo(-200, 540); ctx.closePath(); ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = COL.ink; ctx.stroke();
    for (let x = -190; x < 560; x += 30) ln([[x, 474], [x + 6, 536]], 3, '#ff4fa3');
    for (let x = 0; x < 360; x += 60) A.circle(x + 20, 505, 6, '#fff', 0);
    // jauge de température
    ctx.fillStyle = '#1d1530'; ctx.fillRect(-200, 540, 760, 400);
    const g = ctx.createLinearGradient(GX0, 0, GX1, 0); g.addColorStop(0, COL.blue); g.addColorStop(.5, '#f6f3ec'); g.addColorStop(1, COL.red);
    A.rr(GX0, GY, GX1 - GX0, 34, 17); ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke();
    const zx0 = GX0 + (GX1 - GX0) * (.5 - hw()), zx1 = GX0 + (GX1 - GX0) * (.5 + hw());
    A.rr(zx0, GY - 4, zx1 - zx0, 42, 10); ctx.fillStyle = zone() ? 'rgba(122,216,30,.75)' : 'rgba(122,216,30,.45)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = COL.green; ctx.stroke();
    A.txt('❄', GX0 - 2, GY + 17, 20, COL.sky, { lw: 0 }); A.txt('🔥', GX1 + 2, GY + 17, 18, COL.red, { lw: 0 });
    const nx = GX0 + (GX1 - GX0) * G.T;
    ctx.beginPath(); ctx.moveTo(nx, GY + 40); ctx.lineTo(nx - 12, GY + 58); ctx.lineTo(nx + 12, GY + 58); ctx.closePath(); ctx.fillStyle = COL.yellow; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
    ln([[nx, GY - 8], [nx, GY + 42]], 4, '#fff');
    // rail + robinet (à faire glisser)
    A.rr(GX0, RY - 5, GX1 - GX0, 10, 5); ctx.fillStyle = '#4a4060'; ctx.fill();
    const rx = G.kx, held = G.drag != null;
    ctx.save(); ctx.translate(rx, RY); ctx.rotate((rx - 180) / 150 * 1.2);
    A.circle(0, 0, held ? 30 : 27, '#d9d9e6', 4, '#fff');
    for (let i = 0; i < 4; i++){ ctx.rotate(Math.PI / 2); A.blob(-7, -40, 14, 22, 6, '#d9d9e6', 3, '#fff'); }
    A.circle(0, 0, 11, (rx < 180 ? COL.blue : COL.red), 3, '#fff');
    ctx.restore();
    // HUD
    A.bigNum((Math.floor(G.score * 10) / 10).toFixed(1).replace('.', ','), 196, 46, 50, { align: 'right' });
    A.txt('s', 206, 58, 22, COL.white, { lw: 6, align: 'left' });
    const left = Math.max(0, 1 - G.play / DUREE);
    A.blob(30, 86, 300, 18, 9, '#fff', 4); if (left > 0){ A.rr(34, 90, 292 * left, 10, 5); ctx.fillStyle = left < .2 ? COL.red : COL.violet; ctx.fill(); }
    if (G.count < 0){ const n = Math.ceil(-G.count / .4), f = (-G.count % .4) / .4;
      ctx.save(); ctx.translate(180, 300); const s = .7 + f * .6; ctx.scale(s, s); A.bigNum(String(n), 0, 0, 120); ctx.restore(); }
  }

  // ---------- Toucher : on fait glisser le robinet ----------
  function setK(x){ G.kx = Math.max(GX0, Math.min(GX1, x)); G.k = (G.kx - 180) / 150 * .55; }
  function down(p, id){ if (p.y > 530){ G.drag = id; setK(p.x); } }
  function move(p, id){ if (G.drag === id) setK(p.x); }
  function up(p, id){ if (id === 'all' || G.drag === id) G.drag = null; }

  // ---------- Vignette ----------
  function vignette(c, x, y, w, h, t){
    ctx = c; const k = h / 230;
    c.save(); c.translate(x + w / 2, y + h); c.scale(k, k); c.translate(-150, -230);
    c.fillStyle = '#dff4ff'; c.fillRect(-200, -50, 700, 400);
    c.beginPath(); c.moveTo(110, 30); c.lineTo(190, 30); c.lineTo(200, 12); c.lineTo(100, 12); c.closePath(); c.fillStyle = '#c9c3d9'; c.fill(); c.lineWidth = 4; c.strokeStyle = COL.ink; c.stroke();
    for (let i = 0; i < 9; i++){ const yy = 40 + ((t * 200 + i * 37) % 80); ln([[110 + i * 10, yy], [110 + i * 10, yy + 10]], 3, '#5ec8ff'); }
    const hot = Math.sin(t * 1.5) > 0;
    A.circle(150, 150, 44, hot ? '#ff6a5a' : '#a8d4ff', 4);
    c.beginPath(); c.arc(150, 142, 46, Math.PI * 1.05, Math.PI * 1.95); c.closePath(); c.fillStyle = COL.yellow; c.fill(); c.lineWidth = 4; c.stroke();
    [-16, 16].forEach(e => { ell(150 + e, 150, 8, 10, '#fff', 3); ell(150 + e, 152, 2.5, 2.5, COL.ink, 0); }); ell(150, 176, 10, 12, '#7a1f3d', 3);
    c.fillStyle = '#ff7fb8'; c.fillRect(-200, 196, 700, 60); ln([[-200, 196], [500, 196]], 4, COL.ink);
    A.txt(hot ? 'AÏE !' : 'Brrr !', 250, 90, 30, hot ? COL.red : COL.sky, { lw: 7 });
    c.restore();
  }

  Bourdi.ajouter({
    id: 'douche', titre: 'La Douche', court: 'La Douche',
    consigne: 'L\'eau change de température sans prévenir ! Fais glisser le robinet à gauche ou à droite pour garder l\'eau tiède le plus longtemps possible.',
    plusPetitGagne: false,
    seuils: { S: 23000, A: 20000, B: 16500, C: 13000, D: 9000 },
    format: ms => (Math.max(0, ms) / 1000).toFixed(1).replace('.', ',') + ' s',
    musique: 'jeu',
    vignette,
    start(){ ctx = A.ctx(); nouvellePartie(); },
    update, draw, down, move, up,
    etat: () => G
  });
})();

</script>
