<script>
'use strict';
// =====================================================================
//  ÉPREUVE 5 — LA DOUCHE
//  L'eau change de température toute seule (et d'un coup quand quelqu'un
//  tire la chasse ou lance la machine). On fait glisser le robinet pour
//  rester dans la zone tiède. Score = temps passé dans le tiède (30 s).
// =====================================================================
(() => {
  const COL = { ink: '#1d1530', white: '#fff', red: '#ff3b3b', orange: '#ff8a1f', yellow: '#ffd21f', sky: '#5ec8ff', blue: '#2f6bff', green: '#7ad81e', pink: '#ff4fa3', violet: '#8a3ffc' };
  const A = Bourdi.api; let ctx = A.ctx();
  const { ln, ell } = Bourdi.chats;
  const DUREE = 30;
  const GX0 = 30, GX1 = 330, GY = 560;          // jauge de température
  const RY = 652;                               // rail du robinet

  let G;
  function nouvellePartie(){
    G = { t: 0, count: -1.2, play: 0, score: 0, T: .5, d: 0, k: 0, kx: 180, drag: null, next: 3 + Math.random() * 2, end: 0, steam: [], drops: [], face: 'ok', lastFace: 'ok', sayT: 0 };
  }
  const hw = () => .15 - .06 * Math.min(1, G.play / DUREE);          // la zone tiède rétrécit
  const zone = () => Math.abs(G.T - .5) < hw();

  // ---------- Sons ----------
  const snd = {
    count(go){ A.tone(0, go ? 1046 : 523, go ? .3 : .12, .08, 'square'); },
    chasse(){ A.bruit(0, 1.0, .14, 'bandpass', 2200, 1.2, 300); },
    machine(){ A.tone(0, 60, .9, .12, 'sawtooth', 80); A.bruit(0, .9, .06, 'lowpass', 300, 1); },
    brrr(){ for (let i = 0; i < 6; i++) A.tone(i * .05, 180, .04, .06, 'square'); },
    aie(){ A.tone(0, 700, .3, .08, 'sawtooth', 1100); },
    la(){ const n = [72, 76, 79, 76][Math.floor(Math.random() * 4)]; A.tone(0, 440 * Math.pow(2, (n - 69) / 12), .25, .04, 'triangle'); }
  };

  // ---------- Logique ----------
  function update(dt){
    G.t += dt;
    if (G.count < 0){ const b = Math.ceil(-G.count / .4); G.count += dt; const a = Math.ceil(-G.count / .4); if (a !== b) snd.count(a === 0); if (G.count >= 0) G.count = 0; return; }
    if (G.end){ if (G.t - G.end > 1.2 && G.end > 0){ G.end = -1; A.fin({ score: Math.round(G.score * 10) * 100 }); } return; }
    G.play += dt;
    // la chaudière n'en fait qu'à sa tête : dérive lente + coups de chaud / de froid
    const amp = .5 + .6 * Math.min(1, G.play / DUREE);
    G.d += (Math.random() - .5) * 1.6 * amp * dt * 2 - G.d * dt * .25;
    G.next -= dt;
    if (G.next <= 0){
      G.next = 2.6 + Math.random() * 2.4 - Math.min(1, G.play / DUREE) * 1;
      if (Math.random() < .5){ G.d += .28; A.texte('Quelqu\'un tire la chasse !', 180, 150, { size: 22, color: COL.orange, dur: 1.4 }); snd.chasse(); }
      else { G.d -= .28; A.texte('La machine à laver démarre !', 180, 150, { size: 22, color: COL.sky, dur: 1.4 }); snd.machine(); }
      A.secousse(4, .25);
    }
    G.d = Math.max(-.55, Math.min(.55, G.d));
    const target = Math.max(0, Math.min(1, .5 + G.d + G.k));
    G.T += (target - G.T) * Math.min(1, dt * 4);                     // l'eau met un peu de temps à changer
    if (zone()) G.score += dt;
    // visage et petites phrases
    G.face = G.T < .5 - hw() - .12 ? 'froid' : G.T > .5 + hw() + .12 ? 'chaud' : zone() ? 'ok' : (G.T < .5 ? 'frais' : 'tiede');
    G.sayT -= dt;
    if (G.face !== G.lastFace && G.sayT <= 0){
      if (G.face === 'froid'){ A.texte('Brrr !', 250, 330, { size: 30, color: COL.sky, dur: .8 }); snd.brrr(); G.sayT = 1; }
      if (G.face === 'chaud'){ A.texte('AÏE !', 250, 330, { size: 34, color: COL.red, dur: .8 }); snd.aie(); A.secousse(5, .2); G.sayT = 1; }
    }
    if (G.face === 'ok' && Math.random() < dt * 1.5) snd.la();
    G.lastFace = G.face;
    // gouttes et vapeur
    for (let i = 0; i < 3; i++) G.drops.push({ x: 140 + Math.random() * 80, y: 230, vy: 300 + Math.random() * 200 });
    G.drops.forEach(d => { d.y += d.vy * dt; }); G.drops = G.drops.filter(d => d.y < 520);
    if (G.T > .65 && Math.random() < dt * 12) G.steam.push({ x: 120 + Math.random() * 120, y: 470, t: 0 });
    G.steam.forEach(s => { s.t += dt; s.y -= 40 * dt; }); G.steam = G.steam.filter(s => s.t < 1.5);
    if (G.play >= DUREE){ G.end = G.t; A.texte('Tout propre !', 180, 300, { size: 40, color: COL.yellow, dur: 1.3, vy: 0 }); A.sons.bien(); A.particules(180, 300, 40, { speed: 340 }); }
  }

  // ---------- Dessin ----------
  const lerpC = (a, b, k) => { const pa = a.match(/\w\w/g).map(h => parseInt(h, 16)), pb = b.match(/\w\w/g).map(h => parseInt(h, 16)); return 'rgb(' + pa.map((v, i) => Math.round(v + (pb[i] - v) * k)).join(',') + ')'; };
  function drawGuy(){
    const f = G.face, cold = f === 'froid' || f === 'frais', hot = f === 'chaud' || f === 'tiede';
    const k = Math.max(0, Math.min(1, (G.T - .5) * 2.2));                  // -1 froid … +1 chaud
    const skin = G.T < .5 ? lerpC('ffd9b8', 'a8d4ff', Math.min(1, (.5 - G.T) * 2.4)) : lerpC('ffd9b8', 'ff6a5a', Math.min(1, (G.T - .5) * 2.4));
    const shiver = f === 'froid' ? Math.sin(G.t * 60) * 3 : 0;
    ctx.save(); ctx.translate(180 + shiver, 0);
    // épaules + tête
    A.blob(-70, 400, 140, 120, 50, skin, 4);
    A.circle(0, 350, 50, skin, 4);
    // bonnet de douche
    ctx.beginPath(); ctx.arc(0, 340, 52, Math.PI * 1.05, Math.PI * 1.95); ctx.closePath(); ctx.fillStyle = COL.yellow; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = COL.ink; ctx.stroke();
    for (let i = -40; i <= 40; i += 16) A.circle(i, 316 + Math.abs(i) * .25, 4, '#fff', 0);
    // visage
    if (f === 'ok'){ [-18, 18].forEach(e => { ctx.beginPath(); ctx.arc(e, 352, 8, Math.PI * 1.1, Math.PI * 1.9); ctx.lineWidth = 3.5; ctx.strokeStyle = COL.ink; ctx.stroke(); });
      ell(0, 378, 10, 7, '#7a1f3d', 3); ell(-30, 368, 8, 5, '#ff9ab0', 0); ell(30, 368, 8, 5, '#ff9ab0', 0);
      A.txt('♪', 70 + Math.sin(G.t * 3) * 6, 290 - (G.t * 30 % 40), 26, COL.violet, { lw: 4 }); }
    else if (cold){ [-18, 18].forEach(e => { ell(e, 350, 9, 11, '#fff', 3); ell(e, 352, 3, 3, COL.ink, 0); });
      A.blob(-18, 372, 36, 14, 4, '#fff', 3); for (let i = -12; i <= 12; i += 8) ln([[i, 372], [i, 386]], 2, COL.ink);
      if (f === 'froid'){ [[-36, 392], [32, 394]].forEach(([x, y]) => { ctx.beginPath(); ctx.moveTo(x - 5, y); ctx.lineTo(x + 5, y); ctx.lineTo(x, y + 18); ctx.closePath(); ctx.fillStyle = '#d6f2ff'; ctx.fill(); ctx.lineWidth = 2; ctx.stroke(); }); } }
    else { [-18, 18].forEach(e => { ell(e, 350, 10, 12, '#fff', 3); ell(e, 352, 2.5, 2.5, COL.ink, 0); }); ell(0, 384, 14, 16, '#7a1f3d', 3);
      if (f === 'chaud') [[-50, 320], [52, 330]].forEach(([x, y]) => { ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 8, y + 10, x, y + 18); ctx.quadraticCurveTo(x - 8, y + 10, x, y); ctx.fillStyle = '#9fe3ff'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = COL.ink; ctx.stroke(); }); }
    ctx.restore();
  }
  function draw(){
    ctx = A.ctx();
    // salle de bain : carrelage
    ctx.fillStyle = '#dff4ff'; ctx.fillRect(-200, -300, 760, 1100);
    for (let y = -300; y < 800; y += 34) for (let x = -200; x < 560; x += 34){ ctx.strokeStyle = '#b8e2f8'; ctx.lineWidth = 2; ctx.strokeRect(x, y, 34, 34); }
    // pommeau + tuyau
    ln([[300, 120], [300, 190], [220, 190]], 10, COL.ink); ln([[300, 120], [300, 190], [220, 190]], 5, '#c9c3d9');
    ctx.beginPath(); ctx.moveTo(150, 200); ctx.lineTo(210, 200); ctx.lineTo(222, 182); ctx.lineTo(138, 182); ctx.closePath(); ctx.fillStyle = '#c9c3d9'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = COL.ink; ctx.stroke();
    // eau
    const wc = G.T < .5 ? lerpC('9fe3ff', '2f6bff', Math.min(1, (.5 - G.T) * 2)) : lerpC('9fe3ff', 'ff8a6a', Math.min(1, (G.T - .5) * 2));
    G.drops.forEach(d => { ln([[d.x, d.y], [d.x, d.y + 12]], 3, wc); });
    drawGuy();
    G.steam.forEach(s => { ctx.save(); ctx.globalAlpha = .5 * (1 - s.t / 1.5); A.circle(s.x + Math.sin(s.t * 4) * 8, s.y, 14 + s.t * 10, '#fff', 0); ctx.restore(); });
    // rideau de douche (le bas du corps est caché, on reste correct !)
    ctx.fillStyle = '#ff7fb8'; ctx.beginPath(); ctx.moveTo(-200, 470);
    for (let x = -200; x <= 560; x += 30) ctx.quadraticCurveTo(x + 15, 462, x + 30, 470);
    ctx.lineTo(560, 540); ctx.lineTo(-200, 540); ctx.closePath(); ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = COL.ink; ctx.stroke();
    for (let x = -190; x < 560; x += 30) ln([[x, 474], [x + 6, 536]], 3, '#ff4fa3');
    for (let x = 0; x < 360; x += 60) A.circle(x + 20, 505, 6, '#fff', 0);
    // jauge de température
    ctx.fillStyle = '#1d1530'; ctx.fillRect(-200, 540, 760, 400);
    const g = ctx.createLinearGradient(GX0, 0, GX1, 0); g.addColorStop(0, COL.blue); g.addColorStop(.5, '#f6f3ec'); g.addColorStop(1, COL.red);
    A.rr(GX0, GY, GX1 - GX0, 34, 17); ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke();
    const zx0 = GX0 + (GX1 - GX0) * (.5 - hw()), zx1 = GX0 + (GX1 - GX0) * (.5 + hw());
    A.rr(zx0, GY - 4, zx1 - zx0, 42, 10); ctx.fillStyle = zone() ? 'rgba(122,216,30,.75)' : 'rgba(122,216,30,.45)'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = COL.green; ctx.stroke();
    A.txt('❄', GX0 - 2, GY + 17, 20, COL.sky, { lw: 0 }); A.txt('🔥', GX1 + 2, GY + 17, 18, COL.red, { lw: 0 });
    const nx = GX0 + (GX1 - GX0) * G.T;
    ctx.beginPath(); ctx.moveTo(nx, GY + 40); ctx.lineTo(nx - 12, GY + 58); ctx.lineTo(nx + 12, GY + 58); ctx.closePath(); ctx.fillStyle = COL.yellow; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
    ln([[nx, GY - 8], [nx, GY + 42]], 4, '#fff');
    // rail + robinet (à faire glisser)
    A.rr(GX0, RY - 5, GX1 - GX0, 10, 5); ctx.fillStyle = '#4a4060'; ctx.fill();
    const rx = G.kx, held = G.drag != null;
    ctx.save(); ctx.translate(rx, RY); ctx.rotate((rx - 180) / 150 * 1.2);
    A.circle(0, 0, held ? 30 : 27, '#d9d9e6', 4, '#fff');
    for (let i = 0; i < 4; i++){ ctx.rotate(Math.PI / 2); A.blob(-7, -40, 14, 22, 6, '#d9d9e6', 3, '#fff'); }
    A.circle(0, 0, 11, (rx < 180 ? COL.blue : COL.red), 3, '#fff');
    ctx.restore();
    // HUD
    A.bigNum((Math.floor(G.score * 10) / 10).toFixed(1).replace('.', ','), 196, 46, 50, { align: 'right' });
    A.txt('s', 206, 58, 22, COL.white, { lw: 6, align: 'left' });
    const left = Math.max(0, 1 - G.play / DUREE);
    A.blob(30, 86, 300, 18, 9, '#fff', 4); if (left > 0){ A.rr(34, 90, 292 * left, 10, 5); ctx.fillStyle = left < .2 ? COL.red : COL.violet; ctx.fill(); }
    if (G.count < 0){ const n = Math.ceil(-G.count / .4), f = (-G.count % .4) / .4;
      ctx.save(); ctx.translate(180, 300); const s = .7 + f * .6; ctx.scale(s, s); A.bigNum(String(n), 0, 0, 120); ctx.restore(); }
  }

  // ---------- Toucher : on fait glisser le robinet ----------
  function setK(x){ G.kx = Math.max(GX0, Math.min(GX1, x)); G.k = (G.kx - 180) / 150 * .55; }
  function down(p, id){ if (p.y > 530){ G.drag = id; setK(p.x); } }
  function move(p, id){ if (G.drag === id) setK(p.x); }
  function up(p, id){ if (id === 'all' || G.drag === id) G.drag = null; }

  // ---------- Vignette ----------
  function vignette(c, x, y, w, h, t){
    ctx = c; const k = h / 230;
    c.save(); c.translate(x + w / 2, y + h); c.scale(k, k); c.translate(-150, -230);
    c.fillStyle = '#dff4ff'; c.fillRect(-200, -50, 700, 400);
    c.beginPath(); c.moveTo(110, 30); c.lineTo(190, 30); c.lineTo(200, 12); c.lineTo(100, 12); c.closePath(); c.fillStyle = '#c9c3d9'; c.fill(); c.lineWidth = 4; c.strokeStyle = COL.ink; c.stroke();
    for (let i = 0; i < 9; i++){ const yy = 40 + ((t * 200 + i * 37) % 80); ln([[110 + i * 10, yy], [110 + i * 10, yy + 10]], 3, '#5ec8ff'); }
    const hot = Math.sin(t * 1.5) > 0;
    A.circle(150, 150, 44, hot ? '#ff6a5a' : '#a8d4ff', 4);
    c.beginPath(); c.arc(150, 142, 46, Math.PI * 1.05, Math.PI * 1.95); c.closePath(); c.fillStyle = COL.yellow; c.fill(); c.lineWidth = 4; c.stroke();
    [-16, 16].forEach(e => { ell(150 + e, 150, 8, 10, '#fff', 3); ell(150 + e, 152, 2.5, 2.5, COL.ink, 0); }); ell(150, 176, 10, 12, '#7a1f3d', 3);
    c.fillStyle = '#ff7fb8'; c.fillRect(-200, 196, 700, 60); ln([[-200, 196], [500, 196]], 4, COL.ink);
    A.txt(hot ? 'AÏE !' : 'Brrr !', 250, 90, 30, hot ? COL.red : COL.sky, { lw: 7 });
    c.restore();
  }

  Bourdi.ajouter({
    id: 'douche', titre: 'La Douche', court: 'La Douche',
    consigne: 'L\'eau change de température sans prévenir ! Fais glisser le robinet à gauche ou à droite pour garder l\'eau tiède le plus longtemps possible.',
    plusPetitGagne: false,
    seuils: { S: 23000, A: 20000, B: 16500, C: 13000, D: 9000 },
    format: ms => (Math.max(0, ms) / 1000).toFixed(1).replace('.', ',') + ' s',
    musique: 'jeu',
    vignette,
    start(){ ctx = A.ctx(); nouvellePartie(); },
    update, draw, down, move, up,
    etat: () => G
  });
})();

<script>
'use strict';
// =====================================================================
//  ÉPREUVE 6 — LE CAFÉ
//  Garder appuyé pour verser, lâcher pile au trait. Une seule coulée par
//  tasse, et il tombe encore quelques gouttes après avoir lâché !
//  6 petites tasses différentes (sans rien d'écrit dessus).
// =====================================================================
(() => {
  const COL = { ink: '#1d1530', white: '#fff', red: '#ff3b3b', orange: '#ff8a1f', yellow: '#ffd21f', sky: '#5ec8ff', blue: '#2f6bff', green: '#7ad81e', pink: '#ff4fa3', violet: '#8a3ffc' };
  const A = Bourdi.api; let ctx = A.ctx();
  const { ln, ell } = Bourdi.chats;
  const CX = 180, BASE = 560;                 // centre et bas de la tasse
  const DRIP = .045;                          // ce qui coule encore après avoir lâché

  // nom, forme, largeur, hauteur, couleur, temps pour remplir, niveau visé [min, max]
  const TASSES = [
    { nom: 'Expresso', forme: 'tasse', w: 64, h: 52, c: COL.white, full: 1.25, cible: [.55, .75] },
    { nom: 'Ristretto', forme: 'mini', w: 50, h: 40, c: COL.red, full: .85, cible: [.4, .6] },
    { nom: 'Noisette', forme: 'verre', w: 48, h: 64, c: 'rgba(210,240,255,.55)', full: 1.1, cible: [.5, .8] },
    { nom: 'Double expresso', forme: 'tasse', w: 76, h: 60, c: COL.yellow, full: 1.5, cible: [.6, .85] },
    { nom: 'Lungo', forme: 'haute', w: 58, h: 82, c: COL.sky, full: 1.7, cible: [.65, .9] },
    { nom: 'Cortado', forme: 'verre', w: 56, h: 52, c: 'rgba(210,240,255,.55)', full: .95, cible: [.45, .7] }
  ];
  TASSES.forEach(t => { t.w *= 1.6; t.h *= 1.6; });   // de grosses tasses, pour bien voir le trait
  const P = { parfait: 100 };

  let G;
  function nouvelleTasse(){
    const T = TASSES[G.i];
    G.T = T; G.f = 0; G.drip = 0; G.cible = T.cible[0] + Math.random() * (T.cible[1] - T.cible[0]);
    G.phase = 'arrive'; G.pt = .4; G.verdict = null; G.spill = 0;
    A.texte(T.nom, CX, 470, { size: 28, color: COL.white, dur: 1 });
  }
  function nouvellePartie(){ G = { t: 0, count: -1.2, score: 0, i: 0, hold: false, end: 0 }; }

  // ---------- Sons ----------
  let pourNode = 0;
  const snd = {
    count(go){ A.tone(0, go ? 1046 : 523, go ? .3 : .12, .08, 'square'); },
    coule(){ A.bruit(0, .12, .05, 'bandpass', 900 + Math.random() * 300, 3); },
    pschit(){ A.bruit(0, .25, .12, 'highpass', 3000, 1); A.tone(0, 160, .2, .05, 'sawtooth', 90); },
    deborde(){ A.bruit(0, .5, .15, 'lowpass', 700, 1); A.tone(0, 300, .4, .08, 'sawtooth', 120); },
    tchin(){ A.tone(0, 2100, .2, .06, 'triangle'); A.tone(.02, 3150, .15, .03, 'sine'); },
    glisse(){ A.bruit(0, .3, .05, 'bandpass', 1600, 2, 800); }
  };

  // ---------- Logique ----------
  function juger(){
    const T = G.T, err = Math.abs(G.f - G.cible); let pts, txt, col;
    if (G.f > 1){ pts = 0; txt = 'Ça déborde !'; col = COL.red; snd.deborde(); A.secousse(6, .3); }
    else if (err <= .02){ pts = P.parfait; txt = 'Pile poil !'; col = COL.green; A.sons.bien(); A.dire('Pile poil !'); snd.tchin(); A.particules(CX, BASE - T.h * G.f, 24, { speed: 260 }); }
    else { pts = Math.max(0, Math.round(P.parfait * (1 - err / .15))); txt = pts >= 60 ? 'Presque !' : G.f < G.cible ? 'Pas assez !' : 'Trop !'; col = pts >= 60 ? COL.yellow : COL.orange; if (pts < 60) A.sons.erreur(); else snd.tchin(); }
    G.score += pts; G.verdict = { txt, col, pts }; G.phase = 'verdict'; G.pt = 1.3;
  }
  function update(dt){
    G.t += dt;
    if (G.count < 0){ const b = Math.ceil(-G.count / .4); G.count += dt; const a = Math.ceil(-G.count / .4); if (a !== b) snd.count(a === 0); if (G.count >= 0){ G.count = 0; nouvelleTasse(); snd.glisse(); } return; }
    G.pt -= dt;
    if (G.phase === 'arrive' && G.pt <= 0){ G.phase = 'attente'; }
    else if (G.phase === 'attente' && G.hold){ G.phase = 'verse'; snd.pschit(); }
    else if (G.phase === 'verse'){
      G.f += dt / G.T.full; if (Math.random() < dt * 14) snd.coule();
      if (!G.hold){ G.phase = 'gouttes'; G.drip = DRIP; }

    }

  // ---------- Dessin ----------
  function cupPath(T, x0){
    const w = T.w, h = T.h, b = BASE - 10, top = b - h;
    ctx.beginPath();
    if (T.forme === 'verre'){ ctx.moveTo(x0 - w / 2, top); ctx.lineTo(x0 + w / 2, top); ctx.lineTo(x0 + w * .4, b); ctx.lineTo(x0 - w * .4, b); }
    else if (T.forme === 'haute'){ ctx.moveTo(x0 - w / 2, top); ctx.lineTo(x0 + w / 2, top); ctx.lineTo(x0 + w / 2, b - 10); ctx.quadraticCurveTo(x0 + w / 2, b, x0 + w / 2 - 10, b); ctx.lineTo(x0 - w / 2 + 10, b); ctx.quadraticCurveTo(x0 - w / 2, b, x0 - w / 2, b - 10); }
    else { ctx.moveTo(x0 - w / 2, top); ctx.lineTo(x0 + w / 2, top); ctx.bezierCurveTo(x0 + w / 2, b - h * .1, x0 + w * .35, b, x0, b); ctx.bezierCurveTo(x0 - w * .35, b, x0 - w / 2, b - h * .1, x0 - w / 2, top); }
    ctx.closePath();

  }
  function drawCup(T, x0, f, cible, spill){
    const glass = T.forme === 'verre';

    ell(x0, BASE - 4, T.w * .85, 9, glass ? '#e9e4f5' : T.c === COL.white ? '#f2eee6' : T.c);
    // anse
    if (!glass){ ctx.beginPath(); ctx.ellipse(x0 + T.w / 2 + 6, BASE - 10 - T.h * .55, 12, T.h * .22, 0, -Math.PI / 2, Math.PI / 2); ctx.lineWidth = 10; ctx.strokeStyle = COL.ink; ctx.stroke(); ctx.lineWidth = 5; ctx.strokeStyle = T.c; ctx.stroke(); }
    const { top, b } = cupPath(T, x0);
    ctx.fillStyle = glass ? T.c : T.c; ctx.fill();
    // café (découpé dans la forme de la tasse)
    ctx.save(); cupPath(T, x0); ctx.clip();
    const ly = b - (b - top) * Math.min(1, f);
    if (f > 0){ ctx.fillStyle = '#5b3416'; ctx.fillRect(x0 - 60, ly, 120, b - ly + 2); ctx.fillStyle = '#c98a4b'; ctx.fillRect(x0 - 60, ly, 120, 5); }
    ctx.restore();
    cupPath(T, x0); ctx.lineWidth = 4; ctx.strokeStyle = COL.ink; ctx.lineJoin = 'round'; ctx.stroke();
    if (!glass){ ctx.save(); cupPath(T, x0); ctx.clip(); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x0 - T.w / 2 + 6, top + 6, 6, T.h * .5); ctx.restore(); }

    const cy = b - (b - top) * cible;
    ctx.save(); ctx.setLineDash([7, 6]); ln([[x0 - T.w / 2 - 16, cy], [x0 + T.w / 2 + 16, cy]], 3, COL.pink); ctx.restore();
    ctx.beginPath(); ctx.moveTo(x0 - T.w / 2 - 28, cy - 8); ctx.lineTo(x0 - T.w / 2 - 16, cy); ctx.lineTo(x0 - T.w / 2 - 28, cy + 8); ctx.closePath(); ctx.fillStyle = COL.pink; ctx.fill();
    // ça déborde : flaque
    if (spill > 0){ ell(x0, BASE + 2, T.w * .9 * spill + 10, 8 * spill + 2, '#5b3416', 2); for (let i = -1; i <= 1; i += 2) A.blob(x0 + i * T.w / 2 - 4, top, 8, (b - top) * spill, 4, '#5b3416', 0); }
  }
  function drawMachine(){
    // machine à expresso
    A.blob(70, 150, 220, 170, 26, '#c9c3d9', 5);
    A.blob(84, 164, 192, 60, 16, '#e9e4f5', 3);
    A.circle(122, 194, 16, '#fff', 3); ln([[122, 194], [122 + Math.cos(G.t * 2) * 10, 194 + Math.sin(G.t * 2) * 10]], 3, COL.red);
    A.blob(214, 182, 46, 26, 8, G.phase === 'verse' ? COL.green : COL.violet, 3);
    // tête + bec
    A.blob(140, 300, 80, 30, 8, '#4a4060', 4); A.blob(166, 326, 28, 18, 5, '#2f2a3d', 3);
    ln([[200, 312], [262, 296]], 10, COL.ink); ln([[200, 312], [262, 296]], 5, '#8a5222');
  }
  function draw(){
    ctx = A.ctx();
    // cuisine
    ctx.fillStyle = '#fff1d6'; ctx.fillRect(-200, -300, 760, 1100);
    for (let y = 120; y < 600; y += 40) for (let x = -200; x < 560; x += 40) if (((x + y) / 40) % 2 === 0){ ctx.fillStyle = '#ffe2b3'; ctx.fillRect(x, y, 40, 40); }
    ctx.fillStyle = '#8a5a3a'; ctx.fillRect(-200, BASE + 6, 760, 30); ln([[-200, BASE + 6], [560, BASE + 6]], 5, COL.ink);
    ctx.fillStyle = '#6a4228'; ctx.fillRect(-200, BASE + 36, 760, 400);
    drawMachine();
    const T = G.T;
    if (T){
      const slide = G.phase === 'arrive' ? (G.pt / .4) * 300 : 0;
      // filet de café
      if (G.phase === 'verse' || (G.phase === 'gouttes' && G.drip > 0)){
        const { top, b } = { top: BASE - 10 - T.h, b: BASE - 10 }, ly = b - (b - top) * Math.min(1, G.f);
        const w = G.phase === 'verse' ? 7 : 3;
        ln([[CX, 344], [CX, ly]], w + 3, '#3a1f0a'); ln([[CX, 344], [CX, ly]], w, '#7a4a22');
      }
      drawCup(T, CX + slide, G.f, G.cible, G.spill);
      if (G.verdict){
        A.blob(30, 610, 300, 70, 18, '#fff', 4);
        A.txt(G.verdict.txt, CX, 634, 26, G.verdict.col, { lw: 6 });
        A.txt('+' + G.verdict.pts, CX, 664, 20, COL.violet, { lw: 0 });
      } else if (G.phase === 'attente' || G.phase === 'verse'){
        const held = G.hold, dy = held ? 4 : 0;
        A.rr(30, 616, 300, 70, 24); ctx.fillStyle = '#000'; ctx.fill();
        A.blob(30, 610 + dy, 300, 70, 24, held ? COL.green : '#8a5222', 4, '#000');
        A.rr(40, 616 + dy, 280, 20, 12); ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fill();
        A.txt('VERSER', CX, 646 + dy, 34, COL.white, { lw: 8 });
      }
    }
    // HUD
    A.bigNum(String(G.score), 168, 46, 50, { align: 'right' });
    A.txt('pts', 178, 58, 22, COL.white, { lw: 6, align: 'left' });
    A.txt('Tasse ' + Math.min(G.i + 1, TASSES.length) + '/' + TASSES.length, 150, 96, 20, COL.white, { lw: 6 });
    if (G.count < 0){ const n = Math.ceil(-G.count / .4), f = (-G.count % .4) / .4;
      ctx.save(); ctx.translate(180, 420); const s = .7 + f * .6; ctx.scale(s, s); A.bigNum(String(n), 0, 0, 120); ctx.restore(); }
  }

  // ---------- Toucher : garder appuyé n'importe où sous la machine ----------
  const ids = new Set();
  function down(p, id){ if (p.y > 340){ ids.add(id); G.hold = true; } }
  function up(p, id){ if (id === 'all') ids.clear(); else ids.delete(id); G.hold = ids.size > 0; }

  // ---------- Vignette ----------
  // la vignette dessine la tasse à BASE = 560 : on la remonte
  function vignette(c, x, y, w, h, t){
    ctx = c; const k = h / 230;
    c.save(); c.translate(x + w / 2, y + h); c.scale(k, k); c.translate(-150, -230);
    c.fillStyle = '#fff1d6'; c.fillRect(-200, -50, 700, 400); c.fillStyle = '#8a5a3a'; c.fillRect(-200, 196, 700, 100); ln([[-200, 196], [500, 196]], 4, COL.ink);
    A.blob(80, -20, 140, 110, 20, '#c9c3d9', 5); A.blob(126, 84, 48, 20, 5, '#2f2a3d', 3);
    const f = (t * .35) % 1;
    c.save(); c.translate(0, 196 - BASE); ln([[150, 104 - 196 + BASE], [150, BASE - 10 - 52 * 1.6 * f]], 6, '#7a4a22');
     drawCup(TASSES[0], 150, f, .7, 0); c.restore();
    c.restore();
  }

  Bourdi.ajouter({
    id: 'cafe', titre: 'Le Café', court: 'Le Café',
    consigne: 'Garde le doigt appuyé pour verser le café, et lâche pile au trait rose ! Une seule coulée par tasse, et attention : il tombe encore quelques gouttes après.',
    plusPetitGagne: false,
    seuils: { S: 560, A: 480, B: 380, C: 270, D: 150 },
    format: n => Math.max(0, Math.round(n)) + ' pts',
    musique: 'jeu',
    vignette,
    start(){ ctx = A.ctx(); ids.clear(); nouvellePartie(); },
    update, draw, down, up,
    etat: () => G
  });
})();

<script>
'use strict';
// =====================================================================
//  ÉPREUVE 8 — LA SOIRÉE FILM
//  Tout le monde doit voir le film : réveiller Tonton Roupillon, renvoyer
//  les enfants au lit, mettre pause quand quelqu'un va aux toilettes.
//  Score = part du film vue par tout le monde (en %).
// =====================================================================
(() => {
  const COL = { ink: '#1d1530', white: '#fff', red: '#ff3b3b', orange: '#ff8a1f', yellow: '#ffd21f', sky: '#5ec8ff', blue: '#2f6bff', green: '#7ad81e', pink: '#ff4fa3', violet: '#8a3ffc' };
  const A = Bourdi.api; let ctx = A.ctx();
  const { ln } = Bourdi.chats;
  const { drawPerson, makePerson } = Bourdi.persos;
  const FILM = 40, LIMITE = 64;                     // durée du film, temps réel maximum
  const SEATS = [76, 142, 218, 284], SEAT_Y = 556, ROUP = 1;
  const DOOR = { x: 26, y: 290, w: 70, h: 180 };
  const PB = { x: 180, y: 650 };                     // la télécommande (pause / lecture)
  const pick = a => a[Math.floor(Math.random() * a.length)];

  let G;
  function nouvellePartie(){
    const people = SEATS.map(x => ({ p: makePerson('empty'), x, seat: x, st: 'assis', t: 0 }));
    people[ROUP].p.shirt = '#7a8a9a'; people[ROUP].p.style = 'chauve';
    G = { t: 0, count: -1.2, real: 0, film: 0, good: 0, playing: true, end: 0, people,
      roup: { st: 'eveil', t: 5 + Math.random() * 3, taps: 0 },
      kid: null, nextKid: 6 + Math.random() * 4, nextPipi: 5 + Math.random() * 3, flick: 0 };
  }
  const away = () => G.people.some(q => q.st !== 'assis');
  const ok = () => !away() && G.roup.st !== 'dort' && !(G.kid && G.kid.st === 'la');

  // ---------- Sons ----------
  const snd = {
    count(go){ A.tone(0, go ? 1046 : 523, go ? .3 : .12, .08, 'square'); },
    ronfle(){ A.tone(0, 90, .5, .08, 'sawtooth', 70); A.bruit(0, .5, .05, 'lowpass', 400, 1); },
    sursaut(){ A.tone(0, 300, .15, .1, 'square', 600); },
    porte(){ A.tone(0, 240, .25, .03, 'sawtooth', 360); },
    aulit(){ A.tone(0, 520, .1, .07, 'triangle', 780); A.tone(.1, 780, .15, .07, 'triangle', 520); },
    pause(){ A.tone(0, 880, .08, .07, 'square'); },
    lecture(){ A.tone(0, 660, .06, .06, 'square'); A.tone(.06, 990, .08, .06, 'square'); },
    pas(){ A.bruit(0, .05, .08, 'lowpass', 600, 1); }
  };

  // ---------- Logique ----------
  function update(dt){
    G.t += dt;
    if (G.count < 0){ const b = Math.ceil(-G.count / .4); G.count += dt; const a = Math.ceil(-G.count / .4); if (a !== b) snd.count(a === 0); if (G.count >= 0) G.count = 0; return; }
    if (G.end){ if (G.end > 0 && G.t - G.end > 1.3){ G.end = -1; A.fin({ score: Math.round(G.good / FILM * 100) }); } return; }
    G.real += dt;
    const dur = Math.min(1, G.real / 40);               // ça se corse avec le temps
    if (G.playing){ G.film += dt; if (ok()) G.good += dt; }
    // Tonton Roupillon
    const R = G.roup; R.t -= dt;
    if (R.st === 'eveil' && R.t <= 0){ R.st = 'somnole'; R.t = 1.4; }
    else if (R.st === 'somnole' && R.t <= 0){ R.st = 'dort'; R.taps = 0; R.zz = 0; snd.ronfle(); }
    else if (R.st === 'dort'){ R.zz = (R.zz || 0) + dt; if (R.zz > 1.6){ R.zz = 0; snd.ronfle(); } }

    G.nextKid -= dt;
    if (!G.kid && G.nextKid <= 0){ G.kid = { st: 'porte', t: 0, x: DOOR.x + DOOR.w / 2, y: DOOR.y + DOOR.h, p: makePerson('empty') }; G.kid.p.shirt = pick(['#8fd0ff', '#ffb3d9', '#b8f08a']); snd.porte(); setTimeout(() => A.dire('Maman !'), 350); }
    if (G.kid){ const k = G.kid; k.t += dt;
      if (k.st === 'porte' && k.t > .5){ k.st = 'marche'; k.t = 0; }
      else if (k.st === 'marche'){ const u = Math.min(1, k.t / (3.4 - dur)); k.x = DOOR.x + DOOR.w / 2 + (180 - DOOR.x - DOOR.w / 2) * u; k.y = DOOR.y + DOOR.h + (640 - DOOR.y - DOOR.h) * u; if (u >= 1) k.st = 'la'; }
      else if (k.st === 'retour'){ k.x -= 260 * dt; k.y -= 110 * dt; if (k.x < DOOR.x + 20){ G.kid = null; G.nextKid = 7 + Math.random() * 5 - dur * 2; } }
    }
    // quelqu'un va aux toilettes
    G.nextPipi -= dt;
    if (G.nextPipi <= 0 && !away()){
      const q = pick(G.people.filter((q, i) => i !== ROUP));
      q.st = 'part'; q.t = 0; q.said = false; G.nextPipi = 11 + Math.random() * 4 - dur * 2;
    }
    G.people.forEach(q => { q.t += dt;
      if (q.st === 'part'){ if (!q.said && q.t > .3 && G.playing){ q.said = true; A.texte('Attendez-moi !', 230, 400, { size: 26, color: COL.orange, dur: 1.1 }); }
        q.x = q.seat + (420 - q.seat) * Math.min(1, q.t / .6); if (q.t > .6){ q.st = 'absent'; q.t = 0; q.dur = 1.4 + Math.random() * .8; } }
      else if (q.st === 'absent' && q.t > q.dur){ q.st = 'revient'; q.t = 0; }
      else if (q.st === 'revient'){ q.x = 420 + (q.seat - 420) * Math.min(1, q.t / .6); if (Math.random() < dt * 8) snd.pas(); if (q.t > .6){ q.st = 'assis'; q.x = q.seat; } }
    });

    ctx.fillStyle = open ? '#ffe9a8' : '#1d1530'; ctx.fillRect(DOOR.x, DOOR.y, DOOR.w, DOOR.h);
    A.blob(DOOR.x, DOOR.y, DOOR.w * (1 - open * .75), DOOR.h, 3, '#8a6a9a', 3);
    // cadre au mur
    A.blob(150, 200, 90, 66, 4, '#c98a5a', 4); A.blob(158, 208, 74, 50, 2, '#5a8ad8', 2); A.circle(178, 236, 9, COL.yellow, 0);
    // canapé (dos), puis les gens, puis l'avant du canapé
    A.blob(40, 440, 280, 90, 26, '#3a6ad8', 5);
    G.people.forEach((q, i) => {
      if (q.st !== 'assis') return;
      if (i === ROUP){
        const R = G.roup, nod = R.st === 'somnole' ? Math.sin(G.t * 5) * .12 + .08 : R.st === 'dort' ? .28 : 0;
        drawPerson(q.p, q.x, SEAT_Y, .68, G.t, { sit: true, rot: nod, expr: R.st === 'eveil' ? 'smile' : 'sleep' });
        if (R.st === 'dort') A.txt('Zzz…', q.x + 44, 410 + Math.sin(G.t * 3) * 6, 26, COL.sky, { lw: 6 });
      } else drawPerson(q.p, q.x, SEAT_Y, .68, G.t, { sit: true, expr: 'smile' });
    });
    A.blob(30, 520, 300, 46, 16, '#2f5ac0', 5); A.blob(18, 478, 40, 92, 16, '#3a6ad8', 4); A.blob(302, 478, 40, 92, 16, '#3a6ad8', 4);
    // ceux qui vont aux toilettes
    G.people.forEach(q => { if (q.st === 'part' || q.st === 'revient') drawPerson(q.p, q.x, 640, .7, G.t, { walk: true, expr: 'smile' }); });
    // l'enfant en pyjama
    if (G.kid){ const k = G.kid, s = .4 + .25 * ((k.y - DOOR.y - DOOR.h) / (640 - DOOR.y - DOOR.h));
      drawPerson(k.p, k.x, k.y, s, G.t, { walk: k.st !== 'la', expr: k.st === 'retour' ? 'sad' : 'smile' }); }
    // lumière de la télé
    const fl = .1 + Math.sin(G.flick * 7) * .03 + Math.sin(G.flick * 13) * .02;
    ctx.fillStyle = G.playing ? `rgba(120,200,255,${fl})` : 'rgba(0,0,0,.15)'; ctx.fillRect(-200, -300, 760, 1100);
    // la télécommande : son gros bouton met le film en pause / le relance
    A.rr(PB.x - 44, PB.y - 46, 88, 120, 22); ctx.fillStyle = '#000'; ctx.fill();
    A.blob(PB.x - 44, PB.y - 52, 88, 120, 22, '#2f2a3d', 4, '#8a80a8');
    [[-24, COL.red], [0, COL.green], [24, COL.yellow]].forEach(([dx, c]) => A.circle(PB.x + dx, PB.y + 48, 6, c, 2));

  }

  // ---------- Toucher ----------
  function down(p){

  // ---------- Vignette ----------
  function vignette(c, x, y, w, h, t){

    c.save(); c.translate(x + w / 2, y + h); c.scale(k, k); c.translate(-150, -230);

    c.fillStyle = 'rgba(120,200,255,.12)'; c.fillRect(-200, -50, 700, 400);
    c.restore();
  }

  Bourdi.ajouter({
    id: 'film', titre: 'La Soirée Film', court: 'La Soirée Film',
    consigne: 'Tout le monde doit voir le film jusqu\'au bout ! Réveille Tonton Roupillon, renvoie les enfants au lit, et mets le film en pause quand quelqu\'un va aux toilettes.',
    plusPetitGagne: false,
    seuils: { S: 96, A: 92, B: 86, C: 75, D: 55 },
    format: n => Math.max(0, Math.round(n)) + ' %',
    musique: 'jeu',
    vignette,
    start(){ ctx = A.ctx(); nouvellePartie(); },
    update, draw, down,
    etat: () => G
  });
})();

<script>
'use strict';
// =====================================================================
//  ÉPREUVE 7 — LE COULOIR
//  La nuit, aller de la chambre aux toilettes. Lumière allumée quelques
//  secondes pour repérer les pièges, puis noir : on touche les cases une
//  par une. Piège = +2 s ; 3 pièges dans la même nuit = toute la maison
//  se réveille et on recommence la nuit. Score = chrono sur 3 nuits.
// =====================================================================
(() => {
  const COL = { ink: '#1d1530', white: '#fff', red: '#ff3b3b', orange: '#ff8a1f', yellow: '#ffd21f', sky: '#5ec8ff', blue: '#2f6bff', green: '#7ad81e', pink: '#ff4fa3', violet: '#8a3ffc' };
  const A = Bourdi.api; let ctx = A.ctx();
  const { LOOKS, drawCat, ln, ell } = Bourdi.chats;
  const { drawPerson, makePerson } = Bourdi.persos;
  const COLS = 5, ROWS = 8, CS = 58, GX = (360 - COLS * CS) / 2, GY = 160;   // damier
  const NUITS = [{ pieges: 7, vu: 3 }, { pieges: 10, vu: 2.5 }, { pieges: 13, vu: 2 }];
  const PEN = 2000, BRUIT_MAX = 3;
  const cx = c => GX + c * CS + CS / 2, cy = r => GY + (ROWS - 1 - r) * CS + CS / 2;   // rangée 0 = en bas

  // ---------- Les pièges (vus du dessus) ----------
  function drawTrap(k, x, y){
    ctx.save(); ctx.translate(x, y);
    if (k === 'lego'){ A.blob(-16, -10, 32, 20, 3, COL.red, 3); [-8, 8].forEach(dx => [-3].forEach(() => A.circle(dx, -1, 5, '#ff6a6a', 2.5))); }
    else if (k === 'lego2'){ A.blob(-10, -14, 20, 28, 3, COL.blue, 3); [-6, 6].forEach(dy => A.circle(0, dy, 5, '#6a9aff', 2.5)); }
    else if (k === 'voiture'){ A.blob(-18, -10, 36, 20, 8, COL.green, 3); A.blob(-8, -7, 14, 14, 4, '#bfeaff', 2); [[-12, -12], [10, -12], [-12, 12], [10, 12]].forEach(([a, b]) => A.blob(a - 4, b - 2, 8, 4, 2, COL.ink, 0)); }
    else if (k === 'banane'){ ctx.rotate(.4); ctx.beginPath(); ctx.moveTo(-18, -4); ctx.quadraticCurveTo(0, 16, 18, -4); ctx.quadraticCurveTo(0, 6, -18, -4); ctx.fillStyle = COL.yellow; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = COL.ink; ctx.stroke(); }
    else if (k === 'canard'){ ell(-2, 2, 14, 11, COL.yellow); A.circle(8, -8, 8, COL.yellow, 3); ell(16, -7, 5, 2.5, COL.orange, 2); ell(9, -10, 1.6, 1.6, COL.ink, 0); }
    else if (k === 'chat'){ drawCat(LOOKS.brabus, 2, 18, .45, 'sit', G ? G.t : 0, { expr: 'happy' }); }
    ctx.restore();
  }
  const TRAP_KINDS = ['lego', 'lego2', 'lego', 'voiture', 'banane', 'canard', 'lego2'];

  // ---------- État ----------
  let G;
  function chemin(traps, start, goal){
    // vérifie qu'il existe un chemin sans piège (déplacements haut/bas/gauche/droite)
    const seen = new Set([start.join()]), q = [start];
    while (q.length){ const [c, r] = q.shift(); if (c === goal[0] && r === goal[1]) return true;
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dc, dr]) => { const n = [c + dc, r + dr], k = n.join();
        if (n[0] >= 0 && n[0] < COLS && n[1] >= 0 && n[1] < ROWS && !seen.has(k) && !traps[k]){ seen.add(k); q.push(n); } }); }
    return false;
  }
  function nouvelleNuit(){
    const N = NUITS[G.nuit - 1], start = [2, 0], goal = [Math.floor(Math.random() * COLS), ROWS - 1];
    let traps;
    do {
      traps = {};
      const kinds = TRAP_KINDS.slice(); const list = [];
      for (let i = 0; i < N.pieges; i++) list.push(i === 0 ? 'chat' : kinds[i % kinds.length]);
      list.forEach(k => { let c, r, key; do { c = Math.floor(Math.random() * COLS); r = 1 + Math.floor(Math.random() * (ROWS - 2)); key = c + ',' + r; } while (traps[key]); traps[key] = { k, seen: false }; });
    } while (!chemin(traps, start, goal));
    G.traps = traps; G.start = start; G.goal = goal;
    debutNuit();
  }
  function debutNuit(){
    G.pos = G.start.slice(); G.prev = G.start.slice(); G.bruit = 0;
    Object.values(G.traps).forEach(t => { t.seen = false; });
    G.phase = 'lumiere'; G.pt = NUITS[G.nuit - 1].vu; G.flash = 0;
  }
  function nouvellePartie(){ G = { t: 0, count: -1.2, ms: 0, pen: 0, nuit: 1, end: 0, steps: 0, famille: null }; nouvelleNuit(); }

  // ---------- Sons ----------
  const snd = {
    count(go){ A.tone(0, go ? 1046 : 523, go ? .3 : .12, .08, 'square'); },
    pas(n){ A.bruit(0, .06, .12, 'lowpass', 500 + (n % 2) * 150, 1); A.tone(0, 90, .05, .06, 'sine', 60); },
    clic(){ A.tone(0, 1800, .03, .08, 'square'); A.bruit(0, .03, .1, 'highpass', 3000, 1); },
    aie(){ A.tone(0, 600, .35, .1, 'sawtooth', 1100); A.bruit(0, .1, .2, 'bandpass', 2500, 2); },
    miaou(){ A.tone(0, 600, .12, .09, 'sawtooth', 950); A.tone(.11, 950, .3, .09, 'sawtooth', 450); },
    pouet(){ A.tone(0, 700, .12, .12, 'square', 900); A.tone(.12, 900, .2, .12, 'square', 600); },
    glisse(){ A.tone(0, 900, .3, .07, 'sine', 200); A.bruit(0, .3, .08, 'bandpass', 1500, 2, 400); },
    reveil(){ A.tone(0, 220, .6, .1, 'sawtooth', 180); A.tone(0, 277, .6, .06, 'sawtooth', 220); A.bruit(0, .5, .08, 'lowpass', 600, 1); },
    chasse(){ A.bruit(0, 1.0, .14, 'bandpass', 2200, 1.2, 300); }
  };

  // ---------- Logique ----------
  function marche(c, r){
    const d = Math.abs(c - G.pos[0]) + Math.abs(r - G.pos[1]);
    if (d !== 1 || c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
    G.prev = G.pos.slice(); G.pos = [c, r]; G.steps++; snd.pas(G.steps);
    const t = G.traps[c + ',' + r];
    if (t){
      t.seen = true; G.flash = .35; G.pen += PEN; G.bruit++;
      const x = cx(c), y = cy(r);
      if (t.k === 'chat'){ A.texte('MIAOU !', x, y - 40, { size: 30, color: COL.pink, dur: .9 }); snd.miaou(); }
      else if (t.k === 'canard'){ A.texte('POUET !', x, y - 40, { size: 30, color: COL.yellow, dur: .9 }); snd.pouet(); }
      else if (t.k === 'banane'){ A.texte('Ça glisse !', x, y - 40, { size: 26, color: COL.yellow, dur: .9 }); snd.glisse(); G.pos = G.prev.slice(); }
      else { A.texte('AÏE !', x, y - 40, { size: 34, color: COL.red, dur: .9 }); snd.aie(); }
      A.texte('+2 s', x + 50, y, { size: 22, color: COL.red, dur: .8 }); A.secousse(7, .25);
      if (G.bruit >= BRUIT_MAX){
        G.phase = 'reveil'; G.pt = 2.0; G.famille = [makePerson('empty'), makePerson('empty'), makePerson('bidou')];
        A.texte('Mais t\'es encore réveillé ?!', 180, 300, { size: 26, color: COL.yellow, dur: 1.9, vy: 0 }); snd.reveil(); A.dire("Mais t'es encore réveillé ?!");
      }
      return;
    }
    if (c === G.goal[0] && r === G.goal[1]){
      G.phase = 'arrive'; G.pt = 1.1; A.texte('Ouf !', 180, 130, { size: 40, color: COL.green, dur: 1, vy: 0 }); snd.chasse();
    }
  }
  function update(dt){
    G.t += dt; G.flash = Math.max(0, G.flash - dt);
    if (G.count < 0){ const b = Math.ceil(-G.count / .4); G.count += dt; const a = Math.ceil(-G.count / .4); if (a !== b) snd.count(a === 0); if (G.count >= 0) G.count = 0; return; }
    G.pt -= dt;
    if (G.phase === 'lumiere'){ if (G.pt <= 0){ G.phase = 'noir'; A.texte('Clic !', 180, 130, { size: 30, color: COL.white, dur: .7 }); snd.clic(); } }
    else if (G.phase === 'noir'){ G.ms += dt * 1000; }
    else if (G.phase === 'reveil'){ G.ms += dt * 1000; if (G.pt <= 0){ G.famille = null; debutNuit(); } }
    else if (G.phase === 'arrive' && G.pt <= 0){
      if (G.nuit >= NUITS.length){ G.phase = 'fin'; G.end = G.t; A.texte('Bonne nuit !', 180, 360, { size: 42, color: COL.yellow, dur: 1.3, vy: 0 }); A.sons.bien(); A.particules(180, 360, 40, { speed: 340 }); }
      else { G.nuit++; nouvelleNuit(); }
    }
    else if (G.phase === 'fin' && G.t - G.end > 1.2){ G.phase = 'done'; A.fin({ score: Math.round(G.ms + G.pen) }); }
  }

  // ---------- Dessin ----------
  function drawPlayer(x, y){
    // vu du dessus : épaules en pyjama rayé, tête, bonnet de nuit
    ell(x, y + 4, 20, 13, '#8fd0ff'); ln([[x - 12, y - 4], [x - 12, y + 12]], 3, '#fff'); ln([[x, y - 8], [x, y + 16]], 3, '#fff'); ln([[x + 12, y - 4], [x + 12, y + 12]], 3, '#fff');
    A.circle(x, y - 4, 12, '#ffd9b8', 3);
    ctx.beginPath(); ctx.arc(x, y - 4, 12, Math.PI * .9, Math.PI * 2.1); ctx.lineTo(x + 16, y - 22); ctx.closePath(); ctx.fillStyle = COL.violet; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = COL.ink; ctx.stroke();
    A.circle(x + 16, y - 22, 4, '#fff', 2);
  }
  function draw(){
    ctx = A.ctx();
    const lit = G.phase === 'lumiere' || G.phase === 'reveil' || G.phase === 'arrive' || G.phase === 'fin' || G.count < 0;
    // murs + parquet
    ctx.fillStyle = '#7a5a8a'; ctx.fillRect(-200, -300, 760, 1100);
    ctx.fillStyle = '#d9a46a'; ctx.fillRect(GX, GY, COLS * CS, ROWS * CS);
    for (let i = 0; i < COLS; i++) ln([[GX + i * CS, GY], [GX + i * CS, GY + ROWS * CS]], 2, '#b8824a');
    for (let r = 0; r <= ROWS; r++) ln([[GX, GY + r * CS], [GX + COLS * CS, GY + r * CS]], 1.5, 'rgba(120,70,30,.5)');
    ctx.lineWidth = 5; ctx.strokeStyle = COL.ink; ctx.strokeRect(GX, GY, COLS * CS, ROWS * CS);
    // portes : toilettes en haut, chambre en bas, chambres sur les côtés
    const gx = cx(G.goal[0]);
    A.blob(gx - 24, GY - 34, 48, 34, 4, G.phase === 'arrive' || G.phase === 'fin' ? COL.green : '#8fd0ff', 4); A.txt('WC', gx, GY - 17, 15, COL.ink, { lw: 0 });
    A.blob(cx(2) - 24, GY + ROWS * CS, 48, 26, 4, COL.pink, 4);
    [[GX - 14, GY + 110], [GX - 14, GY + 300], [GX + COLS * CS, GY + 200]].forEach(([x, y]) => A.blob(x, y, 14, 60, 3, '#c98a5a', 3));
    // pièges
    Object.entries(G.traps).forEach(([k, t]) => { const [c, r] = k.split(',').map(Number); if (lit || t.seen) drawTrap(t.k, cx(c), cy(r)); });
    // le noir
    if (!lit){
      ctx.fillStyle = 'rgba(8,6,20,.94)'; ctx.fillRect(-200, -300, 760, 1100);
      // on devine le damier
      ctx.strokeStyle = 'rgba(150,140,200,.22)'; ctx.lineWidth = 2;
      for (let c = 0; c <= COLS; c++){ ctx.beginPath(); ctx.moveTo(GX + c * CS, GY); ctx.lineTo(GX + c * CS, GY + ROWS * CS); ctx.stroke(); }
      for (let r = 0; r <= ROWS; r++){ ctx.beginPath(); ctx.moveTo(GX, GY + r * CS); ctx.lineTo(GX + COLS * CS, GY + r * CS); ctx.stroke(); }
      // lueur sous la porte des toilettes
      const g = ctx.createRadialGradient(gx, GY, 4, gx, GY, 60); g.addColorStop(0, 'rgba(255,230,140,.75)'); g.addColorStop(1, 'rgba(255,230,140,0)');
      ctx.fillStyle = g; ctx.fillRect(gx - 60, GY - 60, 120, 120);
      ln([[gx - 22, GY - 1], [gx + 22, GY - 1]], 4, '#ffe08a');
      // pièges déjà écrasés (on s'en souvient)
      Object.entries(G.traps).forEach(([k, t]) => { if (!t.seen) return; const [c, r] = k.split(',').map(Number); ctx.save(); ctx.globalAlpha = G.flash > 0 ? 1 : .45; drawTrap(t.k, cx(c), cy(r)); ctx.restore(); });
      // cases où l'on peut aller
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dc, dr]) => { const c = G.pos[0] + dc, r = G.pos[1] + dr; if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;
        A.rr(GX + c * CS + 6, GY + (ROWS - 1 - r) * CS + 6, CS - 12, CS - 12, 10); ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.stroke(); });
    }
    if (G.flash > 0){ ctx.fillStyle = 'rgba(255,255,255,' + G.flash * .5 + ')'; ctx.fillRect(-200, -300, 760, 1100); }
    drawPlayer(cx(G.pos[0]), cy(G.pos[1]));
    // la famille réveillée sort des chambres
    if (G.famille){ G.famille.forEach((p, i) => drawPerson(p, 70 + i * 110, 640, .62, G.t, { expr: p.kind === 'bidou' ? 'grin' : 'sad' })); }
    // HUD
    A.bigNum(((G.ms + G.pen) / 1000).toFixed(2).replace('.', ','), 196, 46, 50, { align: 'right' });
    A.txt('s', 206, 58, 22, COL.white, { lw: 6, align: 'left' });
    A.txt('Nuit ' + G.nuit + '/' + NUITS.length, 110, 96, 20, COL.white, { lw: 6 });
    for (let i = 0; i < BRUIT_MAX; i++){ A.blob(196 + i * 34, 84, 28, 24, 6, i < G.bruit ? COL.red : '#4a4060', 3, COL.white); }
    if (G.phase === 'lumiere' && G.count >= 0){ const k = G.pt / NUITS[G.nuit - 1].vu; A.blob(60, 124, 240, 14, 7, '#fff', 3); A.rr(63, 127, 234 * k, 8, 4); ctx.fillStyle = COL.yellow; ctx.fill(); }
    if (G.count < 0){ const n = Math.ceil(-G.count / .4), f = (-G.count % .4) / .4;
      ctx.save(); ctx.translate(180, 380); const s = .7 + f * .6; ctx.scale(s, s); A.bigNum(String(n), 0, 0, 120); ctx.restore(); }
  }

  // ---------- Toucher : une case voisine ----------
  function down(p){
    if (G.phase !== 'noir') return;
    const c = Math.floor((p.x - GX) / CS), r = ROWS - 1 - Math.floor((p.y - GY) / CS);
    if (p.x < GX || p.y < GY || p.y > GY + ROWS * CS) return;
    marche(c, r);
  }

  // ---------- Vignette ----------
  function vignette(c, x, y, w, h, t){
    ctx = c; const k = h / 230;
    c.save(); c.translate(x + w / 2, y + h); c.scale(k, k); c.translate(-150, -230);
    c.fillStyle = '#d9a46a'; c.fillRect(-200, -50, 700, 400);
    for (let i = -4; i < 10; i++) ln([[i * 40, -50], [i * 40, 300]], 2, '#b8824a');
    drawTrap('lego', 90, 80); drawTrap('canard', 210, 60); drawTrap('banane', 230, 170); drawTrap('lego2', 70, 190);
    const dark = Math.sin(t * 1.5) > 0;
    if (dark){ c.fillStyle = 'rgba(8,6,20,.9)'; c.fillRect(-200, -50, 700, 400); }
    drawPlayer(150, 130);
    if (dark) A.txt('AÏE !', 150, 70, 34, COL.red, { lw: 8 });
    c.restore();
  }

  Bourdi.ajouter({
    id: 'couloir', titre: 'Le Couloir', court: 'Le Couloir',
    consigne: 'C\'est la nuit, envie pressante ! Retiens bien où sont les pièges pendant que la lumière est allumée, puis touche les cases une par une pour aller jusqu\'aux toilettes sans rien écraser.',
    plusPetitGagne: true,
    seuils: { S: 12000, A: 16000, B: 22000, C: 30000, D: 42000 },
    format: ms => (Math.max(0, ms) / 1000).toFixed(2).replace('.', ',') + ' s',
    musique: 'jeu',
    vignette,
    start(){ ctx = A.ctx(); nouvellePartie(); },
    update, draw, down,
    etat: () => G
  });
})();

</script>
<script>
'use strict';
// =====================================================================
//  ÉPREUVE 9 — LES GLACES
//  3 personnes, chacune veut un nombre de boules (dans sa bulle).
//  On touche chaque bol autant de fois qu'il faut. Une de trop : elle
//  tombe par terre (+1 s). Tonton Roupillon en veut parfois 9 !
//  5 manches, score = chrono.
// =====================================================================
(() => {
  const COL = { ink: '#1d1530', white: '#fff', red: '#ff3b3b', orange: '#ff8a1f', yellow: '#ffd21f', sky: '#5ec8ff', blue: '#2f6bff', green: '#7ad81e', pink: '#ff4fa3', violet: '#8a3ffc' };
  const A = Bourdi.api; let ctx = A.ctx();
  const { ln, ell } = Bourdi.chats;
  const { drawPerson, makePerson } = Bourdi.persos;
  const XS = [66, 180, 294], BOWL_Y = 548, COUNTER = 500;
  const MANCHES = [[1, 3], [2, 4], [2, 5], [3, 6], [3, 7]];
  const PARFUMS = ['#ffb3cf', '#7a4a22', '#b8f08a', '#fff3c4', '#ff6a5a', '#c9a0ff'];
  const PEN = 1000;
  const pick = a => a[Math.floor(Math.random() * a.length)];

  let G;
  function roupillon(){ const p = makePerson('empty'); p.shirt = '#7a8a9a'; p.style = 'chauve'; p.skin = '#ffd9b8'; p.roup = true; return p; }
  function nouvelleManche(){
    const [a, b] = MANCHES[G.m - 1];
    const roupAt = (G.m === 3 || G.m === 5) && Math.random() < .6 ? Math.floor(Math.random() * 3) : -1;
    G.clients = XS.map((x, i) => { const roup = i === roupAt;
      return { x, p: roup ? roupillon() : makePerson('empty'), veut: roup ? 9 : a + Math.floor(Math.random() * (b - a + 1)), boules: [], ok: false, falls: [] }; });
    G.phase = 'arrive'; G.pt = .5;
  }
  function nouvellePartie(){ G = { t: 0, count: -1.2, ms: 0, pen: 0, m: 1, end: 0 }; nouvelleManche(); }

  const snd = {
    count(go){ A.tone(0, go ? 1046 : 523, go ? .3 : .12, .08, 'square'); },
    plop(n){ A.tone(0, 300 + n * 40, .1, .12, 'sine', 160); A.bruit(0, .05, .08, 'lowpass', 900, 1); },
    tombe(){ A.tone(0, 600, .4, .07, 'sine', 120); A.bruit(.35, .1, .15, 'lowpass', 500, 1); },
    miam(){ A.tone(0, 660, .12, .06, 'triangle', 990); }
  };

  function update(dt){
    G.t += dt;
    if (G.count < 0){ const b = Math.ceil(-G.count / .4); G.count += dt; const a = Math.ceil(-G.count / .4); if (a !== b) snd.count(a === 0); if (G.count >= 0) G.count = 0; return; }
    G.pt -= dt;
    if (G.phase === 'arrive' && G.pt <= 0) G.phase = 'sert';
    if (G.phase === 'sert' || G.phase === 'arrive') G.ms += dt * 1000;
    if (G.phase === 'sert' && G.clients.every(c => c.ok)){ G.phase = 'fini'; G.pt = .6; }
    if (G.phase === 'fini' && G.pt <= 0){
      if (G.m >= MANCHES.length){ G.phase = 'fin'; G.end = G.t; A.texte('Régalez-vous !', 180, 330, { size: 38, color: COL.yellow, dur: 1.3, vy: 0 }); A.sons.bien(); A.particules(180, 330, 40, { speed: 340 }); }
      else { G.m++; nouvelleManche(); }
    }
    if (G.phase === 'fin' && G.t - G.end > 1.2){ G.phase = 'done'; A.fin({ score: Math.round(G.ms + G.pen) }); }
    G.clients.forEach(c => c.falls.forEach(f => { f.t += dt; f.y += f.vy * dt; f.vy += 900 * dt; f.x += f.vx * dt; }));
  }
  function sers(i){
    const c = G.clients[i];
    if (c.boules.length >= c.veut){
      c.falls.push({ x: c.x, y: BOWL_Y - 40 - c.veut * 4, vx: (Math.random() - .5) * 200, vy: -200, t: 0, col: pick(PARFUMS) });
      G.pen += PEN; snd.tombe(); A.texte('Trop ! +1 s', c.x, 300, { size: 24, color: COL.red, dur: .8 }); A.secousse(4, .15); return;
    }
    c.boules.push(pick(PARFUMS)); snd.plop(c.boules.length);
    if (c.boules.length === c.veut){ c.ok = true; snd.miam(); A.texte('Miam !', c.x, 330, { size: 26, color: COL.green, dur: .7 }); A.particules(c.x, BOWL_Y - 40, 10, { speed: 160, size: 6 }); }
  }

  // ---------- Dessin ----------
  function scoop(x, y, r, col){ A.circle(x, y, r, col, 3); ell(x - r * .35, y - r * .35, r * .25, r * .18, 'rgba(255,255,255,.6)', 0); }
  function bowlStack(c){
    // empile les boules en petite pyramide au-dessus du bol
    const r = 13; let i = 0;
    for (let row = 0; i < c.boules.length; row++){
      const n = Math.max(1, 3 - (row % 3 === 2 ? 1 : 0) - Math.floor(row / 2));
      for (let k = 0; k < n && i < c.boules.length; k++, i++) scoop(c.x + (k - (n - 1) / 2) * r * 1.6, BOWL_Y - 26 - row * r * 1.35, r, c.boules[i]);
    }
  }

<script>
'use strict';
// =====================================================================
//  ÉPREUVE 11 — LA TOURNÉE
//  3 verres se remplissent en même temps, chacun à sa vitesse. On touche
//  un verre pour l'arrêter au trait. Points selon la précision.
//  4 manches, score en points. (Soda sans marque.)
// =====================================================================
(() => {
  const COL = { ink: '#1d1530', white: '#fff', red: '#ff3b3b', orange: '#ff8a1f', yellow: '#ffd21f', sky: '#5ec8ff', blue: '#2f6bff', green: '#7ad81e', pink: '#ff4fa3', violet: '#8a3ffc' };
  const A = Bourdi.api; let ctx = A.ctx();
  const { ln, ell } = Bourdi.chats;
  const XS = [66, 180, 294], BASE = 560, MANCHES = 4;
  const SODAS = [{ c: '#5b2a10', mousse: '#d9b08a' }, { c: '#ff8a1f', mousse: '#ffe2b3' }, { c: '#f2f0a0', mousse: '#ffffff' }];
  const VERRES = [{ w: 62, h: 110 }, { w: 54, h: 150 }, { w: 78, h: 96 }, { w: 50, h: 130 }, { w: 70, h: 120 }];

  let G;
  function nouvelleManche(){
    const vs = VERRES.slice().sort(() => Math.random() - .5), base = .26 + G.m * .06;
    G.verres = XS.map((x, i) => ({ x, ...vs[i], soda: SODAS[i], f: 0, v: base * (.7 + Math.random() * .8), cible: .62 + Math.random() * .26, stop: false, verdict: null }));

  }
  function nouvellePartie(){ G = { t: 0, count: -1.2, score: 0, m: 1, end: 0 }; nouvelleManche(); }

  const snd = {
    count(go){ A.tone(0, go ? 1046 : 523, go ? .3 : .12, .08, 'square'); },
    pschit(){ A.bruit(0, .35, .15, 'highpass', 2500, 1); },
    stop(){ A.tone(0, 1200, .06, .06, 'square'); },
    glou(){ A.bruit(0, .08, .03, 'bandpass', 700 + Math.random() * 500, 4); },
    deborde(){ A.bruit(0, .4, .12, 'lowpass', 700, 1); A.tone(0, 300, .3, .07, 'sawtooth', 140); },

  function update(dt){

    // la bouteille : renversée pile au-dessus du verre quand elle verse, posée à côté quand elle est arrêtée
    const pouring = !v.stop && G.phase === 'verse';
    if (pouring) ln([[x, 246], [x, b - h * Math.min(1, v.f)]], 6, v.soda.c);
    ctx.save();
    if (pouring){ ctx.translate(x, 246); ctx.rotate(Math.sin(G.t * 3 + x) * .06); }
    else { ctx.translate(x + w / 2 + 14, b - 60); ctx.scale(.62, .62); ctx.rotate(Math.PI); }
    // dessinée goulot en bas (0, 0 = bouchon) : c'est la position pour verser ; retournée, elle est debout
    A.blob(-17, -96, 34, 72, 12, 'rgba(120,200,120,.9)', 3);
    A.blob(-17, -76, 34, 22, 2, v.soda.c, 2);
    A.blob(-8, -24, 16, 22, 5, 'rgba(120,200,120,.9)', 3);
    A.blob(-9, -6, 18, 8, 3, COL.red, 2);
    ctx.restore();
    if (v.f > 1){ A.blob(x - w / 2 - 6, top - 6, w + 12, 12, 6, v.soda.mousse, 2); ell(x, b + 6, w * .8, 6, v.soda.c, 2); }
    if (v.verdict){ A.txt(v.verdict.txt, x, b + 36, 16, v.verdict.col, { lw: 5, max: 112 }); A.txt('+' + v.verdict.pts, x, b + 62, 16, COL.white, { lw: 5 }); }
  }
  function draw(){
    ctx = A.ctx();
    ctx.fillStyle = '#c9f0ff'; ctx.fillRect(-200, -300, 760, 1100);
    for (let x = -200; x < 560; x += 50){ ctx.fillStyle = '#b5e6fa'; ctx.fillRect(x, -300, 25, 900); }
    ctx.fillStyle = '#c98a5a'; ctx.fillRect(-200, BASE, 760, 400); ln([[-200, BASE], [560, BASE]], 5, COL.ink);
    G.verres.forEach(verre);
    A.bigNum(String(G.score), 168, 46, 50, { align: 'right' });
    A.txt('pts', 178, 58, 22, COL.white, { lw: 6, align: 'left' });
    A.txt('Manche ' + G.m + '/' + MANCHES, 150, 96, 20, COL.white, { lw: 6 });
    if (G.count < 0){ const n = Math.ceil(-G.count / .4), f = (-G.count % .4) / .4;
      ctx.save(); ctx.translate(180, 400); const s = .7 + f * .6; ctx.scale(s, s); A.bigNum(String(n), 0, 0, 120); ctx.restore(); }
  }
  function down(p){
    if (G.phase !== 'verse' || p.y < 200) return;
    const i = XS.findIndex(x => Math.abs(p.x - x) < 58); if (i < 0) return;
    const v = G.verres[i]; if (v.stop) return;
    v.stop = true; juger(v);
  }
  function vignette(c, x, y, w, h, t){
    ctx = c; const k = h / 230;
    c.save(); c.translate(x + w / 2, y + h); c.scale(k, k); c.translate(-150, -230);
    c.fillStyle = '#c9f0ff'; c.fillRect(-200, -50, 700, 400); c.fillStyle = '#c98a5a'; c.fillRect(-200, 200, 700, 100);
    const save = G; G = { t, phase: 'x' };
    c.save(); c.translate(0, 200 - BASE);
    [[70, 0, .4], [150, 1, .7], [230, 2, .55]].forEach(([xx, i, f]) => verre({ x: xx, w: 54, h: 110, soda: SODAS[i], f: (f + t * .2) % 1, cible: .75, stop: true, verdict: null }));
    c.restore(); G = save;
    c.restore();
  }
  Bourdi.ajouter({
    id: 'tournee', titre: 'La Tournée', court: 'La Tournée',
    consigne: 'Les trois verres se remplissent en même temps ! Touche chaque verre pour l\'arrêter pile au trait. Attention, ça déborde vite.',
    plusPetitGagne: false,
    seuils: { S: 1100, A: 960, B: 800, C: 600, D: 350 },
    format: n => Math.max(0, Math.round(n)) + ' pts',
    musique: 'jeu', vignette,
    start(){ ctx = A.ctx(); nouvellePartie(); },
    update, draw, down, etat: () => G
  });
})();

</script>
<script>
'use strict';
// =====================================================================
//  ÉPREUVE 12 — FUMETTE À HAUT RISQUE
//  Garder appuyé = vapoter en cachette. Papa est de dos ; avant de se
//  retourner il prévient (« Hum ? »), parfois c'est une fausse alerte
//  (« Atchoum ! »). La fumée reste un peu dans l'air. 30 s, une seule chance.
//  Score = temps total passé à vapoter.
// =====================================================================
(() => {
  const COL = { ink: '#1d1530', white: '#fff', red: '#ff3b3b', orange: '#ff8a1f', yellow: '#ffd21f', sky: '#5ec8ff', blue: '#2f6bff', green: '#7ad81e', pink: '#ff4fa3', violet: '#8a3ffc' };
  const A = Bourdi.api; let ctx = A.ctx();
  const { ln, ell } = Bourdi.chats;
  const { drawPerson, makePerson } = Bourdi.persos;
  const PX = 210, PY = 470;                     // Papa (pieds)
  const DUREE = 30;                            // durée de l'épreuve (s)

  let G;
  function nouvellePartie(){
    const papa = makePerson('empty'); papa.shirt = '#3a6ad8'; papa.pants = '#5b3a29'; papa.style = 'court'; papa.hair = '#3a2a20'; papa.skin = '#f2c294';
    G = { t: 0, count: -1.2, score: 0, hold: new Set(), fume: 0, papa, st: 'dos', pt: 2.4, flip: 0, end: 0, nuages: [], vu: 0, play: 0 };
  }
  const dur = () => Math.min(1.6, G.play / 19);                     // ça se corse au fil des 30 secondes
  const fumeTrop = () => G.hold.size > 0 || G.fume > .22;

  const snd = {
    count(go){ A.tone(0, go ? 1046 : 523, go ? .3 : .12, .08, 'square'); },
    tire(){ A.bruit(0, .18, .05, 'bandpass', 1800, 2, 900); },
    hum(){ A.tone(0, 180, .3, .08, 'sawtooth', 240); },
    atchoum(){ A.bruit(0, .12, .1, 'highpass', 2000, 1); A.tone(.12, 300, .25, .1, 'sawtooth', 120); A.bruit(.12, .3, .2, 'bandpass', 1200, 1); },
    tourne(){ A.bruit(0, .12, .05, 'bandpass', 900, 2, 2000); },
    vu(){ A.tone(0, 880, .12, .1, 'square'); A.tone(.12, 660, .12, .1, 'square'); A.tone(.24, 440, .3, .1, 'square'); }
  };

  function update(dt){
    G.t += dt;
    if (G.count < 0){ const b = Math.ceil(-G.count / .4); G.count += dt; const a = Math.ceil(-G.count / .4); if (a !== b) snd.count(a === 0); if (G.count >= 0) G.count = 0; return; }
    if (G.end){ if (G.end > 0 && G.t - G.end > 1.6){ G.end = -1; A.fin({ score: Math.round(G.score * 10) * 100 }); } return; }
    G.play += dt;
    if (G.play >= DUREE && G.st !== 'pris'){ G.end = G.t; G.hold.clear(); A.texte('Ça passe pour cette fois !', 180, 300, { size: 28, color: COL.green, dur: 1.5, vy: 0 }); A.sons.bien(); A.particules(180, 300, 40, { speed: 340 }); return; }
    const fumeNow = G.hold.size > 0 && G.st !== 'pris';
    if (fumeNow){ G.score += dt; G.fume = Math.min(1, G.fume + dt * 2.5); if (Math.random() < dt * 4) snd.tire();
      if (Math.random() < dt * 9) G.nuages.push({ x: 92 + Math.random() * 20, y: 560, r: 10, t: 0, vx: 20 + Math.random() * 30 }); }
    else G.fume = Math.max(0, G.fume - dt / .45);                     // la fumée met un peu de temps à partir
    G.nuages.forEach(n => { n.t += dt; n.x += n.vx * dt; n.y -= 30 * dt; n.r += 18 * dt; }); G.nuages = G.nuages.filter(n => n.t < 1.6);
    // Papa
    G.pt -= dt;
    if (G.st === 'dos' && G.pt <= 0){
      if (Math.random() < .25){ G.st = 'atchoum'; G.pt = .8; A.texte('Atchoum !', PX + 30, 210, { size: 30, color: COL.yellow, dur: .8 }); snd.atchoum(); }
      else { G.st = 'alerte'; G.pt = Math.max(.28, .85 - dur() * .36); A.texte('Hum ?', PX + 30, 210, { size: 32, color: COL.orange, dur: .7 }); snd.hum(); }
    }
    else if (G.st === 'atchoum' && G.pt <= 0){ G.st = 'dos'; G.pt = 1.4 + Math.random() * 2 - dur(); }
    else if (G.st === 'alerte' && G.pt <= 0){ G.st = 'tourne'; G.pt = .16; snd.tourne(); }
    else if (G.st === 'tourne'){ G.flip = 1 - G.pt / .16; if (G.pt <= 0){ G.flip = 1; G.st = 'face'; G.pt = 1.1 + Math.random() * .6;
      if (fumeTrop()) pris(); } }
    else if (G.st === 'face'){ if (fumeTrop()) pris(); else if (G.pt <= 0){ G.st = 'retour'; G.pt = .16; } }
    else if (G.st === 'retour'){ G.flip = G.pt / .16; if (G.pt <= 0){ G.flip = 0; G.st = 'dos'; G.pt = 1.6 + Math.random() * 2.2 - dur() * 1.1; } }
    else if (G.st === 'pris' && G.pt <= 0){ G.end = G.t; }
  }
  function pris(){
    G.st = 'pris'; G.pt = 1.4; G.vu = G.t; G.hold.clear();
    A.texte('JE T\'AI VU !', 180, 300, { size: 40, color: COL.red, dur: 1.3, vy: 0 }); A.dire('JE T\'AI VU !'); snd.vu(); A.secousse(12, .4);
  }

  // ---------- Dessin ----------
  function papaDos(x, y, sx){
    const p = G.papa;
    ctx.save(); ctx.translate(x, y); ctx.scale(sx, 1);
    A.blob(-24, -64, 20, 62, 8, p.pants, 3); A.blob(4, -64, 20, 62, 8, p.pants, 3);
    A.blob(-36, -150, 72, 92, 22, p.shirt, 4);
    // bras le long du corps, la télécommande dans la main droite (vu de dos)
    ln([[-34, -136], [-44, -86]], 15, COL.ink); ln([[-34, -136], [-44, -86]], 10, p.shirt); A.circle(-44, -82, 8, p.skin, 3);
    ln([[34, -136], [44, -86]], 15, COL.ink); ln([[34, -136], [44, -86]], 10, p.shirt);
    A.blob(38, -92, 12, 26, 4, '#2f2a3d', 2.5); A.circle(46, -82, 8, p.skin, 3);
    // tête vue de dos : que des cheveux et les oreilles
    A.circle(-30, -176, 8, p.skin, 3); A.circle(30, -176, 8, p.skin, 3);
    A.circle(0, -180, 32, p.skin, 4);
    ctx.beginPath(); ctx.arc(0, -180, 32, Math.PI * .85, Math.PI * 2.15); ctx.lineTo(0, -168); ctx.closePath(); ctx.fillStyle = p.hair; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = COL.ink; ctx.stroke();
    ctx.restore();
  }
  function draw(){
    ctx = A.ctx();
    // salon : Papa regarde la télé
    ctx.fillStyle = '#ffe3c2'; ctx.fillRect(-200, -300, 760, 1100);
    for (let x = -200; x < 560; x += 40){ ctx.fillStyle = '#ffd6a8'; ctx.fillRect(x, -300, 18, 770); }
    ctx.fillStyle = '#c98a5a'; ctx.fillRect(-200, 470, 760, 400); ln([[-200, 470], [560, 470]], 5, COL.ink);
    A.blob(96, 360, 228, 70, 8, '#8a5a3a', 5);                                                                                           // meuble télé
    A.blob(110, 176, 200, 132, 10, '#2f2a3d', 6);                                                                                       // la télé
    const tv = ['#5ec8ff', '#ffd21f', '#ff4fa3', '#7ad81e'][Math.floor(G.t * 1.5) % 4];
    A.rr(122, 188, 176, 108, 6); ctx.fillStyle = tv; ctx.fill(); A.circle(160 + Math.sin(G.t * 2) * 30, 250, 18, '#fff', 0); ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(122, 188, 176, 20);
    ln([[180, 308], [170, 360]], 6, COL.ink); ln([[240, 308], [250, 360]], 6, COL.ink);
    // Papa : de dos, puis il se retourne (on écrase l'image pour faire tourner le personnage)
    const f = G.flip;
    if (G.st === 'face' || G.st === 'pris' || (G.st === 'tourne' && f > .5) || (G.st === 'retour' && f > .5)){
      const sx = Math.max(.05, (f - .5) * 2);
      ctx.save(); ctx.translate(PX, PY); ctx.scale(sx, 1); ctx.translate(-PX, -PY);
      drawPerson(G.papa, PX, PY, 1.05, G.t, { expr: G.st === 'pris' ? 'shock' : 'smile' });
      if (G.st === 'pris'){ ctx.fillStyle = 'rgba(255,40,40,.25)'; ctx.beginPath(); ctx.arc(PX, PY - 190, 34, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    } else {
      const twitch = G.st === 'alerte' ? Math.sin(G.t * 40) * 3 : G.st === 'atchoum' ? Math.sin(G.t * 30) * 4 : 0;
      papaDos(PX + twitch, PY, f > 0 ? Math.max(.05, 1 - f * 2) : 1);
      if (G.st === 'alerte'){ ctx.save(); ctx.translate(PX + 22, PY - 190); ctx.rotate(.3); A.circle(0, 0, 10, G.papa.skin, 3); ctx.restore(); }
    }
    // la fumée
    G.nuages.forEach(n => { ctx.save(); ctx.globalAlpha = .75 * (1 - n.t / 1.6); A.circle(n.x, n.y, n.r, '#ffffff', 0); ctx.restore(); });
    if (G.fume > .05){ ctx.save(); ctx.globalAlpha = Math.min(.8, G.fume); [[110, 520, 34], [150, 490, 40], [190, 470, 30]].forEach(([x, y, r]) => A.circle(x + Math.sin(G.t + x) * 6, y, r * (.6 + G.fume * .4), '#f4f2fa', 0)); ctx.restore(); }
    // toi, au premier plan (vu de dos à gauche), la vapoteuse à la main
    const smoking = G.hold.size > 0 && G.st !== 'pris';
    ctx.save(); ctx.translate(90, 640);
    A.blob(-60, -60, 120, 90, 40, COL.pink, 5);
    A.circle(0, -96, 40, '#ffd9b8', 5);
    ctx.beginPath(); ctx.arc(0, -98, 41, Math.PI * .95, Math.PI * 2.05); ctx.closePath(); ctx.fillStyle = '#5b3a29'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = COL.ink; ctx.stroke();
    // main + vapoteuse : près de la bouche quand on fume, cachée sinon
    const hx = smoking ? 34 : 54, hy = smoking ? -86 : -10;
    ln([[40, -40], [hx, hy]], 18, COL.ink); ln([[40, -40], [hx, hy]], 12, COL.pink);
    ctx.save(); ctx.translate(hx + 6, hy - 6); ctx.rotate(smoking ? -.9 : .3); A.blob(-5, -24, 10, 30, 4, COL.violet, 3); A.blob(-3, -30, 6, 8, 2, COL.ink, 0); A.circle(0, 0, 2, smoking ? COL.sky : '#666', 0); ctx.restore();
    A.circle(hx, hy, 9, '#ffd9b8', 3);
    ctx.restore();
    // HUD
    A.bigNum((Math.floor(G.score * 10) / 10).toFixed(1).replace('.', ','), 196, 46, 50, { align: 'right' });
    A.txt('s', 206, 58, 22, COL.white, { lw: 6, align: 'left' });
    const left = Math.max(0, 1 - G.play / DUREE);
    A.blob(30, 86, 300, 18, 9, '#fff', 4); if (left > 0){ A.rr(34, 90, 292 * left, 10, 5); ctx.fillStyle = left < .2 ? COL.red : COL.violet; ctx.fill(); }
    // gros bouton FUMER
    ctx.fillStyle = COL.ink; ctx.fillRect(-200, 690, 760, 300);
    const held = G.hold.size > 0, dy = held ? 4 : 0;
    A.rr(150, 622, 196, 70, 24); ctx.fillStyle = '#000'; ctx.fill();
    A.blob(150, 616 + dy, 196, 70, 24, held ? COL.green : COL.violet, 4, '#000');
    A.txt('FUMER', 248, 652 + dy, 32, COL.white, { lw: 8 });
    if (G.count < 0){ const n = Math.ceil(-G.count / .4), fr = (-G.count % .4) / .4;
      ctx.save(); ctx.translate(180, 330); const s = .7 + fr * .6; ctx.scale(s, s); A.bigNum(String(n), 0, 0, 120); ctx.restore(); }
  }
  function heart(x, y, full){
    ctx.save(); ctx.translate(x, y); ctx.beginPath();
    ctx.moveTo(0, 10); ctx.bezierCurveTo(-22, -6, -12, -22, 0, -10); ctx.bezierCurveTo(12, -22, 22, -6, 0, 10); ctx.closePath();
    ctx.fillStyle = full ? COL.red : '#5a5070'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = COL.white; ctx.stroke(); ctx.restore();
  }

  function down(p, id){ if (G.count < 0 || G.end || G.st === 'pris') return; if (p.y > 560) G.hold.add(id); }
  function up(p, id){ if (id === 'all') G.hold.clear(); else G.hold.delete(id); }

  function vignette(c, x, y, w, h, t){
    ctx = c; const k = h / 230;
    c.save(); c.translate(x + w / 2, y + h); c.scale(k, k); c.translate(-150, -230);
    c.fillStyle = '#d6f5e3'; c.fillRect(-200, -50, 700, 400); c.fillStyle = '#c98a5a'; c.fillRect(-200, 200, 700, 100);
    const save = G; G = { t, papa: { shirt: '#3a6ad8', pants: '#5b3a29', skin: '#f2c294', hair: '#3a2a20' } };
    c.save(); c.translate(0, 200 - 470 * .8); c.scale(.8, .8); papaDos(230 / .8 + 0, 470, 1); c.restore(); G = save;
    for (let i = 0; i < 4; i++){ const s = (t * .5 + i / 4) % 1; c.save(); c.globalAlpha = .8 * (1 - s); A.circle(80 + s * 50, 170 - s * 90, 14 + s * 20, '#fff', 0); c.restore(); }
    A.blob(52, 150, 12, 36, 4, COL.violet, 3);
    A.txt('Hum ?', 240, 40, 28, COL.orange, { lw: 7 });
    c.restore();
  }

  Bourdi.ajouter({
    id: 'fumette', titre: 'Fumette à haut risque', court: 'Fumette',
    consigne: 'Garde le doigt appuyé pour vapoter, et lâche avant que Papa se retourne ! Attention : la fumée met un peu de temps à partir.',
    plusPetitGagne: false,
    seuils: { S: 15000, A: 12000, B: 9000, C: 6000, D: 3000 },
    format: ms => (Math.max(0, ms) / 1000).toFixed(1).replace('.', ',') + ' s',
    musique: 'jeu', vignette,
    start(){ ctx = A.ctx(); nouvellePartie(); },
    update, draw, down, up, etat: () => G
  });
})();

</script>
